# ============================================
# CMX Container 应用配置文件模板
# ============================================
# 本文件为完整的配置模板，包含所有可用配置项及默认值说明
# 复制此文件为 config.toml 或 dev.toml 使用

# ============================================
# 服务器配置
# ============================================
[server]
# 监听地址（可选，默认 0.0.0.0）
# 设置服务器绑定的 IP 地址，0.0.0.0 表示监听所有网络接口
host = "0.0.0.0"
# 监听端口（可选，默认 8080）
# 设置服务器监听的 TCP 端口号
port = 8080
## Nacos 注册 IP（可选，留空则自动获取本机 IP），用于服务注册到 Nacos 时的 IP 地址
# ip = "192.168.1.100"

# ============================================
# Web 服务配置
# ============================================
# Web 静态文件目录（必需）
web_folder = "./web-folder"

# ============================================
# 部署模式配置
# ============================================
# 启动期契约：决定数据源加载策略、app_id 取值、模块导入守卫。
# - mono（默认）：单体模式，一个进程服务所有域/应用/模块
#   * 数据源：加载 cmx_sys_datasource 中所有 status=1/archived=0 的记录（忽略 D-A-M 过滤）
#   * app_id：固定返回 "default"（不读 [app].module_code）
#   * 模块导入：允许任意 module_code 的模块包
#   * 支持主库 + 业务库分库部署（常见用法，不强制同库）
#   * [app] 块整体不生效（可省略或保留作 micro 切换预留）
# - micro       ：微服务模式，一个进程只服务 [app] 三元组指定的模块
#   * 数据源：按 [app] 三元组精确过滤
#   * app_id：返回 [app].module_code
#   * 模块导入：要求 module_code == app_id
#   * [app] 三元组必需，缺省值 default 会被拒绝启动
# 支持环境变量覆盖：DEPLOY__MODE
[deploy]
# 部署模式（可选，默认 mono）
mode = "mono"

# ============================================
# 应用标识配置（仅 micro 模式生效）
# ============================================
# 当前实例所属的域/应用/模块。
# mono 模式下本块整体不生效（get_app_id 固定返回 "default"，数据源不按此过滤）。
# micro 模式下用于数据源过滤、插件/服务隔离（app_id = module_code）、模块导入守卫。
# 支持环境变量覆盖：APP__DOMAIN_CODE / APP__APPLICATION_CODE / APP__MODULE_CODE
[app]
# 所属域编码（micro 必需，默认 default）
domain_code = "default"
# 所属应用编码（micro 必需，默认 default）
application_code = "default"
# 所属模块编码（micro 必需，默认 default；决定 app_id）
module_code = "default"

# ============================================
# 数据库配置
# ============================================
# databases 是一个数组，可以配置多个数据源
# 每个数据源必须有一个唯一的 db_id 作为标识

[[databases]]
# 数据源唯一标识符（必需，用于程序内部引用）
db_id = "primary"
# 数据库类型：postgres | mysql | sqlite（必需）
db_type = "postgres"
# 数据库连接 URL（必需）
# 格式: <driver>://<user>:<password>@<host>:<port>/<database>
db_url = "postgresql://postgres:postgres@localhost:5432/cmx"
## 数据源名称（可选，默认从 db_url 解析数据库名作为显示名称，便于运维识别）
# db_name = "cmx"
# 是否为默认数据库，默认为 false
# 多个数据源时只有一个应为 true
default = true
## 数据源类型（可选，默认按 default 标志判定：default=true 时为 default，否则为 other）
## 取值：default-默认库，biz-业务库，other-其他
# source_type = "default"
## 数据库 schema（可选，PostgreSQL 默认为 public）
# db_schema = "public"

# 连接池配置（可选，使用默认值时可省略）
[databases.pool_config]
# 最大连接数（可选，默认 10，生产环境建议 20-50，测试环境为 1）
max_connections = 20
# 最小空闲连接数（可选，默认 2）
min_connections = 5
# 连接超时时间（秒，可选，默认 30）
connect_timeout = 30
# 获取连接超时时间（秒，可选，默认 30）
# 连接池耗尽时等待可用连接的超时时间，超出后返回错误而非无限期等待
acquire_timeout = 30
# 空闲连接超时时间（秒，可选，默认 600）
# 空闲连接在此时间后会被关闭
idle_timeout = 600
# 连接最大生命周期（秒，可选，默认 1800）
# 连接存活超过此时间后会被替换
max_lifetime = 1800

# 健康检查配置（可选）
# 健康检查间隔（秒，可选，默认 60）
health_check_interval = 60
# 健康检查超时时间（秒，可选，默认 5）
health_check_timeout = 5

## 第二个数据源示例（可选，根据需要添加更多数据源）
# [[databases]]
# db_id = "secondary"
# db_type = "postgres"
# db_url = "postgresql://user:password@192.168.1.100:5432/cmx"
# default = false
## db_name = "cmx-biz"
## source_type = "biz"
# [databases.pool_config]
# max_connections = 10
# min_connections = 2
# connect_timeout = 30
# acquire_timeout = 30
# idle_timeout = 600
# max_lifetime = 1800
# health_check_interval = 60
# health_check_timeout = 5

# ============================================
# Redis 配置
# ============================================
[redis]
# Redis 连接地址（必需，格式: redis://host:port/db）
url = "redis://localhost:6379/13"
## Redis 运行模式：Standalone（单机）或 Cluster（集群）
#mode = "Standalone"
## 集群节点地址（集群模式时必填，逗号分隔）
# cluster_urls = "redis://node1:6379,redis://node2:6379,redis://node3:6379"
## Pub/Sub 心跳间隔（秒，0 表示禁用，可选，默认 30）
# heartbeat_interval = 30
## 连接超时时间（秒，可选，默认 5）
# connection_timeout = 5
## 操作超时时间（秒，可选，默认 3）
# operation_timeout = 3
## 默认键前缀（可选，默认 "cmx:"）
# key_prefix = "cmx:"
## 启动时自动订阅的频道（可选，逗号分隔，需填写完整频道名，不会自动加前缀）
# subscribe_channels = "cmx:plugin:changed"
## 启动时自动订阅的模式（可选，逗号分隔，支持通配符 * ? []，需填写完整模式，不会自动加前缀）
# subscribe_patterns = "cmx:*"



# ============================================
# 模板配置
# ============================================
[templates]
# 模板目录路径（可选，默认 "crates/libs/cmx-dev/templates"）
path = "crates/libs/cmx-dev/templates"

# ============================================
# Code Server 配置
# ============================================
[code_server]
# code-server 服务 URL（可选，用于在线开发功能）
url = "https://dev.cloudmatrix.one:18080/"

# Code Server 扩展服务器配置（可选，用于自调试）
[code_server_extension_server]
url = "http://127.0.0.1:9000"

# ============================================
# WASM 运行时配置
# ============================================
[runtime]
# 内存限制（页数），每页 64KB，可选，默认 4096 页（256MB）
memory_max = 4096
# 单次调用超时时间（秒），可选，默认 30
timeout = 30
# 实例池最大实例数，可选，默认使用 CPU 核心数
pool_max_instances = 8
# Fuel 限制（0 表示不限制），单位：Wasm 指令数，可选，默认 0
# 设置此值可防止死循环和恶意代码消耗过多 CPU
fuel_limit = 0

# ============================================
# 插件配置
# ============================================
[plugin]
# 插件安装根目录（必需）
install_root = "plugins/root"
# 插件备份目录（必需，用于插件升级时备份旧版本）
backup_root = "plugins/backup"
# 插件解压临时目录（必需）
temp_root = "plugins/temp"
# 插件上传临时目录（必需）
upload_root = "plugins/uploads"

## 定时一致性校验间隔（可选，单位：秒，默认 60），对比数据库与本地 Registry，自动补偿差异。设为 0 禁用。
# reconciliation_interval_secs = 60

# 自动安装配置（可选）
[plugin.auto_install]
# 是否启用自动安装，可选，默认 false
enabled = false
## 自动安装的插件列表示例（enabled 为 true 时生效）
# [[plugin.auto_install.plugins]]
# plugin_id = "cmx-debug"
# version = "1.0.0"
# source_type = "local"
# source_path = "plugins/source/cmx-debug.zip"
# 是否为关键插件，关键插件安装失败会导致应用启动失败
# is_critical = true

# ============================================
# 数据库迁移配置
# ============================================
[migration]
# 是否启用迁移（可选，默认 false）
# 启用后会在应用启动时自动执行待执行的数据库迁移
enabled = false
# 迁移文件目录（必需，存放 SQL 迁移文件）
dir = "docs/sql/migrations"
# 校验文件内容是否被修改，可选，默认 true
# 启用后会校验迁移文件的 MD5 校验和，防止手动修改导致的不一致
validate_checksum = true
# 分布式锁超时时间（秒），可选，默认 60
# 多节点部署时用于防止并发执行迁移
lock_timeout = 60

# ============================================
# 文件存储配置
# ============================================
[storage]
# 默认存储平台标识符（可选，不设置则自动选择第一个已启用的存储实例）
default_platform = "local-1"

# 本地文件系统存储示例
[[storage.instances]]
# 存储平台唯一标识符（必需）
platform = "local-1"
# 存储类型：local（本地文件系统）或 s3（S3 兼容对象存储），必需
storage_type = "local"
# 是否启用该存储平台，可选，默认 true
enable_storage = true
# 文件访问基础域名，注意应以 / 结尾（可选）
# 用于拼接生成文件的访问 URL
domain = "http://localhost:8080/files/"
# 存储路径基础前缀，所有上传文件路径都会以此为前缀（可选）
base_path = "uploads"
# 是否启用直接访问，可选，默认 false
# 启用后可通过 storage_path 直接访问文件
enable_access = true
# 文件路径匹配模式（可选）
path_patterns = "**/*"
# 本地存储物理根目录路径，仅 local 类型生效
storage_path = "./storage"

## MinIO / S3 兼容对象存储示例
# [[storage.instances]]
# platform = "amazon-s3-1"
# storage_type = "s3"
# enable_storage = true
## S3 Access Key ID
# access_key = "your-access-key"
## S3 Secret Access Key
# secret_key = "your-secret-key"
## S3 区域，如 us-east-1
# region = "us-east-1"
## S3 API 端点 URL，支持 MinIO、腾讯云 COS、阿里云 OSS 等
# endpoint = "http://localhost:9000/"
## S3 桶名称
# bucket_name = "my-bucket"
## 文件访问基础域名
# domain = "http://localhost:9000/"
## 存储路径基础前缀
# base_path = "app/"

# ============================================
# 基础服务中心配置
# ============================================
# 插件生命周期与外部基础服务中心（门户中心、权限中心、表单中心、流程中心）
# 之间的数据交互配置
[center_client]
# 模块资源(表单/菜单/元数据/权限)导入导出的部署模式。
# - local(默认,或任意非远程值):本地模式,定义导入器直调本地
#   Service(FormService/MenuService/TableMetadataService/PermissionServiceImpl),
#   无网络开销,适用于单体部署。
# - grpc:远程模式,经 gRPC 调用专门中心(CmxPluginDataService),
#   需启用 [rpc] 并配置 [center_client.discovery] 的各中心服务名。
# - http_url:远程模式,经 HTTP multipart form-data POST 到 [center_client.urls] 配置的各中心 URL。
# - http_discovery:远程模式,经服务发现解析实例地址后走 HTTP,
#   需配置 [center_client.discovery] 的各中心服务名。
# 远程模式下本节点仍可作为接收端(PluginDataImporterImpl 已注入 form/menu 本地导入器)。
mode = "local"
# 请求超时时间（毫秒，可选，默认 30000）
# 各基础服务中心 HTTP 请求的超时时间（仅 http_url / http_discovery 模式生效）
timeout_ms = 30000

# URL 直连模式配置（mode = "http_url" 时生效）
# 每个中心对应一个独立的 URL 配置项
# 环境变量覆盖：CENTER_CLIENT__URLS__MENU, CENTER_CLIENT__URLS__PERM 等
[center_client.urls]
## 门户中心（菜单数据）URL
# menu = "http://portal-center:8080/api/plugin/menu/import"
## 权限中心（权限数据）URL
# perm = "http://perm-center:8080/api/iam/permissions/import"
## 表单中心（表单数据）URL
# form = "http://form-center:8080/api/plugin/form/import"
## 流程中心（流程定义）URL
# flow = "http://flow-center:8080/api/plugin/flow/import"

# 服务发现模式配置（mode = "http_discovery" 或 "grpc" 时生效）
# 通过 Nacos 服务发现获取各中心的实例地址
# [center_client.discovery]
## Nacos 分组（可选，默认 DEFAULT_GROUP）
# nacos_group = "DEFAULT_GROUP"
## 门户中心服务名
# menu_service = "cmx-portal-center"
## 权限中心服务名
# perm_service = "cmx-perm-center"
## 表单中心服务名
# form_service = "cmx-form-center"
## 流程中心服务名
# flow_service = "cmx-flow-center"

# ============================================
# RPC 配置
# ============================================
[rpc]
# 是否启用 RPC（可选，默认 false）
enabled = false
# 通信协议（目前仅支持 "grpc"）
protocol = "grpc"
# 预热服务列表（启动时预先发现的服务名）
warmup_services = []

[rpc.grpc]
# gRPC 监听端口
port = 9090
# RPC 调用超时时间（毫秒，可选，默认 30000），通过 volo rpc_timeout 设置
timeout_ms = 30000
# 连接超时时间（毫秒，可选，默认 3000），通过 volo connect_timeout 设置
connect_timeout_ms = 3000
# 重试次数（可选，默认 0，仅对可重试错误重试：UNAVAILABLE/DEADLINE_EXCEEDED/RESOURCE_EXHAUSTED/ABORTED）
retry_count = 0
## 默认服务分组（可选，None 表示不按分组过滤，用于多机房/多 region 部署）
# default_group = "DEFAULT_GROUP"
## 默认集群列表（可选，空表示不过滤，用于多机房/多 region 部署）
# default_clusters = []
## 服务发现变更通知通道容量（可选，默认 1024，用于缓冲高频服务变更如 k8s 滚动更新）
# discover_channel_capacity = 1024

# ============================================
# 服务对外身份配置
# ============================================
# 本服务作为调用方时携带的服务级凭证，用于 gRPC / HTTP 跨服务调用的 M2M 鉴权。
# 凭证须同时在下方 [[auth.static_api_keys]] 注册，否则接收端 mw_auth 无法验证。
# 单体无跨服务调用场景可留空（默认）。
[service_auth]
# 本服务对外服务级凭证（cmx_sk_xxx）
# 留空表示不配置服务身份（RPC 出站不携带服务凭证，HTTP 跨服务调用无法通过 mw_auth）
outgoing_api_key = ""

# ============================================
# 注册中心服务实例 metadata
# ============================================
# 注册到注册中心的服务实例附加元数据，所有注册中心类型通用。
# grpc_port 由 [rpc.grpc].port 自动注入，无需手动配置。
# [registry.metadata]
## 自定义元数据（可选）
# version = "1.0.0"
# region = "cn-east"

# ============================================
# 认证配置
# ============================================
[auth.jwt]
# JWT 签名算法（可选，默认 HS256，支持 RS256）
algorithm = "HS256"
# HMAC 密钥（HS256 模式必需，生产环境务必修改）
# RS256 模式时不使用此项，改用 private_key/public_key
secret = "a7k9m2p4x8q1w5e3r6t0y7u2i9o4p1"
# JWT 签发者（可选，默认 cmx-auth）
issuer = "cmx-auth"
# JWT 受众（可选，默认 cmx-platform）
audience = "cmx-platform"
## RS256 私钥（支持文件路径或 PEM 内容，生产环境建议文件路径 + chmod 600）
## algorithm = "RS256" 时必需
# private_key = "/path/to/private.pem"
## RS256 公钥（支持文件路径或 PEM 内容）
## algorithm = "RS256" 时必需
# public_key = "/path/to/public.pem"
## 当前签发使用的密钥 ID（可选，用于密钥轮换标识）
# current_kid = "key-2026-01"

# 旧密钥列表（密钥轮换宽限期，可选）
# 格式：[[auth.jwt.legacy_public_keys]]，每个条目包含 kid 和 pem
# 宽限期内旧 kid 签发的 Token 仍可通过旧公钥验签
## 旧密钥列表示例（最多 5 个）
# [[auth.jwt.legacy_public_keys]]
# kid = "key-2025-12"
# pem = "/path/to/old-public.pem"

[auth.argon2]
# 内存开销（KB，可选，默认 65536 = 64MB）
# 值越大抗 GPU 破解能力越强，但消耗更多内存
memory_cost = 65536
# 时间开销（可选，默认 3）
# 迭代次数，值越大哈希越慢但越安全
time_cost = 3
# 并行度（可选，默认 4）
# 并行线程数，需与 CPU 核心数匹配
parallelism = 4

[auth.token]
# Access Token 有效期（秒，可选，默认 1800 = 30 分钟）
access_ttl_secs = 1800
# Refresh Token 有效期（秒，可选，默认 604800 = 7 天）
refresh_ttl_secs = 604800

[auth.session]
# 同一设备类型是否只允许一个会话（可选，默认 false）
single_session_per_device_type = false
# 最大会话数（可选，0 = 不限制）
max_sessions = 0
# 空闲超时时间（秒，可选，默认 86400 = 24 小时）
# 超过此时间无心跳的会话将被清理
idle_timeout_secs = 86400
# 心跳间隔（秒，可选，默认 300 = 5 分钟）
# 客户端需定时调用 /api/auth/heartbeat 续期
heartbeat_interval_secs = 300

[auth.cache]
# 是否启用本地缓存（可选，默认 true）
enable_local_cache = true
# 本地缓存 TTL（秒，可选，默认 30）
# 安全敏感场景建议设为 5 秒以下
local_ttl_secs = 30
# 本地缓存最大容量（可选，默认 10000）
local_cache_max_entries = 10000
# 登录失败锁定阈值（可选，默认 5 次）
max_login_attempts = 5
# 账号锁定时长（秒，可选，默认 900 = 15 分钟）
lock_duration_secs = 900

# ==================== 认证白名单（可选） ====================
# 路径规则列表，请求路径匹配任一规则即视为无需认证。
# 内置白名单始终生效（登录/刷新/OAuth2 流程/文档/健康检查等），
# 此处配置为用户自定义追加项，会与内置白名单合并去重。
# 留空或注释掉则仅使用内置白名单。
#
# 匹配规则：
# - 普通规则（不含通配符）：前缀匹配，如 /api/public 匹配 /api/public/anything
# - * 通配符：匹配单层路径段（不含 /），如 /api/biz/* 匹配 /api/biz/users
# - ** 通配符：匹配多层路径（含 /），如 /api/auth/** 匹配 /api/auth/a/b/c
# - ? 通配符：匹配单个非 / 字符，如 /api/v?/users 匹配 /api/v1/users
#
## 配置示例：白名单（可选，默认 [] 仅使用内置白名单）
# whitelist = ["/api/public", "/api/v1/webhook", "/api/biz/*", "/api/docs/**"]
#
# 注意：AI SSE 端点 GET /api/ai/events 因 EventSource 无法发 Authorization header，
# 需加入白名单（由 handler 内部校验 query access_token）。启用 AI 功能时取消下行注释：
# whitelist = ["/api/ai/events"]
auth.whitelist = []

# ==================== OpenCode AI 中继配置（可选） ====================
# cmx-ai 薄代理连接 OpenCode（:4096）的配置。环境变量优先级高于本段：
#   OPENCODE_BASE_URL > opencode.base_url > 默认 http://127.0.0.1:4096
#   OPENCODE_SERVER_PASSWORD > opencode.password > 无密码
# 一期不持久化会话、不保存生成产物；二期演进为胖代理时新增 session_store 配置。
[opencode]
# OpenCode 服务地址（含协议与端口）。对应 `opencode serve --host 0.0.0.0 --port 4096`。
base_url = "http://127.0.0.1:4096"
# OpenCode 访问凭证（OPENCODE_SERVER_PASSWORD）。开发环境可留空（OpenCode 不启用鉴权）；
# 生产部署必须配置强密码，cmx-ai 所有请求（含 SSE）会以 Authorization: Bearer 携带。
# password = ""
# 普通 HTTP 请求（创建会话/发消息/abort 等）超时时间（毫秒），默认 30000。
request_timeout_ms = 30000
# SSE 长连接心跳/健康检查周期（秒），默认 30（OpenCode 每 10 秒推送 server.heartbeat）。
sse_heartbeat_secs = 30

# ==================== OAuth2 配置（可选） ====================
[auth.oauth2]
# === Authorization Server 配置 ===
## 授权码有效期（秒，可选，默认 600 = 10 分钟）
# auth_code_ttl_secs = 600
## 是否强制 PKCE（可选，默认 true，生产环境建议开启）
# pkce_required = true

# === 第三方 OAuth2 Provider 对接 ===
## Provider state 有效期（秒，可选，默认 600）
# state_ttl_secs = 600
## 回调授权码有效期（秒，可选，默认 30）
# callback_code_ttl_secs = 30
## 第三方 OAuth2 登录成功后重定向到前端的 URL
## 回调时拼接为：{frontend_callback_url}?code={one_time_code}&state={original_state}
# frontend_callback_url = "https://app.example.com/auth/callback"

# 第三方账号关联策略
[auth.oauth2.account_link]
## 是否根据邮箱自动关联已有本地用户（默认 false，要求 Provider 邮箱已验证）
# auto_link_by_email = false
## 是否根据用户名自动关联已有本地用户（默认 false，企业场景常用），仅对可信 Provider 启用：username 无"已验证"概念，恶意 Provider 可关联任意本地账号
# auto_link_by_username = true
## 是否自动注册新用户（默认 true，需手动绑定或管理员创建）
# auto_register = true
## 自动注册时的默认角色（role_code，如 "user"）
# default_role = "user"
# 用户名生成策略：provider_prefix | provider_user_id | username | email_prefix | display_name
# - provider_prefix: {provider}_{provider_user_id}，如 google_1234567890
# - provider_user_id: 直接使用 Provider 用户 ID，如 1234567890
# - username: 直接使用 Provider 返回的 username 字段，缺失时回退到 username
# - email_prefix: 邮箱 @ 前部分，如 user from user@gmail.com
# - display_name: 使用昵称，冲突时追加随机后缀
## 用户名生成策略（可选，默认 username）
# username_strategy = "username"

## Google OAuth2（示例，需替换为实际值）
# [[auth.oauth2.providers]]
# name = "google"
# display_name = "Google"
# provider_type = "google"
# client_id = "your-google-client-id.apps.googleusercontent.com"
# client_secret = "your-google-client-secret"
# redirect_uri = "https://your-domain.com/api/auth/oauth2/provider/google/callback"
# scopes = ["openid", "email", "profile"]
# enabled = true

## GitHub OAuth2（示例，需替换为实际值）
# [[auth.oauth2.providers]]
# name = "github"
# display_name = "GitHub"
# provider_type = "github"
# client_id = "your-github-client-id"
# client_secret = "your-github-client-secret"
# redirect_uri = "https://your-domain.com/api/auth/oauth2/provider/github/callback"
# scopes = ["user:email", "read:user"]
# enabled = true

## 通用 OAuth2 Provider 示例（适用于任何标准 OAuth2 服务）
# [[auth.oauth2.providers]]
# name = "gitlab"
# display_name = "GitLab"
# provider_type = "generic"
# client_id = "your-gitlab-application-id"
# client_secret = "your-gitlab-secret"
# redirect_uri = "https://your-domain.com/api/auth/oauth2/provider/gitlab/callback"
# authorize_url = "https://gitlab.com/oauth/authorize"
# token_url = "https://gitlab.com/oauth/token"
# userinfo_url = "https://gitlab.com/api/v4/user"
# scopes = ["read_user", "email"]
# token_endpoint_auth_method = "client_secret_post"
# enabled = false
## 字段映射使用内联表（标准字段名 = JSON 字段名，支持 number 类型自动转 string）
# field_mapping = { provider_user_id = "id", email = "email", username = "username", display_name = "name", avatar_url = "avatar_url" }
#
# === 通用 Provider 高级配置（企业 CAS / 自定义 OAuth2 服务） ===
## Token 响应嵌套路径（点分路径，如 "data"，空字符串表示无包装）
# token_response_path = ""
## Token 响应字段映射（标准字段名 = 厂商字段名）
# token_field_mapping = { access_token = "accessToken", expires_in = "expire" }
## 用户信息端点请求方法：GET（默认）或 POST
# userinfo_method = "GET"
## 用户信息端点 token 传递方式：bearer（默认）/ query / form
# userinfo_token_param = "bearer"
## 用户信息端点额外参数
# [auth.oauth2.providers.userinfo_extra_params]
# client_id = "xxx"
## 用户信息响应嵌套路径（点分路径，如 "data"）
# userinfo_response_path = ""
## 授权 URL 额外参数（如 Azure AD resource 参数）
# [auth.oauth2.providers.authorize_extra_params]
# resource = "xxx"
## 是否跳过 SSL 证书验证（仅内网自签名证书场景，默认 false）
# skip_ssl_verification = false

# ============================================
# 超管初始化配置（可选，未配置时使用默认账号 admin/cmxadmin）
# ============================================
# [auth.super_admin]
## 超管用户名（可选，默认 "admin"）
# username = "admin"
## 超管密码（可选，默认 "cmxadmin"，每次启动同步到数据库）
# password = "a7k9m2p4x8q1w5e3r6t0y7u2i9o4p1"
## 超管邮箱（可选）
# email = "admin@example.com"
## 超管角色编码（可选，默认 ["admin"]）
# roles = "admin"

# ============================================
# IAM 权限管理配置
# ============================================
[iam]
## IAM 数据库 db_id（可选，默认使用 default_db_id），指定 IAM 表（cmx_user/cmx_role/cmx_permission 等）所在的数据源标识
# auth_db_id = "primary"
# 密码最小长度（可选，默认 8）
password_min_length = 8
# 内置角色编码列表（可选，默认 ["admin"]），内置角色不可删除，多个编码用逗号分隔
builtin_role_codes = "admin"
## 权限缓存 TTL（秒，可选，默认 300），预留配置，当前权限检查依赖 AuthContext 内存查询
## 未来若引入 IamChecker 本地缓存（moka），此配置控制缓存过期时间
# permission_cache_ttl_secs = 300
# 权限一致性校验模式（可选，默认 "warn"）
# 启动时比对代码声明的权限码（inventory）与 DB cmx_permission 表中的记录
# - "panic": 代码声明的权限在 DB 中缺失时，启动 panic（强制开发者手动创建 DB 记录）
# - "warn":  仅告警并输出建议执行的 DDL，不阻断启动
# - "off":   不校验
permission_consistency_mode = "warn"
## 是否启用 SoD（职责分离互斥）规则校验（可选，默认 true），开启后，分配角色/权限时会校验互斥规则（功能权限互斥 + 角色互斥）
## 规则数据存储于 cmx_exclusion_rule 表；当规则表为空时校验直接通过（无规则=不拦截），可安全开启
## 需配合 cmx_exclusion_rule 表配置规则数据；如需关闭可显式设为 false
enable_sod_check = true
## 临时授权清理任务执行间隔（秒，可选，默认 3600），定时将过期的 cmx_user_role_assignment 记录标记为已撤销
# assignment_cleanup_interval_secs = 3600
## 审计日志批量阈值（可选，默认 100），临时授权批量过期时，超过此阈值则聚合为统计记录而非逐条审计
# audit_batch_size = 100
# 故障降级策略（可选，默认 "FailClose"），DB/缓存故障时的权限检查降级行为
# - "FailClose": 全部拒绝（更安全）
# - "FailOpen":  仅放行 system:all 用户
failure_mode = "FailClose"
## 熔断阈值：连续失败次数（可选，默认 5）
# circuit_breaker_threshold = 5
## 熔断恢复时间（秒，可选，默认 60）
# circuit_breaker_reset_secs = 60

# ============================================
# IAM 路由权限映射（可选）
# ============================================
# 配置 API 路由到权限码的映射，mw_permission 中间件据此进行权限校验。
# 未配置映射的路由默认放行（白名单模式）。
# 拥有 system:all 权限的用户自动放行所有路由。
#
# 格式：路由路径 = "权限码"
# 路由路径支持最长前缀匹配，如 "/api/iam/users" 会匹配 "/api/iam/users/123"
#
## IAM 路由权限映射示例
# [iam_permissions]
# "/api/iam/users" = "user:read"
# "/api/iam/roles" = "role:read"
# "/api/iam/permissions" = "permission:read"

# ============================================
# 静态 API Key 配置（可选）
# ============================================
# 简化用法：只需配置 `key`，key_prefix 自动从 key 前 8 位提取。
# 启动时会在日志中打印每个导入的 key（明文）和 prefix，便于复制使用。
# 警告：明文 Key 会输出到启动日志，请确保日志文件访问安全。
#
## 示例 1：简化用法（推荐）
# [[auth.static_api_keys]]
# key = "cmx_sk_Ab3dEf9hJkLmN2pQrStUvWxYz123456"
# service_name = "billing-service"
#
## 示例 2：完整用法（显式指定 key_prefix）
# [[auth.static_api_keys]]
# key_prefix = "cmx_stat"
# key = "your-static-api-key-here"
# user_id = "system"
# service_name = "internal-service"
# scopes = "read,write"
# description = "内部服务 API Key"
