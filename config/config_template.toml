# ============================================
# CMX Container 应用配置文件模板
# ============================================
# 本文件为完整的配置模板，包含所有可用配置项及默认值说明
# 复制此文件为 config.toml 或 dev.toml 使用

# ============================================
# 服务器配置
# ============================================
[server]
# 监听地址（可选，默认 0.0.0.0）
# 设置服务器绑定的 IP 地址，0.0.0.0 表示监听所有网络接口
host = "0.0.0.0"
# 监听端口（可选，默认 8080）
# 设置服务器监听的 TCP 端口号
port = 8080
# Nacos 注册 IP（可选，留空则自动获取本机 IP）
# 用于服务注册到 Nacos 时的 IP 地址
# ip = "192.168.1.100"

# ============================================
# Web 服务配置
# ============================================
# Web 静态文件目录（必需）
web_folder = "./web-folder"

# ============================================
# 数据库配置
# ============================================
# databases 是一个数组，可以配置多个数据源
# 每个数据源必须有一个唯一的 db_id 作为标识

[[databases]]
# 数据源唯一标识符（必需，用于程序内部引用）
db_id = "primary"
# 数据库类型：postgres | mysql | sqlite（必需）
db_type = "postgres"
# 数据库连接 URL（必需）
# 格式: <driver>://<user>:<password>@<host>:<port>/<database>
db_url = "postgresql://postgres:postgres@localhost:5432/cmx"
# 是否为默认数据库，默认为 false
# 多个数据源时只有一个应为 true
default = true
# 数据库 schema（可选，PostgreSQL 默认为 public）
# db_schema = "public"

# 连接池配置（可选，使用默认值时可省略）
[databases.pool_config]
# 最大连接数（可选，默认 10，生产环境建议 20-50，测试环境为 1）
max_connections = 20
# 最小空闲连接数（可选，默认 2）
min_connections = 5
# 连接超时时间（秒，可选，默认 30）
connect_timeout = 30
# 空闲连接超时时间（秒，可选，默认 600）
# 空闲连接在此时间后会被关闭
idle_timeout = 600
# 连接最大生命周期（秒，可选，默认 1800）
# 连接存活超过此时间后会被替换
max_lifetime = 1800

# 健康检查配置（可选）
# 健康检查间隔（秒，可选，默认 60）
health_check_interval = 60
# 健康检查超时时间（秒，可选，默认 5）
health_check_timeout = 5

# 第二个数据源示例（可选，根据需要添加更多数据源）
# [[databases]]
# db_id = "secondary"
# db_type = "postgres"
# db_url = "postgresql://user:password@192.168.1.100:5432/cmx"
# default = false
# [databases.pool_config]
# max_connections = 10
# min_connections = 2
# connect_timeout = 30
# idle_timeout = 600
# max_lifetime = 1800
# health_check_interval = 60
# health_check_timeout = 5

# ============================================
# Redis 配置
# ============================================
[redis]
# Redis 连接地址（必需，格式: redis://host:port/db）
url = "redis://localhost:6379/13"
# Redis 运行模式：standalone（单机）或 cluster（集群），可选，默认 standalone
# mode = "standalone"
# 集群节点地址（集群模式时必填，逗号分隔）
# cluster_urls = "redis://node1:6379,redis://node2:6379,redis://node3:6379"
# Pub/Sub 心跳间隔（秒），0 表示禁用，可选，默认 30
# heartbeat_interval = 30
# 连接超时时间（秒），可选，默认 5
# connection_timeout = 5
# 操作超时时间（秒），可选，默认 3
# operation_timeout = 3
# 默认键前缀，可选，默认 "cmx:"
# key_prefix = "cmx:"
# 启动时自动订阅的频道（逗号分隔，需填写完整频道名，不会自动加前缀）
# subscribe_channels = "cmx:plugin:changed"
# 启动时自动订阅的模式（逗号分隔，支持通配符 * ? []，需填写完整模式，不会自动加前缀）
# subscribe_patterns = "cmx:*"



# ============================================
# 模板配置
# ============================================
[templates]
# 模板目录路径（可选，默认 "crates/libs/cmx-dev/templates"）
path = "crates/libs/cmx-dev/templates"

# ============================================
# Code Server 配置
# ============================================
[code_server]
# code-server 服务 URL（可选，用于在线开发功能）
url = "https://dev.cloudmatrix.one:18080/"

# Code Server 扩展服务器配置（可选，用于自调试）
[code_server_extension_server]
url = "http://127.0.0.1:9000"

# ============================================
# WASM 运行时配置
# ============================================
[runtime]
# 内存限制（页数），每页 64KB，可选，默认 4096 页（256MB）
memory_max = 4096
# 单次调用超时时间（秒），可选，默认 30
timeout = 30
# 实例池最大实例数，可选，默认使用 CPU 核心数
pool_max_instances = 8
# Fuel 限制（0 表示不限制），单位：Wasm 指令数，可选，默认 0
# 设置此值可防止死循环和恶意代码消耗过多 CPU
fuel_limit = 0

# ============================================
# 插件配置
# ============================================
[plugin]
# 插件安装根目录（必需）
install_root = "plugins/root"
# 插件备份目录（必需，用于插件升级时备份旧版本）
backup_root = "plugins/backup"
# 插件解压临时目录（必需）
temp_root = "plugins/temp"
# 插件上传临时目录（必需）
upload_root = "plugins/uploads"

# 定时一致性校验间隔（可选，单位：秒，默认 60）
# 对比数据库与本地 Registry，自动补偿差异。设为 0 禁用。
# reconciliation_interval_secs = 60

# 自动安装配置（可选）
[plugin.auto_install]
# 是否启用自动安装，可选，默认 false
enabled = false
# 自动安装的插件列表（enabled 为 true 时生效）
# [[plugin.auto_install.plugins]]
# plugin_id = "cmx-debug"
# version = "1.0.0"
# source_type = "local"
# source_path = "plugins/source/cmx-debug.zip"
# 是否为关键插件，关键插件安装失败会导致应用启动失败
# is_critical = true

# ============================================
# 数据库迁移配置
# ============================================
[migration]
# 是否启用迁移（可选，默认 false）
# 启用后会在应用启动时自动执行待执行的数据库迁移
enabled = false
# 迁移文件目录（必需，存放 SQL 迁移文件）
dir = "docs/sql/migrations"
# 校验文件内容是否被修改，可选，默认 true
# 启用后会校验迁移文件的 MD5 校验和，防止手动修改导致的不一致
validate_checksum = true
# 分布式锁超时时间（秒），可选，默认 60
# 多节点部署时用于防止并发执行迁移
lock_timeout = 60

# ============================================
# 文件存储配置
# ============================================
[storage]
# 默认存储平台标识符（可选，不设置则自动选择第一个已启用的存储实例）
default_platform = "local-1"

# 本地文件系统存储示例
[[storage.instances]]
# 存储平台唯一标识符（必需）
platform = "local-1"
# 存储类型：local（本地文件系统）或 s3（S3 兼容对象存储），必需
storage_type = "local"
# 是否启用该存储平台，可选，默认 true
enable_storage = true
# 文件访问基础域名，注意应以 / 结尾（可选）
# 用于拼接生成文件的访问 URL
domain = "http://localhost:8080/files/"
# 存储路径基础前缀，所有上传文件路径都会以此为前缀（可选）
base_path = "uploads"
# 是否启用直接访问，可选，默认 false
# 启用后可通过 storage_path 直接访问文件
enable_access = true
# 文件路径匹配模式（可选）
path_patterns = "**/*"
# 本地存储物理根目录路径，仅 local 类型生效
storage_path = "./storage"

# MinIO / S3 兼容对象存储示例
# [[storage.instances]]
# platform = "amazon-s3-1"
# storage_type = "s3"
# enable_storage = true
# S3 Access Key ID
# access_key = "your-access-key"
# S3 Secret Access Key
# secret_key = "your-secret-key"
# S3 区域，如 us-east-1
# region = "us-east-1"
# S3 API 端点 URL，支持 MinIO、腾讯云 COS、阿里云 OSS 等
# endpoint = "http://localhost:9000/"
# S3 桶名称
# bucket_name = "my-bucket"
# 文件访问基础域名
# domain = "http://localhost:9000/"
# 存储路径基础前缀
# base_path = "app/"

# ============================================
# 基础服务中心配置
# ============================================
# 插件生命周期与外部基础服务中心（门户中心、权限中心、表单中心、流程中心）
# 之间的数据交互配置
[center_client]
# 访问模式：mock（默认，当前阶段）| url（URL 直连）| discovery（服务发现）
# mock 模式下所有接口调用返回 Mock 成功结果，适用于开发和测试环境
mode = "mock"
# 请求超时时间（毫秒，可选，默认 30000）
# 各基础服务中心 HTTP 请求的超时时间
timeout_ms = 30000

# URL 直连模式配置（mode = "url" 时生效）
# 每个中心对应一个独立的 URL 配置项
# 环境变量覆盖：CENTER_CLIENT__URLS__MENU, CENTER_CLIENT__URLS__PERM 等
[center_client.urls]
# 门户中心（菜单数据）URL
# menu = "http://portal-center:8080/api/plugin/menu/import"
# 权限中心（权限数据）URL
# perm = "http://perm-center:8080/api/plugin/perm/import"
# 表单中心（表单数据）URL
# form = "http://form-center:8080/api/plugin/form/import"
# 流程中心（流程定义）URL
# flow = "http://flow-center:8080/api/plugin/flow/import"

# 服务发现模式配置（mode = "discovery" 时生效）
# 通过 Nacos 服务发现获取各中心的实例地址
# [center_client.discovery]
# Nacos 分组（可选，默认 DEFAULT_GROUP）
# nacos_group = "DEFAULT_GROUP"
# 门户中心服务名
# menu_service = "cmx-portal-center"
# 权限中心服务名
# perm_service = "cmx-perm-center"
# 表单中心服务名
# form_service = "cmx-form-center"
# 流程中心服务名
# flow_service = "cmx-flow-center"

# ============================================
# RPC 配置
# ============================================
[rpc]
# 是否启用 RPC（可选，默认 false）
enabled = false
# 通信协议（目前仅支持 "grpc"）
protocol = "grpc"
# 预热服务列表（启动时预先发现的服务名）
warmup_services = []

[rpc.grpc]
# gRPC 监听端口
port = 9090
# RPC 调用超时时间（毫秒，可选，默认 5000），通过 volo rpc_timeout 设置
timeout_ms = 5000
# 连接超时时间（毫秒，可选，默认 3000），通过 volo connect_timeout 设置
connect_timeout_ms = 3000
# 重试次数（可选，默认 0，仅对可重试错误重试：UNAVAILABLE/DEADLINE_EXCEEDED/RESOURCE_EXHAUSTED/ABORTED）
retry_count = 0
# 默认服务分组（可选，None 表示不按分组过滤，用于多机房/多 region 部署）
# default_group = "DEFAULT_GROUP"
# 默认集群列表（可选，空表示不过滤，用于多机房/多 region 部署）
# default_clusters = []
# 服务发现变更通知通道容量（可选，默认 1024，用于缓冲高频服务变更如 k8s 滚动更新）
# discover_channel_capacity = 1024

# ============================================
# 注册中心服务实例 metadata
# ============================================
# 注册到注册中心的服务实例附加元数据，所有注册中心类型通用。
# grpc_port 由 [rpc.grpc].port 自动注入，无需手动配置。
# [registry.metadata]
# version = "1.0.0"
# region = "cn-east"
