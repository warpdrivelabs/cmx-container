# config/docker.toml - Docker 环境配置模板
# 注意：Nacos 连接信息通过环境变量（NACOS_* 前缀）注入，不在此文件中配置

# Web 静态文件目录
web_folder = "/app/web-folder"

[[databases]]
db_id = "primary"
db_type = "postgres"
db_url = "postgresql://postgres:postgres@postgres:5432/postgres"
default = true

[databases.pool_config]
max_connections = 20
min_connections = 5
connect_timeout = 30
idle_timeout = 600
max_lifetime = 1800
health_check_interval = 60
health_check_timeout = 5

[redis]
url = "redis://redis:6379/13"

[plugin]
install_root = "/app/plugins/root"
backup_root = "/app/plugins/backup"
temp_root = "/app/plugins/temp"
upload_root = "/app/plugins/uploads"

[plugin.auto_install]
enabled = false

[runtime]
memory_max = 4096
timeout = 30
pool_max_instances = 8
fuel_limit = 0

[migration]
# 是否启用迁移（可选，默认 false）
# 启用后会执行待执行的数据库迁移
enabled = false
dir = "/app/docs/sql/migrations"
lock_timeout = 60
# 校验文件内容是否被修改，默认值true
validate_checksum = false

[templates]
path = "/app/templates"

[code_server]
url = "https://dev.cloudmatrix.one:18080/"



# ============================================
# 文件存储配置
# ============================================
[storage]
default_platform = "local"

# 本地文件系统存储
[[storage.instances]]
platform = "local"
storage_type = "local"
enable_storage = true
domain = "http://localhost:8080/files/"
base_path = "uploads"
storage_path = "./storage"
enable_access = true
path_patterns = "/files/**"


# ============================================
# RPC 配置
# ============================================
[rpc]
# 是否启用 RPC（可选，默认 false）
enabled = true
# 通信协议（目前仅支持 "grpc"）
protocol = "grpc"
# 预热服务列表（启动时预先发现的服务名）
warmup_services = []

[rpc.grpc]
# gRPC 监听端口
port = 9090
# RPC 调用超时时间（毫秒，可选，默认 5000），通过 volo rpc_timeout 设置
timeout_ms = 5000
# 连接超时时间（毫秒，可选，默认 3000），通过 volo connect_timeout 设置
connect_timeout_ms = 3000
# 重试次数（可选，默认 0，仅对可重试错误重试：UNAVAILABLE/DEADLINE_EXCEEDED/RESOURCE_EXHAUSTED/ABORTED）
retry_count = 0
## 默认服务分组（可选，None 表示不按分组过滤，用于多机房/多 region 部署）
# default_group = "DEFAULT_GROUP"
## 默认集群列表（可选，空表示不过滤，用于多机房/多 region 部署）
# default_clusters = []
## 服务发现变更通知通道容量（可选，默认 1024，用于缓冲高频服务变更如 k8s 滚动更新）
# discover_channel_capacity = 1024


# 默认 API Key（开发环境使用，生产环境请删除并改为环境变量注入）
