# ============================================
# 服务器配置
# ============================================
[server]
# 监听地址
host = "0.0.0.0"
# 监听端口
port = 8080

# ============================================
# 应用标识配置
# ============================================
# 当前实例所属的域/应用/模块，用于数据源过滤（load_active_datasources 仅加载归属本实例域的数据源）。
# 支持环境变量覆盖：APP__DOMAIN_CODE / APP__APPLICATION_CODE / APP__MODULE_CODE
[app]
# 所属域编码（必需，默认 default）
domain_code = "fi"
# 所属应用编码（必需，默认 default）
application_code = "cmxfico"
# 所属模块编码（必需，默认 default）
module_code = "gl"


# ============================================
# 主键 ID 生成（DCT 数据字典 / DOC 业务单据的 bigint id 列）
# 后端首次存储新行时铸号；52 位 JS 安全布局（值 < 2^53，前端当数字用不丢精度）。
# ============================================
[id_gen]
# 本部署的 node id（0-255）。跨部署**必须唯一**——不同 node 的号段天然不重叠，
# 是「导出包直插他库不撞号、不改号」的根基。多部署/多租户请在登记表集中分配，各部署填各自的号。
# 缺省（不配）时进程回落随机 node：仍全局唯一，但无法跨部署稳定追溯来源，且日志会告警。
node_id = 1


# ============================================
# 门户/设计器业务数据根（迁移自 CMXPortalManager/CMXHTMLDesigner 的 Node 后端）
# cmx-portal 的 JSON 文件存储根目录；缺省时回退环境变量 CMX_PORTAL_DATA_ROOT 或 ./data
# ============================================
[portal]
data_root = "./data"
# 同源托管两个迁移前端的生产构建（npm run build 产物）。留空=不托管（开发走 vite dev）。
# 访问：http://<host>:8080/portal/  与  /html/
web_portal_dist = "../CMXPortalManager/dist"
web_html_dist = "../CMXHTMLDesigner/dist"
# 共享 UI5/Tabler 运行时（cmx-ui5-runtime 构建产物）。前端用 import("/shared/assets/...") 动态加载。
# 缺它会导致 /shared/assets/install-*.js 404 → UI5 加载失败 → 白屏。
web_shared_dist = "../packages/cmx-ui5-runtime/dist"

# ============================================
# 数据源配置数组
# ============================================
# databases 是一个数组，可以配置多个数据源
# 每个数据源必须有一个唯一的 db_id 作为标识

[[databases]]
# 数据源唯一标识符（必需）
db_id = "primary"
db_name = "主控数据库"
# 数据库类型：postgres | mysql | sqlite（必需）
db_type = "postgres"
# 数据库连接 URL（必需）
db_url = "postgresql://postgres:postgres@localhost:5432/cmx"
#db_url = "postgres://dbuser_dba:hkO4Mjkgih6dYVVhmuFYRLm5@192.168.157.46:5432/cmxlocal"
# 是否为默认数据库（可选，默认 false）
default = true
# 连接池配置（可选，使用默认值时可省略）
pool_config = { max_connections = 15, min_connections = 3, connect_timeout = 20, idle_timeout = 300, max_lifetime = 900 }
# 健康检查配置（可选）
# 健康检查间隔（秒，可选，默认 60）
health_check_interval = 60
# 健康检查超时时间（秒，可选，默认 5）
health_check_timeout = 5

[[databases]]
# 数据源唯一标识符（必需）
db_id = "fico-db"
db_name = "总账数据库"
# 数据库类型：postgres | mysql | sqlite（必需）
db_type = "postgres"
# 数据库连接 URL（必需）
db_url = "postgresql://postgres:postgres@localhost:5432/fico"
#db_url = "postgres://dbuser_dba:hkO4Mjkgih6dYVVhmuFYRLm5@192.168.157.46:5432/cmxlocal"
# 是否为默认数据库（可选，默认 false）
default = false
# 连接池配置（可选，使用默认值时可省略）
pool_config = { max_connections = 15, min_connections = 3, connect_timeout = 20, idle_timeout = 300, max_lifetime = 900 }
# 健康检查配置（可选）
# 健康检查间隔（秒，可选，默认 60）
health_check_interval = 60
# 健康检查超时时间（秒，可选，默认 5）
health_check_timeout = 5

[redis]
# url = "redis://192.168.137.95:32496/12"
#url = "redis://192.168.157.46:6379/12"
url = "redis://localhost:6379/12"


# Redis 运行模式：Standalone（单机）或 Cluster（集群）
#mode = "Standalone"
# 集群节点地址（集群模式时必填，逗号分隔）
# cluster_urls = "redis://node1:6379,redis://node2:6379,redis://node3:6379"
# Pub/Sub 心跳间隔（秒），0 表示禁用
# heartbeat_interval = 30
# 启动时自动订阅的频道（逗号分隔，需填写完整频道名，不会自动加前缀）
# subscribe_channels = "cmx:plugin:changed"
# 启动时自动订阅的模式（逗号分隔，支持通配符 * ? []，需填写完整模式，不会自动加前缀）
# subscribe_patterns = "cmx:*"



[templates]
# 模板目录路径
path = "crates/libs/cmx-dev/templates"

[code_server]
# code-server URL
#url = "https://dev.cloudmatrix.one:18080/"
url = "http://127.0.0.1:8081/"

[code_server_extension_server]
# code-server 扩展服务器 URL，用于自调试
url = "http://127.0.0.1:9000"


#WASM运行时相关配置
[runtime]
# 内存限制（页数），每页 64KB，默认 4096 页（256MB）
memory_max = 4096
# 单次调用超时时间（秒），默认 30
timeout = 30
# 实例池最大实例数，默认使用 CPU 核心数
pool_max_instances = 8
# Fuel 限制（0 表示不限制，单位：Wasm 指令数）
fuel_limit = 0

#插件相关配置
[plugin]
# 插件安装根目录
install_root = "plugins/root"
# 插件备份目录
backup_root = "plugins/backup"
# 插件解压临时目录
temp_root = "plugins/temp"
# 插件上传临时目录
upload_root = "plugins/uploads"

# 自动安装配置
[plugin.auto_install]
enabled = false



#数据库迁移相关配置
[migration]
# 是否启用迁移（可选，默认 false）
# 启用后会执行待执行的数据库迁移
enabled = false
# 迁移文件目录
dir = "docs/sql/migrations"
# 校验文件内容是否被修改，默认值true
validate_checksum = false
# 分布式锁超时时间（秒）
lock_timeout = 60

# ============================================
# 文件存储配置
# ============================================
[storage]
default_platform = "local"

# 本地文件系统存储
[[storage.instances]]
platform = "local"
storage_type = "local"
enable_storage = true
domain = "http://localhost:8080/files/"
base_path = "uploads"
storage_path = "./storage"
enable_access = true
path_patterns = "/files/**"

# MinIO (S3 兼容) 存储
[[storage.instances]]
platform = "minio"
storage_type = "s3"
enable_storage = true
access_key = "Wa8GQ78My7d0b4AedpLS"
secret_key = "3T0IYmsQP0OeBqKZ1jB5tk3pLmMD3ZT97AnNFIXV"
region = "us-east-1"
endpoint = "http://192.168.157.46:9000/"
bucket_name = "cmx-bucket"
domain = "http://192.168.157.46:9000/"
base_path = "cmx-server/"

# ============================================
# 基础服务中心配置
# ============================================
[center_client]
# 模式：mock（默认）| http_url（URL 直连）| http_discovery（服务发现）| grpc（gRPC 调用）
mode = "mock"
# 请求超时（毫秒，仅 http_url / http_discovery 模式生效）
timeout_ms = 30000

# URL 直连模式（mode = "http_url" 时生效）
# 环境变量覆盖：CENTER_CLIENT__URLS__MENU, CENTER_CLIENT__URLS__PERM 等
[center_client.urls]
# menu = "http://portal-center:8080/api/plugin/menu/import"
# perm = "http://perm-center:8080/api/iam/permissions/import"
# form = "http://form-center:8080/api/plugin/form/import"
# flow = "http://flow-center:8080/api/plugin/flow/import"

# 服务发现模式（mode = "http_discovery" 或 "grpc" 时生效）
[center_client.discovery]
nacos_group = "DEFAULT_GROUP"
menu_service = "cmx-server-local"
perm_service = "cmx-server-local"
form_service = "cmx-server-local"
flow_service = "cmx-server-local"


# ============================================
# RPC 配置
# ============================================
[rpc]
# 是否启用 RPC（可选，默认 false）
enabled = false
# 通信协议（目前仅支持 "grpc"）
protocol = "grpc"
# 预热服务列表（启动时预先发现的服务名）
warmup_services = []

[rpc.grpc]
# gRPC 监听端口
port = 9090
# RPC 调用超时时间（毫秒，可选，默认 30000），通过 volo rpc_timeout 设置
timeout_ms =30000
# 连接超时时间（毫秒，可选，默认 3000），通过 volo connect_timeout 设置
connect_timeout_ms = 3000
# 重试次数（可选，默认 0，仅对可重试错误重试：UNAVAILABLE/DEADLINE_EXCEEDED/RESOURCE_EXHAUSTED/ABORTED）
retry_count = 0
# 默认服务分组（可选，None 表示不按分组过滤，用于多机房/多 region 部署）
# default_group = "DEFAULT_GROUP"
# 默认集群列表（可选，空表示不过滤，用于多机房/多 region 部署）
# default_clusters = []
# 服务发现变更通知通道容量（可选，默认 1024，用于缓冲高频服务变更如 k8s 滚动更新）
# discover_channel_capacity = 1024


# ============================================
# 服务对外身份配置
# ============================================
# 本服务作为调用方时携带的服务级凭证，用于 gRPC / HTTP 跨服务调用的 M2M 鉴权。
# 凭证须同时在下方 [[auth.static_api_keys]] 注册，否则接收端 mw_auth 无法验证。
# 单体无跨服务调用场景可留空（默认）。
[service_auth]
# 本服务对外服务级凭证（cmx_sk_xxx）
# 留空表示不配置服务身份（RPC 出站不携带服务凭证，HTTP 跨服务调用无法通过 mw_auth）
outgoing_api_key = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6"

# ============================================
# 认证配置
# ============================================

# 认证白名单（无需登录即可访问的路径前缀）
# 迁移自 CMXPortalManager / CMXHTMLDesigner 的 Node 后端原本无鉴权；这些前端在「设计器/未登录」
# 场景下不带 token，落到全局 auth 中间件会得到 401（表现为「找不到页面 / DAM」）。此处放行
# 门户/设计器的**共享元数据/页面资源**端点，恢复其无鉴权读取行为，让两个前端开箱即用。
# 规则为前缀匹配（如 /api/html-pages 同时匹配 /api/html-pages/{id}、/batch 等子路径）。
#
# ⚠️ 重要：只放行「与具体登录用户无关」的共享资源。**不要**放行需要当前用户身份的端点
# （如 /api/notifications/*、/api/agent/*、/api/ai/*）——这些 handler 会从 AuthContext 取
# user_id，一旦被白名单跳过 token 校验就拿不到用户、handler 自身返回 401，前端拦截器据此
# 误判「登录失效」→ clearTokens 跳登录页 → 登录后又被弹回，形成登录死循环。
# 这类端点交给正常登录链路（浏览器已会带 Bearer token）。
#
# 注意：① 仅供本地开发，切勿用于生产（生产应走正常登录拿 token）；
#      ② 白名单在启动时一次性注入，改动后需重启 web-server 才生效。
[auth]
whitelist = [
    "/api/html-pages",
    "/api/form-pages",
    "/api/native-pages",
    "/api/workspace-nodes",
    "/api/registry",
    "/api/service-catalog",
    "/api/definitions",
    "/api/flexible-combination",
    "/api/launcher",
    "/api/domains",
    "/api/menu-pages",
    "/api/activities",
    "/api/modules",
    "/api/module-resources",
    "/api/dam-registry",
    "/api/dict",
    "/api/dct",
    "/api/doc",
    "/api/fact",
    "/api/help",
]

# 默认 API Key（开发环境使用，生产环境请删除并改为环境变量注入）
# 使用方法：将 key 值作为 X-API-Key 请求头
[[auth.static_api_keys]]
key = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6"
service_name = "dev-internal"
description = "开发环境默认 API Key"

[auth.token]
access_ttl_secs=1800000

[opencode]
enabled = false
base_url = "http://127.0.0.1:4096"