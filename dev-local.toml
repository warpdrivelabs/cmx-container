# ============================================
# 服务器配置
# ============================================
[server]
# 监听地址
host = "0.0.0.0"
# 监听端口
port = 8080

# ============================================
# 数据源配置数组
# ============================================
# databases 是一个数组，可以配置多个数据源
# 每个数据源必须有一个唯一的 db_id 作为标识

[[databases]]
# 数据源唯一标识符（必需）
db_id = "primary"
# 数据库类型：postgres | mysql | sqlite（必需）
db_type = "postgres"
# 数据库连接 URL（必需）
db_url = "postgresql://postgres:postgres@127.0.0.1:5432/cmx"
#db_url = "postgres://dbuser_dba:hkO4Mjkgih6dYVVhmuFYRLm5@192.168.157.46:5432/cmxlocal"
# 是否为默认数据库（可选，默认 false）
default = true

# 连接池配置（可选，使用默认值时可省略）
[databases.pool_config]
# 最大连接数（可选，默认 10，测试环境为 1）
max_connections = 20
# 最小空闲连接数（可选，默认 2）
min_connections = 5
# 连接超时时间（秒，可选，默认 30）
connect_timeout = 30
# 空闲连接超时时间（秒，可选，默认 600）
idle_timeout = 600
# 连接最大生命周期（秒，可选，默认 1800）
max_lifetime = 1800

# 健康检查配置（可选）
# 健康检查间隔（秒，可选，默认 60）
health_check_interval = 60
# 健康检查超时时间（秒，可选，默认 5）
health_check_timeout = 5


[redis]
# url = "redis://192.168.137.95:32496/12"
#url = "redis://192.168.157.46:6379/12"
url = "redis://127.0.0.1:6379/12"


# Redis 运行模式：Standalone（单机）或 Cluster（集群）
#mode = "Standalone"
# 集群节点地址（集群模式时必填，逗号分隔）
# cluster_urls = "redis://node1:6379,redis://node2:6379,redis://node3:6379"
# Pub/Sub 心跳间隔（秒），0 表示禁用
# heartbeat_interval = 30
# 启动时自动订阅的频道（逗号分隔，需填写完整频道名，不会自动加前缀）
# subscribe_channels = "cmx:plugin:changed"
# 启动时自动订阅的模式（逗号分隔，支持通配符 * ? []，需填写完整模式，不会自动加前缀）
# subscribe_patterns = "cmx:*"



[templates]
# 模板目录路径
path = "crates/libs/cmx-dev/templates"

[code_server]
# code-server URL
#url = "https://dev.cloudmatrix.one:18080/"
url = "http://127.0.0.1:8081/"

[code_server_extension_server]
# code-server 扩展服务器 URL，用于自调试
url = "http://127.0.0.1:9000"


#WASM运行时相关配置
[runtime]
# 内存限制（页数），每页 64KB，默认 4096 页（256MB）
memory_max = 4096
# 单次调用超时时间（秒），默认 30
timeout = 30
# 实例池最大实例数，默认使用 CPU 核心数
pool_max_instances = 8
# Fuel 限制（0 表示不限制，单位：Wasm 指令数）
fuel_limit = 0

#插件相关配置
[plugin]
# 插件安装根目录
install_root = "plugins/root"
# 插件备份目录
backup_root = "plugins/backup"
# 插件解压临时目录
temp_root = "plugins/temp"
# 插件上传临时目录
upload_root = "plugins/uploads"

# 自动安装配置
[plugin.auto_install]
enabled = false



#数据库迁移相关配置
[migration]
# 是否启用迁移（可选，默认 false）
# 启用后会执行待执行的数据库迁移
enabled = false
# 迁移文件目录
dir = "docs/sql/migrations"
# 校验文件内容是否被修改，默认值true
validate_checksum = false
# 分布式锁超时时间（秒）
lock_timeout = 60

# ============================================
# 文件存储配置
# ============================================
[storage]
default_platform = "local"

# 本地文件系统存储
[[storage.instances]]
platform = "local"
storage_type = "local"
enable_storage = true
domain = "http://localhost:8080/files/"
base_path = "uploads"
storage_path = "./storage"
enable_access = true
path_patterns = "/files/**"

# MinIO (S3 兼容) 存储
[[storage.instances]]
platform = "minio"
storage_type = "s3"
enable_storage = true
access_key = "Wa8GQ78My7d0b4AedpLS"
secret_key = "3T0IYmsQP0OeBqKZ1jB5tk3pLmMD3ZT97AnNFIXV"
region = "us-east-1"
endpoint = "http://192.168.157.46:9000/"
bucket_name = "cmx-bucket"
domain = "http://192.168.157.46:9000/"
base_path = "cmx-server/"

# ============================================
# 基础服务中心配置
# ============================================
[center_client]
# 模式：mock（默认）| http_url（URL 直连）| http_discovery（服务发现）| grpc（gRPC 调用）
mode = "mock"
# 请求超时（毫秒，仅 http_url / http_discovery 模式生效）
timeout_ms = 30000

# URL 直连模式（mode = "http_url" 时生效）
# 环境变量覆盖：CENTER_CLIENT__URLS__MENU, CENTER_CLIENT__URLS__PERM 等
[center_client.urls]
# menu = "http://portal-center:8080/api/plugin/menu/import"
# perm = "http://perm-center:8080/api/iam/permissions/import"
# form = "http://form-center:8080/api/plugin/form/import"
# flow = "http://flow-center:8080/api/plugin/flow/import"

# 服务发现模式（mode = "http_discovery" 或 "grpc" 时生效）
[center_client.discovery]
nacos_group = "DEFAULT_GROUP"
menu_service = "cmx-server-local"
perm_service = "cmx-server-local"
form_service = "cmx-server-local"
flow_service = "cmx-server-local"


# ============================================
# RPC 配置
# ============================================
[rpc]
# 是否启用 RPC（可选，默认 false）
enabled = false
# 通信协议（目前仅支持 "grpc"）
protocol = "grpc"
# 预热服务列表（启动时预先发现的服务名）
warmup_services = []

[rpc.grpc]
# gRPC 监听端口
port = 9090
# RPC 调用超时时间（毫秒，可选，默认 5000），通过 volo rpc_timeout 设置
timeout_ms = 5000
# 连接超时时间（毫秒，可选，默认 3000），通过 volo connect_timeout 设置
connect_timeout_ms = 3000
# 重试次数（可选，默认 0，仅对可重试错误重试：UNAVAILABLE/DEADLINE_EXCEEDED/RESOURCE_EXHAUSTED/ABORTED）
retry_count = 0
# 默认服务分组（可选，None 表示不按分组过滤，用于多机房/多 region 部署）
# default_group = "DEFAULT_GROUP"
# 默认集群列表（可选，空表示不过滤，用于多机房/多 region 部署）
# default_clusters = []
# 服务发现变更通知通道容量（可选，默认 1024，用于缓冲高频服务变更如 k8s 滚动更新）
# discover_channel_capacity = 1024

