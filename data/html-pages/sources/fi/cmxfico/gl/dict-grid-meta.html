<div style="display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:10px;gap:10px;background:var(--sapBackgroundColor,#f7f7f7);color:var(--sapTextColor,#1d2d3e);">
  <ui5-bar design="Header" accessible-role="Toolbar">
    <ui5-label slot="startContent" wrapping-type="Normal" style="font-weight:800;font-size:1.05rem;">数据字典元数据 · 动态列字典内容</ui5-label>
    <ui5-label id="statusText" slot="endContent" wrapping-type="Normal" style="font-size:0.8rem;color:var(--sapContent_LabelColor);">等待加载</ui5-label>
    <ui5-button slot="endContent" design="Transparent" icon="download" data-eventclick="loadDictMeta('fetch');">元数据(fetch)</ui5-button>
    <ui5-button slot="endContent" design="Emphasized" icon="connected" data-eventclick="loadDictMeta('service');">元数据(service)</ui5-button>
  </ui5-bar>

  <div style="display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--sapInformationBackground,#eaf4ff);border:1px solid var(--sapInformationBorderColor,#bcd8f7);border-radius:4px;">
    <ui5-icon name="information" style="color:var(--sapInformationColor,#0a6ed1);"></ui5-icon>
    <ui5-label id="viaText" wrapping-type="Normal" style="font-weight:700;font-size:0.85rem;">点上方按钮加载 DCT 元数据（批量：一次取回字典定义 + base 字段集）</ui5-label>
  </div>

  <div class="ctrl-row">
    <ui5-label style="font-weight:700;">ERP 模块：</ui5-label>
    <select id="moduleSel" class="sel" aria-label="选择 ERP 模块"></select>
    <ui5-label style="font-weight:700;margin-left:10px;">数据字典：</ui5-label>
    <select id="dictSel" class="sel" aria-label="选择数据字典"></select>
    <ui5-button design="Transparent" icon="refresh" data-eventclick="selectDict();">刷新内容</ui5-button>
    <ui5-label id="rowCountText" wrapping-type="Normal" style="color:var(--sapContent_LabelColor,#6a6d70);font-size:0.82rem;">—</ui5-label>
    <span style="flex:1 1 auto;"></span>
    <ui5-button id="batchBtn" design="Attention" icon="multiselect-all" data-eventclick="batchLoadAll();">批量加载全部字典内容</ui5-button>
  </div>

  <section class="panel" style="flex:1 1 auto;min-height:0;">
    <div class="panel-head">
      <ui5-icon name="grid"></ui5-icon>
      <ui5-title id="dictTitle" level="H5" size="H5">字典内容</ui5-title>
      <span style="flex:1 1 auto;"></span>
      <ui5-label wrapping-type="Normal" style="font-size:0.76rem;color:var(--sapContent_LabelColor);">列由元数据动态生成 · 数据动态加载</ui5-label>
    </div>
    <cmx-revo-grid id="dictGrid" data-cmx-model-id="dictColumnModel" data-cmx-dataset-id="dictDataSet" style="display:block;width:100%;flex:1 1 0%;min-height:0;"></cmx-revo-grid>
  </section>

  <section class="panel" style="flex:0 0 230px;min-height:0;">
    <div class="panel-head">
      <ui5-icon name="multiselect-all"></ui5-icon>
      <ui5-title level="H5" size="H5">多字典批量加载汇总</ui5-title>
      <span style="flex:1 1 auto;"></span>
      <ui5-label id="batchInfo" wrapping-type="Normal" style="font-size:0.78rem;color:var(--sapContent_LabelColor);">点「批量加载全部字典内容」一次性并行加载</ui5-label>
    </div>
    <cmx-revo-grid id="batchGrid" data-cmx-model-id="batchColumnModel" data-cmx-dataset-id="batchDataSet" style="display:block;width:100%;flex:1 1 0%;min-height:0;"></cmx-revo-grid>
  </section>

  <style>
    .ctrl-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sapTile_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);border-radius:4px}
    .sel{min-width:240px;box-sizing:border-box;padding:5px 7px;border:1px solid var(--sapField_BorderColor,#b3b3b3);border-radius:4px;background:var(--sapField_Background,#fff);color:var(--sapField_TextColor,#1d2d3e);font-size:0.85rem}
    .panel{background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
    .panel-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);background:var(--sapList_HeaderBackground,#f5f6f7)}
    .panel-head ui5-title{margin:0}
  </style>
</div>
<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[{"name":"loadModules","params":"","body":"\nvar lib = globalThis.__cmxDataComp || host.__cmxClasses;\nvar root = host.shadowRoot;\nfunction $(id){ return root.querySelector('#'+id); }\nfunction setText(id,v){ var el=$(id); if(el) el.textContent=(v==null?'':String(v)); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction waitForLib(){\n  return new Promise(function(resolve,reject){\n    var n=0, t=setInterval(function(){\n      var L=globalThis.__cmxDataComp;\n      if(L && typeof L.loadMetaModelsBatch==='function' && L.CmxColumn && L.CmxColumnModel){ clearInterval(t); resolve(L); return; }\n      if(++n>120){ clearInterval(t); reject(new Error('cmx-data-comp 未就绪（loadMetaModelsBatch/CmxColumn/CmxColumnModel）')); }\n    },50);\n  });\n}\n/* 依据某个字典(CmxMetaTable)的元数据字段，动态创建 grid 列（CmxColumn[]）。 */\nfunction buildColumns(table){\n  var CmxColumn=lib.CmxColumn;\n  var refs=table.listFieldRefs();\n  return refs.map(function(ref){\n    var f=ref.field||{};\n    var id=ref.id||f.id||f.name||'';\n    var w = id==='id'?'90px' : id==='code'?'120px'\n          : id==='name'?'180px'\n          : (/time|date|_at$/.test(id))?'160px' : '140px';\n    /* caption 可能是 i18n 对象({zh_CN}) —— CmxColumn.toDescriptor 内部用 fieldCaption 解析当前语言 */\n    return new CmxColumn({ id:id, caption:(f.caption!=null?f.caption:id), dataType:(f.dataType||'VARCHAR'), width:w });\n  });\n}\n/* dict 服务里字典内容的 dictId 前缀：四套 CNPC 字典内容已带系统前缀(接入 dict 服务时约定)，\n   自研 gl 套无前缀。元模型 table.id 是无前缀 dictCode，查内容时按当前模块补前缀。 */\nvar DICT_PREFIX = { gl:'', fico:'sap_', ebs:'ebs_', yonyou:'yy_', kingdee:'kd_' };\nfunction contentDictId(code){\n  var pfx = DICT_PREFIX[host.__curModule] || '';\n  return pfx + code;\n}\nfunction fetchDictRows(dictCode, pageSize){\n  return fetch('/api/dict/'+encodeURIComponent(contentDictId(dictCode))+'/search',{\n    method:'POST', headers:{'Content-Type':'application/json'},\n    body:JSON.stringify({ pageSize:(pageSize||500), page:1 })\n  }).then(function(res){\n    if(res.status===404) return { __noSource:true, rows:[], total:0 };\n    if(!res.ok) throw new Error('字典内容加载失败 HTTP '+res.status+'（'+contentDictId(dictCode)+'）');\n    return res.json();\n  });\n}\n\nfetch('/api/definitions/list?kind=DCT&domain=fi').then(function(res){ return res.json(); }).then(function(data){\n  var items=(data&&data.items)||[];\n  host.__moduleRefs={};\n  var sel=$('moduleSel');\n  if(sel){\n    sel.innerHTML=items.map(function(it){\n      host.__moduleRefs[it.module]={ domain:it.domain, module:it.module, file:it.file, title:it.title };\n      return '<option value=\"'+esc(it.module)+'\">'+esc((it.title||it.module)+'（'+it.module+'·'+(it.tableCount||'?')+'表）')+'</option>';\n    }).join('');\n    /* 默认选自研 gl（无则第一套） */\n    var def = host.__moduleRefs['gl'] ? 'gl' : (items[0]?items[0].module:'');\n    if(def) sel.value=def;\n    sel.onchange=function(){ host.loadDictMeta(); };\n  }\n  setText('statusText','模块已就绪 · '+items.length+' 套字典');\n  host.loadDictMeta();   /* 加载默认模块 */\n}).catch(function(e){ setText('statusText','模块列表加载失败：'+(e&&e.message||e)); });\n","readsVars":[],"writesVars":[]},{"name":"loadDictMeta","params":"mode","body":"\nvar lib = globalThis.__cmxDataComp || host.__cmxClasses;\nvar root = host.shadowRoot;\nfunction $(id){ return root.querySelector('#'+id); }\nfunction setText(id,v){ var el=$(id); if(el) el.textContent=(v==null?'':String(v)); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction waitForLib(){\n  return new Promise(function(resolve,reject){\n    var n=0, t=setInterval(function(){\n      var L=globalThis.__cmxDataComp;\n      if(L && typeof L.loadMetaModelsBatch==='function' && L.CmxColumn && L.CmxColumnModel){ clearInterval(t); resolve(L); return; }\n      if(++n>120){ clearInterval(t); reject(new Error('cmx-data-comp 未就绪（loadMetaModelsBatch/CmxColumn/CmxColumnModel）')); }\n    },50);\n  });\n}\n/* 依据某个字典(CmxMetaTable)的元数据字段，动态创建 grid 列（CmxColumn[]）。 */\nfunction buildColumns(table){\n  var CmxColumn=lib.CmxColumn;\n  var refs=table.listFieldRefs();\n  return refs.map(function(ref){\n    var f=ref.field||{};\n    var id=ref.id||f.id||f.name||'';\n    var w = id==='id'?'90px' : id==='code'?'120px'\n          : id==='name'?'180px'\n          : (/time|date|_at$/.test(id))?'160px' : '140px';\n    /* caption 可能是 i18n 对象({zh_CN}) —— CmxColumn.toDescriptor 内部用 fieldCaption 解析当前语言 */\n    return new CmxColumn({ id:id, caption:(f.caption!=null?f.caption:id), dataType:(f.dataType||'VARCHAR'), width:w });\n  });\n}\n/* dict 服务里字典内容的 dictId 前缀：四套 CNPC 字典内容已带系统前缀(接入 dict 服务时约定)，\n   自研 gl 套无前缀。元模型 table.id 是无前缀 dictCode，查内容时按当前模块补前缀。 */\nvar DICT_PREFIX = { gl:'', fico:'sap_', ebs:'ebs_', yonyou:'yy_', kingdee:'kd_' };\nfunction contentDictId(code){\n  var pfx = DICT_PREFIX[host.__curModule] || '';\n  return pfx + code;\n}\nfunction fetchDictRows(dictCode, pageSize){\n  return fetch('/api/dict/'+encodeURIComponent(contentDictId(dictCode))+'/search',{\n    method:'POST', headers:{'Content-Type':'application/json'},\n    body:JSON.stringify({ pageSize:(pageSize||500), page:1 })\n  }).then(function(res){\n    if(res.status===404) return { __noSource:true, rows:[], total:0 };\n    if(!res.ok) throw new Error('字典内容加载失败 HTTP '+res.status+'（'+contentDictId(dictCode)+'）');\n    return res.json();\n  });\n}\n\nvar modSel=$('moduleSel');\nvar mod=(modSel&&modSel.value)|| host.__curModule || 'gl';\nvar ref=(host.__moduleRefs&&host.__moduleRefs[mod])|| { domain:'fi', module:'gl', file:'gl_md_dct_meta_v1.json' };\n/* 切模块：清上一套状态，避免跨套串数据/串字典。\n   注意 dictMS 是 models[] 声明的 CmxMasterSlave 实例，**不能置 null**(会丢实例导致批量加载报错)；\n   只清空其数据并标记\"当前 dictMS 数据已不属于新模块\"，selectDict 据此决定是否复用。 */\nhost.__dictMetaReady=false; host.__curModule=mod;\nif(host.dictMS && typeof host.dictMS.setDataSet==='function'){ try{ host.dictMS.setDataSet({}); }catch(e){} }\nhost.__dictMSModule=null;   // dictMS 当前无某模块的有效数据\nvar status=$('statusText'); if(status) status.textContent='加载 '+mod+' 元数据中...';\nwaitForLib().then(function(L){\n  var dctMeta=host.dctMeta;\n  if(!dctMeta) throw new Error('模型面板未声明 dctMeta（CmxDCTMeta）实例');\n  var useService=(mode!=='fetch');\n  var opts = useService ? { host:host, serviceFn:'loadDefinitionsBatch', refs:[ref] } : { host:host, refs:[ref] };\n  return L.loadMetaModelsBatch({ dctMeta:dctMeta }, opts);\n}).then(function(bundle){\n  if(bundle.errors && bundle.errors.length) throw new Error('批量加载元数据存在错误：'+JSON.stringify(bundle.errors));\n  var m=host.dctMeta;\n  var dicts=m.listTables();\n  /* 填充字典下拉：value=dictCode(table.id)，label=字典名（dictCode） */\n  var sel=$('dictSel');\n  if(sel){\n    sel.innerHTML=dicts.map(function(t){ return '<option value=\"'+esc(t.id)+'\">'+esc(t.name+'（'+t.id+'）')+'</option>'; }).join('');\n    var def = m.getTable('gl_account') ? 'gl_account' : (dicts[0]?dicts[0].id:'');\n    if(def) sel.value=def;\n    sel.onchange=function(){ host.selectDict(); };\n  }\n  var viaMap={ 'fetch':'库内 fetch（直连 /api/definitions/batch）','resolver':'自定义 resolver','service:loadDefinitionsBatch':'服务面板服务（serviceFn: loadDefinitionsBatch）' };\n  var viaLabel=viaMap[bundle.via]||('服务（'+bundle.via+'）');\n  var dctPath=m.backendRelPath||m.backendPath||'';\n  var modTitle=(host.__moduleRefs&&host.__moduleRefs[host.__curModule]&&host.__moduleRefs[host.__curModule].title)||host.__curModule;\n  setText('viaText','当前模块：'+modTitle+'（'+host.__curModule+'）　·　加载方式：'+viaLabel+'　·　字典数：'+dicts.length+(dctPath?'　·　DCT 路径：'+dctPath:''));\n  setText('statusText',modTitle+' 元数据已就绪 · '+dicts.length+' 个字典');\n  host.__dictMetaReady=true;\n  host.selectDict();           /* 默认渲染选中字典的列 + 内容 */\n}).catch(function(e){\n  setText('statusText','元数据加载失败');\n  setText('viaText','错误：'+(e&&e.message||e));\n});\n","readsVars":[],"writesVars":[]},{"name":"selectDict","params":"","body":"\nvar lib = globalThis.__cmxDataComp || host.__cmxClasses;\nvar root = host.shadowRoot;\nfunction $(id){ return root.querySelector('#'+id); }\nfunction setText(id,v){ var el=$(id); if(el) el.textContent=(v==null?'':String(v)); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction waitForLib(){\n  return new Promise(function(resolve,reject){\n    var n=0, t=setInterval(function(){\n      var L=globalThis.__cmxDataComp;\n      if(L && typeof L.loadMetaModelsBatch==='function' && L.CmxColumn && L.CmxColumnModel){ clearInterval(t); resolve(L); return; }\n      if(++n>120){ clearInterval(t); reject(new Error('cmx-data-comp 未就绪（loadMetaModelsBatch/CmxColumn/CmxColumnModel）')); }\n    },50);\n  });\n}\n/* 依据某个字典(CmxMetaTable)的元数据字段，动态创建 grid 列（CmxColumn[]）。 */\nfunction buildColumns(table){\n  var CmxColumn=lib.CmxColumn;\n  var refs=table.listFieldRefs();\n  return refs.map(function(ref){\n    var f=ref.field||{};\n    var id=ref.id||f.id||f.name||'';\n    var w = id==='id'?'90px' : id==='code'?'120px'\n          : id==='name'?'180px'\n          : (/time|date|_at$/.test(id))?'160px' : '140px';\n    /* caption 可能是 i18n 对象({zh_CN}) —— CmxColumn.toDescriptor 内部用 fieldCaption 解析当前语言 */\n    return new CmxColumn({ id:id, caption:(f.caption!=null?f.caption:id), dataType:(f.dataType||'VARCHAR'), width:w });\n  });\n}\n/* dict 服务里字典内容的 dictId 前缀：四套 CNPC 字典内容已带系统前缀(接入 dict 服务时约定)，\n   自研 gl 套无前缀。元模型 table.id 是无前缀 dictCode，查内容时按当前模块补前缀。 */\nvar DICT_PREFIX = { gl:'', fico:'sap_', ebs:'ebs_', yonyou:'yy_', kingdee:'kd_' };\nfunction contentDictId(code){\n  var pfx = DICT_PREFIX[host.__curModule] || '';\n  return pfx + code;\n}\nfunction fetchDictRows(dictCode, pageSize){\n  return fetch('/api/dict/'+encodeURIComponent(contentDictId(dictCode))+'/search',{\n    method:'POST', headers:{'Content-Type':'application/json'},\n    body:JSON.stringify({ pageSize:(pageSize||500), page:1 })\n  }).then(function(res){\n    if(res.status===404) return { __noSource:true, rows:[], total:0 };\n    if(!res.ok) throw new Error('字典内容加载失败 HTTP '+res.status+'（'+contentDictId(dictCode)+'）');\n    return res.json();\n  });\n}\n\nif(!host.__dictMetaReady||!host.dctMeta){ return; }\nvar m=host.dctMeta;\nvar sel=$('dictSel');\nvar code=(sel&&sel.value)|| (m.listTables()[0]&&m.listTables()[0].id) ||'';\nvar table=m.getTable(code);\nvar grid=$('dictGrid');\nvar colModel=host.dictColumnModel, ds=host.dictDataSet;\nif(!table||!grid){ return; }\nif(!colModel||!ds){ alert('页面模型未就绪：请在模型面板声明 dictColumnModel(CmxColumnModel) 与 dictDataSet(CmxDataSet)'); return; }\n/* 动态列：根据元数据字段创建 CmxColumn[]，灌入既有 CmxColumnModel（setMembers 覆盖） */\nvar cols=buildColumns(table);\ncolModel.datasetId='dict.'+code;\ncolModel.setMembers(cols);\ngrid.setColumnModel(colModel);\ngrid.setOptions({ selectionMode:'single', fillHeight:true, showRowIndex:true, editable:false });\nsetText('dictTitle', table.name+'（'+code+'）');\n/* ① 优先：从 CmxMasterSlave 的一级数据集取（已对**当前模块**批量加载过），不回后端。\n   仅当 dictMS 里的数据确属当前模块(__dictMSModule===__curModule)时才复用，否则切模块后会串上一套数据。 */\nvar msDs = (host.__dictMSModule===host.__curModule && host.dictMS && typeof host.dictMS.getRootDataSet==='function')\n  ? host.dictMS.getRootDataSet(code) : null;\nif(msDs){\n  grid.setDataSet(msDs);                         /* 直接绑定 MasterSlave 里的一级 CmxDataSet 实例 */\n  setText('rowCountText','列：'+cols.length+' · 行：'+msDs.rows.length+'（来自 CmxMasterSlave 一级数据集，未访问后端）');\n  return;\n}\n/* ② 回退：尚未批量加载 → 单查后端，写入 host.dictDataSet */\nsetText('rowCountText','加载中...');\nfetchDictRows(code, 500).then(function(data){\n  if(data && data.__noSource){\n    ds.datasetId='dict.'+code; ds.setRows([]);\n    grid.setDataSet(ds);\n    setText('rowCountText','列：'+cols.length+' · 行：0（该字典未注册数据源）');\n    return;\n  }\n  var rows=(data&&data.rows)||[];\n  ds.datasetId='dict.'+code;\n  ds.setRows(rows);\n  grid.setDataSet(ds);\n  setText('rowCountText','列：'+cols.length+' · 行：'+ds.rows.length+(data&&data.total!=null?'（共 '+data.total+'，单查后端）':'（单查后端）'));\n}).catch(function(e){\n  ds.setRows([]); grid.setDataSet(ds);\n  setText('rowCountText','内容加载失败：'+(e&&e.message||e));\n});\n","readsVars":[],"writesVars":[]},{"name":"batchLoadAll","params":"","body":"\nvar lib = globalThis.__cmxDataComp || host.__cmxClasses;\nvar root = host.shadowRoot;\nfunction $(id){ return root.querySelector('#'+id); }\nfunction setText(id,v){ var el=$(id); if(el) el.textContent=(v==null?'':String(v)); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction waitForLib(){\n  return new Promise(function(resolve,reject){\n    var n=0, t=setInterval(function(){\n      var L=globalThis.__cmxDataComp;\n      if(L && typeof L.loadMetaModelsBatch==='function' && L.CmxColumn && L.CmxColumnModel){ clearInterval(t); resolve(L); return; }\n      if(++n>120){ clearInterval(t); reject(new Error('cmx-data-comp 未就绪（loadMetaModelsBatch/CmxColumn/CmxColumnModel）')); }\n    },50);\n  });\n}\n/* 依据某个字典(CmxMetaTable)的元数据字段，动态创建 grid 列（CmxColumn[]）。 */\nfunction buildColumns(table){\n  var CmxColumn=lib.CmxColumn;\n  var refs=table.listFieldRefs();\n  return refs.map(function(ref){\n    var f=ref.field||{};\n    var id=ref.id||f.id||f.name||'';\n    var w = id==='id'?'90px' : id==='code'?'120px'\n          : id==='name'?'180px'\n          : (/time|date|_at$/.test(id))?'160px' : '140px';\n    /* caption 可能是 i18n 对象({zh_CN}) —— CmxColumn.toDescriptor 内部用 fieldCaption 解析当前语言 */\n    return new CmxColumn({ id:id, caption:(f.caption!=null?f.caption:id), dataType:(f.dataType||'VARCHAR'), width:w });\n  });\n}\n/* dict 服务里字典内容的 dictId 前缀：四套 CNPC 字典内容已带系统前缀(接入 dict 服务时约定)，\n   自研 gl 套无前缀。元模型 table.id 是无前缀 dictCode，查内容时按当前模块补前缀。 */\nvar DICT_PREFIX = { gl:'', fico:'sap_', ebs:'ebs_', yonyou:'yy_', kingdee:'kd_' };\nfunction contentDictId(code){\n  var pfx = DICT_PREFIX[host.__curModule] || '';\n  return pfx + code;\n}\nfunction fetchDictRows(dictCode, pageSize){\n  return fetch('/api/dict/'+encodeURIComponent(contentDictId(dictCode))+'/search',{\n    method:'POST', headers:{'Content-Type':'application/json'},\n    body:JSON.stringify({ pageSize:(pageSize||500), page:1 })\n  }).then(function(res){\n    if(res.status===404) return { __noSource:true, rows:[], total:0 };\n    if(!res.ok) throw new Error('字典内容加载失败 HTTP '+res.status+'（'+contentDictId(dictCode)+'）');\n    return res.json();\n  });\n}\n\nif(!host.__dictMetaReady||!host.dctMeta){ setText('batchInfo','请先加载元数据'); return; }\nif(typeof host.loadDictDataBatch!=='function'){ setText('batchInfo','服务 loadDictDataBatch 未定义（请在服务面板配置 REST POST /api/dict/batch-data）'); return; }\nvar m=host.dctMeta;\nvar tables=m.listTables();\nvar dictIds=tables.map(function(t){ return t.id; });   // 无前缀 dictCode(元模型)\nvar fieldCountById={}; tables.forEach(function(t){ fieldCountById[t.id]=t.listFieldRefs().length; });\nvar nameById={}; tables.forEach(function(t){ nameById[t.id]=t.name; });\n/* dict 服务内容用带前缀 dictId：发请求用前缀 id，回来按前缀→无前缀映射归位 */\nvar prefById={}; var unprefById={};\ndictIds.forEach(function(id){ var pid=contentDictId(id); prefById[id]=pid; unprefById[pid]=id; });\nvar reqIds=dictIds.map(function(id){ return prefById[id]; });\nsetText('batchInfo','批量加载中（单次请求 '+reqIds.length+' 个字典）...');\nvar btn=$('batchBtn'); if(btn) btn.setAttribute('disabled','');\n/* ① 单次批量请求：带前缀 dictIds 数组 → 后端一次返回多字典内容 */\nhost.loadDictDataBatch({ dictIds:reqIds, pageSize:500 }).then(function(resp){\n  var results=(resp&&resp.results)||{};\n  var errs=(resp&&resp.errors)||[];\n  var errSet={}; errs.forEach(function(e){ var uid=unprefById[e.dictId]||e.dictId; errSet[uid]=e.error; });\n  /* ② 每个字典 → 一个一级 CmxDataSet（key 用无前缀 code，供 selectDict 的 getRootDataSet 命中） */\n  var dsMap={};\n  dictIds.forEach(function(id){\n    var r=results[prefById[id]]||{};\n    var rows=r.rows||[];\n    var ds=new lib.CmxDataSet({ datasetId:id });\n    ds.setRows(rows);\n    dsMap[id]=ds;\n  });\n  /* ③ 装入模型面板声明的 CmxMasterSlave（host.dictMS），setDataSet 把各字典作为一级（根）CmxDataSet 数组接管 */\n  if(!host.dictMS){ setText('batchInfo','页面模型未就绪：请在模型面板声明 dictMS(CmxMasterSlave)'); if(btn) btn.removeAttribute('disabled'); return; }\n  host.dictMS.setDataSet(dsMap);   /* 一级（根）CmxDataSet 数组装载入口 */\n  host.__dictMSModule=host.__curModule;   /* 标记 dictMS 数据归属当前模块，供 selectDict 复用判断 */\n  /* ④ 汇总 grid：行数据从 dictMS 一级数据集统计（不是从原始响应），证明数据已在 MasterSlave 中 */\n  var CmxColumn=lib.CmxColumn;\n  var bgrid=$('batchGrid');\n  var bColModel=host.batchColumnModel, bds=host.batchDataSet;\n  if(!bColModel||!bds){ setText('batchInfo','页面模型未就绪：请声明 batchColumnModel(CmxColumnModel) 与 batchDataSet(CmxDataSet)'); if(btn) btn.removeAttribute('disabled'); return; }\n  var msTables=host.dictMS._data&&host.dictMS._data.tables||{};\n  var summary=dictIds.map(function(id){\n    var rootDs=msTables[id];\n    var rowCount=rootDs&&rootDs.rows?rootDs.rows.length:0;\n    var status=errSet[id]?'无数据源':'OK';\n    return { id:id, dictCode:id, dictName:nameById[id]||id, fieldCount:fieldCountById[id]||0, rowCount:rowCount, status:status };\n  });\n  var bcols=[\n    new CmxColumn({ id:'dictCode', caption:'字典编码', dataType:'VARCHAR', width:'150px' }),\n    new CmxColumn({ id:'dictName', caption:'字典名称', dataType:'VARCHAR', width:'170px' }),\n    new CmxColumn({ id:'fieldCount', caption:'字段数', dataType:'TINYINT', width:'90px', display:{align:'right'} }),\n    new CmxColumn({ id:'rowCount', caption:'一级数据集行数', dataType:'BIGINT', width:'130px', display:{align:'right'} }),\n    new CmxColumn({ id:'status', caption:'加载状态', dataType:'VARCHAR', width:'110px' })\n  ];\n  /* 汇总 grid 仍由两个模型组件管理：CmxColumnModel 承列、CmxDataSet 承数据 */\n  bColModel.setMembers(bcols);\n  bds.setRows(summary);\n  bgrid.setColumnModel(bColModel);\n  bgrid.setOptions({ selectionMode:'single', fillHeight:true, showRowIndex:true, editable:false });\n  bgrid.setDataSet(bds);\n  /* 点击汇总行 → 主 grid 切到该字典 */\n  bgrid.addEventListener('cmx-row-selected', function(ev){\n    var rid=ev&&ev.detail&&ev.detail.id;\n    var row=(rid!=null && bds.getRow)?bds.getRow(rid):null;\n    var dc=(row&&row.dictCode)||rid;\n    if(dc){ var sel=$('dictSel'); if(sel){ sel.value=dc; host.selectDict(); } }\n  });\n  var ok=summary.filter(function(s){return s.status==='OK';}).length;\n  var totalRows=summary.reduce(function(a,s){return a+(s.rowCount||0);},0);\n  var rootCount=Object.keys(msTables).length;\n  setText('batchInfo','批量完成（1 次请求）：'+summary.length+' 个字典 · 成功 '+ok+' · 已装入 CmxMasterSlave 一级数据集 '+rootCount+' 个 · 内容合计 '+totalRows+' 行（点行可切换主表）');\n  if(btn) btn.removeAttribute('disabled');\n}).catch(function(e){\n  setText('batchInfo','批量加载失败：'+(e&&e.message||e));\n  if(btn) btn.removeAttribute('disabled');\n});\n","readsVars":[],"writesVars":[]}],"pageServices":[{"name":"loadDefinitionsBatch","type":"rest","url":"/api/definitions/batch","method":"POST","rpcMethod":"","gqlOperationName":"","gqlQuery":"","headers":"","bodyTemplate":"","responseTo":"","responseTransform":""},{"name":"loadDictDataBatch","type":"rest","url":"/api/dict/batch-data","method":"POST","rpcMethod":"","gqlOperationName":"","gqlQuery":"","headers":"","bodyTemplate":"","responseTo":"","responseTransform":""}],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"if (host.loadModules) host.loadModules();"},{"name":"onActivate","enabled":true,"body":"if (!host.__dictMetaReady && host.loadModules) host.loadModules();"},{"name":"isDirty","enabled":true,"body":"return false;"},{"name":"getState","enabled":true,"body":"return { module: host.__curModule, dict: host.dctMeta ? host.dctMeta.getSummary() : null };"},{"name":"validate","enabled":true,"body":"return { valid: true };"}],"dataSources":[],"dataFlow":{"schema":[],"aggregations":[],"relations":[]},"models":[{"modelType":"CmxDCTMeta","instanceId":"dctMeta","props":{"domain":"fi","application":"cmxfico","module":"gl","file":"gl_md_dct_meta_v1.json","autoLoad":false}},{"modelType":"CmxColumnModel","instanceId":"dictColumnModel","props":{"datasetId":"dict","columns":[]}},{"modelType":"CmxDataSet","instanceId":"dictDataSet","props":{"rows":[]}},{"modelType":"CmxColumnModel","instanceId":"batchColumnModel","props":{"datasetId":"batchSummary","columns":[]}},{"modelType":"CmxDataSet","instanceId":"batchDataSet","props":{"rows":[]}},{"modelType":"CmxMasterSlave","instanceId":"dictMS","props":{"schema":[]}}]}</script>
