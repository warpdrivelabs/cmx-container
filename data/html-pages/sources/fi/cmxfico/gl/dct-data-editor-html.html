<div class="de-root"><style>
/* ── Neo 主题（对齐 data-editor.js native-page 视觉）── */
.de-root{
  --neo-cyan:#00b4d8;
  --neo-cyan-soft:#7bdff2;
  --neo-mint:#10b981;
  --neo-warn:#f59e0b;
  --neo-red:#e90b0b;
  --neo-bar-bg:color-mix(in srgb,var(--neo-cyan) 12%,var(--sapList_HeaderBackground,#eef2f6));
  --neo-border:color-mix(in srgb,var(--neo-cyan) 22%,var(--sapGroup_ContentBorderColor,#d9d9d9));
  --neo-border-soft:color-mix(in srgb,var(--neo-cyan) 14%,var(--sapGroup_ContentBorderColor,#d9d9d9));
  --neo-head-bg:color-mix(in srgb,var(--neo-cyan) 8%,var(--sapList_HeaderBackground,#f5f6f7));
  --neo-row-active:color-mix(in srgb,var(--neo-cyan) 18%,var(--sapList_Background,#fff));
  display:flex;flex-direction:column;height:100%;width:100%;box-sizing:border-box;padding:10px;gap:10px;min-width:0;
  font:13px/1.5 var(--sapFontFamily,Arial,sans-serif);color:var(--sapTextColor,#1d2d3e);background:var(--sapBackgroundColor,#f5f6f7);overflow:hidden}
.de-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:44px;box-sizing:border-box;padding:0 12px;
  border-bottom:1px solid var(--neo-border);background:var(--neo-bar-bg);border-radius:8px 8px 0 0}
.de-bar ui5-icon{width:1.2rem;height:1.2rem;color:var(--neo-cyan)}
.de-title{font-weight:700;font-size:14px;color:var(--neo-cyan)}
.de-subtitle{font-size:12px;color:var(--sapContent_LabelColor,#6a6d70)}
.de-msg{margin-left:auto;font-size:12px;color:var(--sapContent_LabelColor,#6a6d70)}
.de-msg.err{color:var(--sapNegativeColor,#bb0000)}
.de-msg.ok{color:var(--sapPositiveColor,#107e3e)}
.de-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;
  background:var(--sapList_Background,#fff);border:1px solid var(--neo-border-soft);border-radius:6px}
.de-toolbar > ui5-label{font-size:12px;color:var(--sapContent_LabelColor,#6a6d70)}
.de-dict-select{min-width:220px}
.de-filter{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:6px 10px;
  background:var(--sapList_Background,#fff);border:1px solid var(--neo-border-soft);border-radius:6px;font-size:12px}
/* 主体分两栏：tree(左树+右表) / flat(纯表格纵向) — 切字典时按 selfHierarchy 切 class */
.de-body{flex:1;min-height:0;min-width:0;display:flex;gap:10px}
.de-body.flat{flex-direction:column}
.de-body.tree{flex-direction:row}
.de-tree{flex:0 0 280px;display:flex;flex-direction:column;min-height:0;
  background:var(--sapList_Background,#fff);border:1px solid var(--neo-border-soft);border-radius:6px;overflow:hidden}
.de-tree[hidden]{display:none !important;}
.de-tree-head{flex:0 0 auto;padding:8px 12px;border-bottom:1px solid var(--neo-border-soft);
  background:var(--neo-head-bg);font-weight:600;font-size:13px;color:var(--neo-cyan);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.de-tree-title{flex:0 0 auto}
.de-tree-root{font-size:12px;font-weight:500;padding:3px 8px;cursor:pointer;border-radius:4px;
  color:var(--sapContent_LabelColor,#6a6d70);user-select:none;transition:background .15s,color .15s}
.de-tree-root:hover{background:color-mix(in srgb,var(--neo-cyan) 12%,transparent);color:var(--neo-cyan)}
.de-tree-root.active{background:color-mix(in srgb,var(--neo-cyan) 18%,transparent);color:var(--neo-cyan);font-weight:700}
.de-tree-body{flex:1;min-height:0;overflow:auto;padding:4px}
.de-right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px}
.de-grid-wrap{flex:1;min-height:0;position:relative;background:var(--sapList_Background,#fff);
  border:1px solid var(--neo-border-soft);border-radius:6px;overflow:hidden}
.de-grid{display:block;width:100%;height:100%}
/* cmx-web-treeview 节点高亮兜底（host 上设 CSS 变量；内部样式若未读取则不生效） */
.de-tree-body{cmx-tree-selected-bg:var(--neo-row-active);cmx-tree-selected-color:var(--neo-cyan)}
</style>
  <div class="de-bar">
    <ui5-icon name="database"></ui5-icon>
    <span class="de-title">字典数据维护</span>
    <span class="de-subtitle" id="deSubtitle"></span>
    <span class="de-msg" id="deMsg"></span>
  </div>
  <div class="de-toolbar">
    <ui5-label>字典：</ui5-label>
    <ui5-select id="deDictSelect" class="de-dict-select"></ui5-select>
    <ui5-button design="Emphasized" icon="refresh" id="btnReload">刷新</ui5-button>
    <ui5-button design="Default" icon="add" id="btnAdd">新增</ui5-button>
    <ui5-button design="Default" icon="delete" id="btnDel">删除</ui5-button>
    <ui5-button design="Positive" icon="save" id="btnSave">保存</ui5-button>
  </div>
  <div class="de-filter">

    <ui5-button design="Transparent" icon="search" id="btnSearch">搜索</ui5-button>
    <ui5-button design="Transparent" icon="clear-all" id="btnClearCond">清空</ui5-button>
  </div>
  <div class="de-body flat" id="deBody">

    <div class="de-tree" id="deTreeWrap" hidden>
      <div class="de-tree-head" id="deTreeHead">
        <span class="de-tree-title">字典结构</span>
        <span class="de-tree-root active" id="deTreeRoot" title="回到全部根节点">▶ 全部根节点</span>
      </div>
      <div class="de-tree-body">
        <cmx-web-treeview id="tree" id-member="id" path-member="full_path" level-member="level_no" display-value-member="displayValue" is-selected-member="is_selected" has-children-member="hasChildren" children-loading-member="children_loading" should-toggle-on-node-click="false" toggle-icon-mode="swap" expand-level="0" style="display:block;width:100%;height:100%;padding:4px;"></cmx-web-treeview>
      </div>
    </div>
    <div class="de-right">
      <div class="de-grid-wrap"><cmx-revo-grid id="deGrid" class="de-grid"></cmx-revo-grid></div>
      <cmx-pager id="dePager" page-size="50" page-sizes="20,50,100,200"></cmx-pager>
    </div>
  </div>
</div>
<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[{"name":"switchDict","params":"code","body":"/* 切换字典：dctMeta.loadById 换元数据 → colGrid/colTree.fromMeta 重建列 → dictMS.loadDict 换数据 */\nvar st=host.__; if(!st)return;\nvar code=String(code||\"\").trim(); if(!code)return;\nhost._setText(\"deMsg\",\"加载 \"+code+\" …\");\nvar def={domain:st.coord.domain,application:st.coord.application,module:st.coord.module,dict:code,\n  dbId:st.coord.dbId||\"\",binary:true,apiPath:\"/api/dct/data/tokio-zmc-msgpack\",saveApiPath:\"/api/dct/save\",pageSize:st.pageSize};\nhost.dctMeta.loadById(code).then(function(){ host.dictMS.bindDctMeta(host.dctMeta); /* 关联元数据，让 _resolveDictMeta 能取到 selfHierarchy 等 */\n  /* colGrid + colTree 都从元数据重建列（fromMeta 内部走 metaTableFieldsToColumns） */\n  return Promise.all([\n    host.colGrid.fromMeta(host.dctMeta, code, {respectOrder:true}),\n    host.colTree.fromMeta(host.dctMeta, code, {respectOrder:true})\n  ]);\n}).then(function(){\n  return host.dictMS.loadDict(def);\n}).then(function(r){\n  /* 判定 selfHierarchy：决定是否显示左树 */\n  var dm=host.dictMS._resolveDictMeta(def)||{};\n  st.selfHierarchy=!!dm.selfHierarchy;\n  st.parentField=dm.parentField||\"\";\n  st.dictCode=code; st.tableName=(host.dctMeta.getDictionary(code)||{}).tableName||code;\n  st.expandedPaths=[]; st.selectedNodeId=null;\n  /* 布局：树形显示左树 + 右表显根级；平级隐藏左树 + 右表显全部 */\n  /* 关键：无论 selfHierarchy 与否，setDictGridFilter 都必须先调一次 ——\n     它会按需建 _dictGrid.view（首次）或 fillView（切字典）。\n     原版只树形调用 → 平级字典首次切换后 _dictGrid 不存在，\n     host.dictMS.dictGridView() 返回 null，grid 拿不到数据。 */\n  if(host.dictMS._dictGrid){ host.dictMS._dictGrid.view=null; }\n  host.dictMS.setDictGridFilter(null);\n  if(st.selfHierarchy){\n    host._showTree();\n    host._setTreeRootActive(true);\n  } else {\n    host._hideTree();\n    host._setTreeRootActive(false);\n  }\n  host._bindGridView();\n  if(st.selfHierarchy){ host._bindTree(); }\n  var rows=(r&&r.rows)||(host.dictMS.dictGridView()&&host.dictMS.dictGridView().rows)||[];\n  host._setText(\"deMsg\",\"已装载 \"+rows.length+\" 条\",\"ok\");\n  host._updateSubtitle();\n}).catch(function(e){ host._setText(\"deMsg\",\"加载失败：\"+((e&&e.message)||e),\"err\"); });","readsVars":[],"writesVars":[]},{"name":"doReload","params":"","body":"var st=host.__; if(!st||!st.dictCode)return;\nhost._setText('deMsg','刷新中…');\nhost.dictMS.reloadDict().then(function(){\n  if(st.selfHierarchy){ host.dictMS.setDictGridFilter(st.selectedNodeId||null); }\n  else { host.dictMS.setDictGridFilter(null); }\n  host._bindGridView();\n  if(st.selfHierarchy){ host._bindTree(); }\n  var v=host.dictMS.dictGridView(); host._setText('deMsg','已装载 '+((v&&v.rows&&v.rows.length)||0)+' 条','ok');\n}).catch(function(e){ host._setText('deMsg','刷新失败：'+((e&&e.message)||e),'err'); });","readsVars":[],"writesVars":[]},{"name":"doAdd","params":"","body":"/* 新增行：树形在 selectedNodeId 下新增，平级在根新增\n   关键：用 addDictRow 替代 ds.addRow —— 字典 idField='code' 时 ds.addRow 默认按 'id' 取主键，\n   会用 r<random> 覆盖业务主键 'code' 并把临时 id 丢进随机字符串，导致新增行 id 不是 't' 开头。\n   addDictRow 内部按 idField 取主键，并把临时 id 同时落到 row.id 供 grid 't' 前缀旁路识别。 */\nvar st=host.__; if(!st||!st.dictCode)return;\nvar ds=host.dictMS.getRootDataSet('dict'); if(!ds)return;\nvar parentId=st.selfHierarchy?(st.selectedNodeId||null):null;\nvar nr=host.dictMS.newDictRow({parentId:parentId});\nhost.dictMS.addDictRow(nr);\nif(st.selfHierarchy){ host._bindTree(); }\nhost._setText('deMsg','已新增空行，单击单元格编辑','ok'); host._updateSubtitle();","readsVars":[],"writesVars":[]},{"name":"doDel","params":"","body":"/* 删除选中行：grid 取选中 id → deleteDictEntry（临时行前端删，DB 行调 REST） */\nvar st=host.__; var grid=host.shadowRoot.querySelector('#deGrid'); if(!st||!st.dictCode||!grid)return;\nvar ids=(grid.getSelectedIds?grid.getSelectedIds():[])||[];\nif(!ids.length){ host._cmxNotify('info','请先在表格中选择要删除的行'); return; }\nhost._libConfirm('确认删除选中的 '+ids.length+' 项？','删除确认').then(function(ok){\n  if(!ok)return;\n  var chain=ids.reduce(function(p,id){ return p.then(function(){ return host.dictMS.deleteDictEntry(id); }); },Promise.resolve());\n  chain.then(function(){ host._bindGridView();\n    if(st.selfHierarchy){ host._bindTree(); }\n    host._setText('deMsg','已删除 '+ids.length+' 项','ok'); host._updateSubtitle();\n  }).catch(function(e){ host._setText('deMsg','删除失败：'+((e&&e.message)||e),'err'); });\n});","readsVars":[],"writesVars":[]},{"name":"doSave","params":"","body":"/* 保存：commitGridEdits 收拢尾随编辑 → saveDict（内置 collector.export + presentDocError） */\nvar st=host.__; if(!st||!st.dictCode)return;\nhost._setText('deMsg','保存中…');\nhost._commitGridEdits(function(){\n  host.dictMS.saveDict().then(function(res){\n    host._setText('deMsg','已保存（'+((res&&res.affected)||0)+' 处改动）','ok');\n    return host.dictMS.reloadDict().then(function(){\n      if(st.selfHierarchy){ host.dictMS.setDictGridFilter(st.selectedNodeId||null); }\n      else { host.dictMS.setDictGridFilter(null); }\n      host._bindGridView();\n      if(st.selfHierarchy){ host._bindTree(); }\n      host._updateSubtitle();\n    });\n  }).catch(function(e){\n    host._setText('deMsg', e&&e.conflict?'保存冲突，已刷新':(e&&e.validation?'数据校验未通过':'保存失败：'+((e&&e.message)||e)),'err');\n    if(e&&e.conflict){ host.dictMS.reloadDict().then(function(){\n      if(st.selfHierarchy){ host.dictMS.setDictGridFilter(st.selectedNodeId||null); }\n      else { host.dictMS.setDictGridFilter(null); }\n      host._bindGridView();\n      if(st.selfHierarchy){ host._bindTree(); }\n    }); }\n  });\n});","readsVars":[],"writesVars":[]},{"name":"doSearch","params":"","body":"/* 关键字搜索：loadDict 传 q（后端模糊匹配 code/label）。树形时清 parent 过滤显示全部命中 */\nvar st=host.__; if(!st||!st.dictCode)return;\nvar q=String((host.shadowRoot.querySelector('#deQ')||{}).value||'').trim();\nst.q=q; st.page=1;\nhost._setText('deMsg','搜索中…');\nvar def={domain:st.coord.domain,application:st.coord.application,module:st.coord.module,dict:st.dictCode,\n  dbId:st.coord.dbId||'',binary:true,apiPath:'/api/dct/data/tokio-zmc-msgpack',saveApiPath:'/api/dct/save',query:{q:q, page:1, pageSize:st.pageSize}};\nhost.dictMS.loadDict(def).then(function(){\n  /* 搜索时清掉 parent 过滤，让所有命中行可见（无论层级） */\n  host.dictMS.setDictGridFilter(null);\n  host._bindGridView();\n  if(st.selfHierarchy){ host._bindTree(); }\n  var v=host.dictMS.dictGridView(); host._setText('deMsg','搜索完成，'+((v&&v.rows&&v.rows.length)||0)+' 条','ok');\n}).catch(function(e){ host._setText('deMsg','搜索失败：'+((e&&e.message)||e),'err'); });","readsVars":[],"writesVars":[]}],"pageServices":[],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"/* 初始化：读坐标(host.props/$coord) → 装字典下拉 → grid 绑 colGrid → 选首个字典\n   模型实例（dctMeta/dictMS/colGrid/colTree）由 initPageModels 自动创建并挂到 host */\nvar lib=globalThis.__cmxDataComp||{};\nvar root=host.shadowRoot;\nvar $=function(s){return root.querySelector(s);};\n/* 工具函数挂到 host._* 供 pageFns 复用（避免每个 pageFn 重复定义） */\nhost._setText=function(id,v,kind){var e=$('#'+id);if(!e)return;e.textContent=(v==null?'':String(v));e.className='de-msg'+(kind?' '+kind:'');};\nhost._cmxNotify=function(kind,msg){var fn=lib[kind==='ok'?'cmxInfo':(kind==='warn'?'cmxWarn':'cmxError')];if(typeof fn==='function'){try{fn(msg);}catch(e){}}};\nhost._libConfirm=function(message,title){\n  if(lib&&typeof lib.cmxConfirm==='function'){return lib.cmxConfirm(message,title||'请确认');}\n  return Promise.resolve(window.confirm(message));\n};\nhost._commitGridEdits=function(cb){\n  try{var da=function(r){var a=r&&r.activeElement;if(a&&a.shadowRoot&&a.shadowRoot.activeElement)return da(a.shadowRoot);return a;};\n    var ae=da(document);if(ae&&ae!==document.body){try{ae.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}if(typeof ae.blur==='function'){try{ae.blur();}catch(e){}}}}catch(e){}\n  requestAnimationFrame(function(){requestAnimationFrame(function(){try{cb();}catch(e){}});});\n};\nhost._updateSubtitle=function(){var st=host.__;var s=$('#deSubtitle');if(!s||!st||!st.dictCode)return;\n  s.textContent=st.dictCode+(st.selfHierarchy?' · 树形':' · 平级');\n
