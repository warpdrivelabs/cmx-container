<div class="de-root"><style>
/* ── Neo 主题（对齐 data-editor.js native-page 视觉）── */
.de-root{
  --neo-cyan:#00b4d8;
  --neo-cyan-soft:#7bdff2;
  --neo-mint:#10b981;
  --neo-warn:#f59e0b;
  --neo-red:#e90b0b;
  --neo-bar-bg:color-mix(in srgb,var(--neo-cyan) 12%,var(--sapList_HeaderBackground,#eef2f6));
  --neo-border:color-mix(in srgb,var(--neo-cyan) 22%,var(--sapGroup_ContentBorderColor,#d9d9d9));
  --neo-border-soft:color-mix(in srgb,var(--neo-cyan) 14%,var(--sapGroup_ContentBorderColor,#d9d9d9));
  --neo-head-bg:color-mix(in srgb,var(--neo-cyan) 8%,var(--sapList_HeaderBackground,#f5f6f7));
  --neo-row-active:color-mix(in srgb,var(--neo-cyan) 18%,var(--sapList_Background,#fff));
  display:flex;flex-direction:column;height:100%;width:100%;box-sizing:border-box;padding:10px;gap:10px;min-width:0;
  font:13px/1.5 var(--sapFontFamily,Arial,sans-serif);color:var(--sapTextColor,#1d2d3e);background:var(--sapBackgroundColor,#f5f6f7);overflow:hidden}
.de-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:44px;box-sizing:border-box;padding:0 12px;
  border-bottom:1px solid var(--neo-border);background:var(--neo-bar-bg);border-radius:8px 8px 0 0}
.de-bar ui5-icon{width:1.2rem;height:1.2rem;color:var(--neo-cyan)}
.de-title{font-weight:700;font-size:14px;color:var(--neo-cyan)}
.de-subtitle{font-size:12px;color:var(--sapContent_LabelColor,#6a6d70)}
.de-msg{margin-left:auto;font-size:12px;color:var(--sapContent_LabelColor,#6a6d70)}
.de-msg.err{color:var(--sapNegativeColor,#bb0000)}
.de-msg.ok{color:var(--sapPositiveColor,#107e3e)}
.de-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;
  background:var(--sapList_Background,#fff);border:1px solid var(--neo-border-soft);border-radius:6px}
.de-toolbar > ui5-label{font-size:12px;color:var(--sapContent_LabelColor,#6a6d70)}
.de-dict-select{min-width:220px}
.de-filter{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:6px 10px;
  background:var(--sapList_Background,#fff);border:1px solid var(--neo-border-soft);border-radius:6px;font-size:12px}
/* 主体分两栏：tree(左树+右表) / flat(纯表格纵向) — 切字典时按 selfHierarchy 切 class */
.de-body{flex:1;min-height:0;min-width:0;display:flex;gap:10px}
.de-body.flat{flex-direction:column}
.de-body.tree{flex-direction:row}
.de-tree{flex:0 0 280px;display:flex;flex-direction:column;min-height:0;
  background:var(--sapList_Background,#fff);border:1px solid var(--neo-border-soft);border-radius:6px;overflow:hidden}
.de-tree[hidden]{display:none !important;}
.de-tree-head{flex:0 0 auto;padding:8px 12px;border-bottom:1px solid var(--neo-border-soft);
  background:var(--neo-head-bg);font-weight:600;font-size:13px;color:var(--neo-cyan);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.de-tree-title{flex:0 0 auto}
.de-tree-actions{display:flex;align-items:center;gap:6px}
.de-tree-all,.de-tree-root{font-size:12px;font-weight:500;padding:3px 8px;cursor:pointer;border-radius:4px;
  color:var(--sapContent_LabelColor,#6a6d70);user-select:none;transition:background .15s,color .15s}
.de-tree-all:hover,.de-tree-root:hover{background:color-mix(in srgb,var(--neo-cyan) 12%,transparent);color:var(--neo-cyan)}
.de-tree-all.active,.de-tree-root.active{background:color-mix(in srgb,var(--neo-cyan) 18%,transparent);color:var(--neo-cyan);font-weight:700}
.de-tree-body{flex:1;min-height:0;overflow:auto;padding:4px}
.de-right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px}
.de-grid-wrap{flex:1;min-height:0;position:relative;background:var(--sapList_Background,#fff);
  border:1px solid var(--neo-border-soft);border-radius:6px;overflow:hidden}
.de-grid{display:block;width:100%;height:100%}
/* cmx-web-treeview 节点高亮兜底（host 上设 CSS 变量；内部样式若未读取则不生效） */
.de-tree-body{cmx-tree-selected-bg:var(--neo-row-active);cmx-tree-selected-color:var(--neo-cyan)}
</style>
  <div class="de-bar">
    <ui5-icon name="database"></ui5-icon>
    <span class="de-title">字典数据维护</span>
    <span class="de-subtitle" id="deSubtitle"></span>
    <span class="de-msg" id="deMsg"></span>

    <ui5-button design="Default" icon="delete" id="btnDel">删除</ui5-button>

  </div>

      </div>
      <div class="de-tree-body">
        <cmx-web-treeview id="tree" id-member="id" path-member="full_path" level-member="level_no" display-value-member="displayValue" is-selected-member="is_selected" has-children-member="hasChildren" children-loading-member="children_loading" should-toggle-on-node-click="false" toggle-icon-mode="swap" expand-level="0" style="display:block;width:100%;height:100%;padding:4px;"></cmx-web-treeview>
      </div>
    </div>
    <div class="de-right">
      <div class="de-grid-wrap"><cmx-revo-grid id="deGrid" class="de-grid"></cmx-revo-grid></div>
      <cmx-pager id="dePager" page-size="50" page-sizes="20,50,100,200"></cmx-pager>
    </div>
  </div>

<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[{"name":"switchDict","params":"code","body":"/* 切换字典：dctMeta.loadById 换元数据 → colGrid/colTree.fromMeta 重建列 → dictMS.loadDict 换数据\n   默认 viewMode='all'：setDictGridFilter('__all__') 显全量；用户主动选'全部根节点'或具体节点才收窄。 */\nvar st=host.__; if(!st)return;\nvar code=String(code||\"\").trim(); if(!code)return;\nhost._setText(\"deMsg\",\"加载 \"+code+\" …\");\nvar def={domain:st.coord.domain,application:st.coord.application,module:st.coord.module,dict:code,\n  dbId:st.coord.dbId||\"\",binary:true,apiPath:\"/api/dct/data/tokio-zmc-msgpack\",saveApiPath:\"/api/dct/save\",page:1,pageSize:st.pageSize};\nhost.dctMeta.loadById(code).then(function(){ host.dictMS.bindDctMeta(host.dctMeta); /* 关联元数据，让 _resolveDictMeta 能取到 selfHierarchy 等 */\n  /* colGrid + colTree 都从元数据重建列（fromMeta 内部走 metaTableFieldsToColumns） */\n  return Promise.all([\n    host.colGrid.fromMeta(host.dctMeta, code, {respectOrder:true}),\n    host.colTree.fromMeta(host.dctMeta, code, {respectOrder:true})\n  ]);\n}).then(function(){\n  return host.dictMS.loadDict(def);\n}).then(function(r){\n  /* 判定 selfHierarchy：决定是否显示左树 */\n  var dm=host.dictMS._resolveDictMeta(def)||{};\n  st.selfHierarchy=!!dm.selfHierarchy;\n  st.parentField=dm.parentField||\"\";\n  st.dictCode=code; st.tableName=(host.dctMeta.getDictionary(code)||{}).tableName||code;\n  st.expandedPaths=[]; st.selectedNodeId='__all__'; st.viewMode='all';\n  /* 布局：树形显示左树 + 右表默认全量（__all__）；平级隐藏左树 + 右表显全部 */\n  /* 关键：无论 selfHierarchy 与否，setDictGridFilter 都必须先调一次 ——\n     它会按需建 _dictGrid.view（首次）或 fillView（切字典）。 */\n  if(host.dictMS._dictGrid){ host.dictMS._dictGrid.view=null; }\n  host.dictMS.setDictGridFilter('__all__');\n  if(st.selfHierarchy){\n    host._showTree();\n    host._setTreeAllActive(true);\n    host._setTreeRootActive(false);\n  } else {\n    host._hideTree();\n    host._setTreeAllActive(false);\n    host._setTreeRootActive(false);\n  }\n  host._bindGridView();\n  if(st.selfHierarchy){ host._bindTree(); }\n  var rows=(r&&r.rows)||(host.dictMS.dictGridView()&&host.dictMS.dictGridView().rows)||[];\n  host._setText(\"deMsg\",\"已装载 \"+rows.length+\" 条\",\"ok\");\n  host._updateSubtitle();\n}).catch(function(e){ host._setText(\"deMsg\",\"加载失败：\"+((e&&e.message)||e),\"err\"); });","readsVars":[],"writesVars":[]},{"name":"doReload","params":"","body":"var st=host.__; if(!st||!st.dictCode)return;\nhost._setText('deMsg','刷新中…');\n/* 按当前 viewMode 还原 setDictGridFilter：\n   'all' → '__all__'（全量）、'root' → null（根级）、'node' → selectedNodeId（直接子级）、其他 → '__all__' */\nvar filterArg=st.selectedNodeId==='__all__'?'__all__':(st.selectedNodeId==null?null:st.selectedNodeId);\nhost.dictMS.reloadDict().then(function(){\n  if(st.selfHierarchy){ host.dictMS.setDictGridFilter(filterArg); }\n  else { host.dictMS.setDictGridFilter('__all__'); }\n  host._bindGridView();\n  if(st.selfHierarchy){ host._bindTree(); }\n  var v=host.dictMS.dictGridView(); host._setText('deMsg','已装载 '+((v&&v.rows&&v.rows.length)||0)+' 条','ok');\n}).catch(function(e){ host._setText('deMsg','刷新失败：'+((e&&e.message)||e),'err'); });","readsVars":[],"writesVars":[]},{"name":"doAdd","params":"","body":"/* 新增行：与 data-editor.js addRow（line 786-817）对齐——\n   在页面层直接构造临时行，grid 内部行 id='t...' 作 DataSet 主键 + 临时行旁路标识，\n   业务主键（code）留空让用户填。绝不能自动写临时 ID 到业务主键字段。\n   这样不依赖 cmx-master-slave.js 的 newDictRow/addDictRow（保持组件层无字典新增副作用）。 */\nvar st=host.__; if(!st||!st.dictCode)return;\nvar ds=host.dictMS.getRootDataSet('dict'); if(!ds)return;\nvar parentId=st.selfHierarchy?(st.selectedNodeId||null):null;\nst.tmpSeq=(st.tmpSeq||0)+1;\nvar tempId='t'+st.tmpSeq+'_'+(Date.now()%1e6);\nvar parent=parentId!=null?(ds.rows||[]).find(function(r){return String(r.id)===String(parentId);}):null;\nvar fp=parent?((parent.full_path||parent.id)+'.'+tempId):tempId;\nvar lv=parent?((Number(parent.level_no)||1)+1):1;\nds.addRow({\n  id:tempId, code:'', name:'',\n  parent_id:parentId,\n  full_path:fp, level_no:lv, is_leaf:1,\n  sort_no:(ds.rows||[]).length+1, status:1,\n  hasChildren:false, children_loading:false, displayValue:''\n});\nif(st.selfHierarchy){ host._bindTree(); }\nhost._setText('deMsg','已新增空行，单击单元格编辑','ok'); host._updateSubtitle();","readsVars":[],"writesVars":[]},{"name":"doDel","params":"","body":"/* 删除选中行：grid 取选中 id → deleteDictEntry（临时行前端删，DB 行调 REST） */\nvar st=host.__; var grid=host.shadowRoot.querySelector('#deGrid'); if(!st||!st.dictCode||!grid)return;\nvar ids=(grid.getSelectedIds?grid.getSelectedIds():[])||[];\nif(!ids.length){ host._cmxNotify('info','请先在表格中选择要删除的行'); return; }\nhost._libConfirm('确认删除选中的 '+ids.length+' 项？','删除确认').then(function(ok){\n  if(!ok)return;\n  var chain=ids.reduce(function(p,id){ return p.then(function(){ return host.dictMS.deleteDictEntry(id); }); },Promise.resolve());\n  chain.then(function(){ host._bindGridView();\n    if(st.selfHierarchy){ host._bindTree(); }\n    host._setText('deMsg','已删除 '+ids.length+' 项','ok'); host._updateSubtitle();\n  }).catch(function(e){ host._setText('deMsg','删除失败：'+((e&&e.message)||e),'err'); });\n});","readsVars":[],"writesVars":[]},{"name":"doSave","params":"","body":"/* 保存：commitGridEdits 收拢尾随编辑 → saveDict（内置 collector.export + presentDocError）\n   reload 后按 viewMode 还原 setDictGridFilter（与 doReload 一致） */\nvar st=host.__; if(!st||!st.dictCode)return;\nvar filterArg=st.selectedNodeId==='__all__'?'__all__':(st.selectedNodeId==null?null:st.selectedNodeId);\nhost._setText('deMsg','保存中…');\nhost._commitGridEdits(function(){\n  host.dictMS.saveDict().then(function(res){\n    host._setText('deMsg','已保存（'+((res&&res.affected)||0)+' 处改动）','ok');\n    return host.dictMS.reloadDict().then(function(){\n      if(st.selfHierarchy){ host.dictMS.setDictGridFilter(filterArg); }\n      else { host.dictMS.setDictGridFilter('__all__'); }\n      host._bindGridView();\n      if(st.selfHierarchy){ host._bindTree(); }\n      host._updateSubtitle();\n    });\n  }).catch(function(e){\n    host._setText('deMsg', e&&e.conflict?'保存冲突，已刷新':(e&&e.validation?'数据校验未通过':'保存失败：'+((e&&e.message)||e)),'err');\n    if(e&&e.conflict){ host.dictMS.reloadDict().then(function(){\n      if(st.selfHierarchy){ host.dictMS.setDictGridFilter(filterArg); }\n      else { host.dictMS.setDictGridFilter('__all__'); }\n      host._bindGridView();\n      if(st.selfHierarchy){ host._bindTree(); }\n    }); }\n  });\n});","readsVars":[],"writesVars":[]},{"name":"doSearch","params":"","body":"/* 关键字搜索：loadDict 不带 parentId 调后端 → 后端不过滤（q 走 code/label 模糊）。\n   树形字典：loadDict body 实际已经不带 parentId（_buildQueryBody 跳过 undefined）→ 后端全量。\n   搜索结果统一用 setDictGridFilter('__all__') 显全量命中，让跨层级命中都能看到。\n   同步设置 st.selectedNodeId='__all__' / st.currentParentId=undefined：保证 doReload/doSave 还原 viewMode 时按'全部'模式还原，状态不会停留在旧节点。 */\nvar st=host.__; if(!st||!st.dictCode)return;\nvar q=String((host.shadowRoot.querySelector('#deQ')||{}).value||'').trim();st.q=q; st.page=1;\n/* 搜索时同步 state：selectedNodeId/currentParentId 切到 __all__，让 doReload/doSave 还原时走全量 */\nif(st.selfHierarchy){ st.selectedNodeId='__all__'; st.currentParentId=undefined; }\nhost._setText('deMsg','搜索中…');\nvar def={domain:st.coord.domain,application:st.coord.application,module:st.coord.module,dict:st.dictCode,\n  dbId:st.coord.dbId||'',binary:true,apiPath:'/api/dct/data/tokio-zmc-msgpack',saveApiPath:'/api/dct/save',query:{q:q, page:1, pageSize:st.pageSize}};\n/* 树形字典：搜索时**不传 parentId**（cmx-dct-source.js _buildQueryBody 跳过 undefined → body 无 parentId 键 → 后端不过滤）*/\nif(st.selfHierarchy){ /* parentId 不写：保持 undefined（def.query 内已不携带） */ }\nhost.dictMS.loadDict(def).then(function(){\n  /* 搜索结果统一显全量：跨所有层级 */\n  host.dictMS.setDictGridFilter('__all__');\n  /* 同步 viewMode='all' 状态：保持按钮高亮一致 */\n  st.viewMode='all'; host._viewMode='all';\n  host._setTreeAllActive(true); host._setTreeRootActive(false);\n  host._bindGridView();\n  if(st.selfHierarchy){ host._bindTree(); }\n  var v=host.dictMS.dictGridView(); host._setText('deMsg','搜索完成，'+((v&&v.rows&&v.rows.length)||0)+' 条','ok');\n}).catch(function(e){ host._setText('deMsg','搜索失败：'+((e&&e.message)||e),'err'); });","readsVars":[],"writesVars":[]}],"pageServices":[],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"/* 初始化：读坐标(host.props/$coord) → 装字典下拉 → grid 绑 colGrid → 选首个字典\n   模型实例（dctMeta/dictMS/colGrid/colTree）由 initPageModels 自动创建并挂到 host */\nvar lib=globalThis.__cmxDataComp||{};\nvar root=host.shadowRoot;\nvar $=function(s){return root.querySelector(s);};\n/* 工具函数挂到 host._* 供 pageFns 复用（避免每个 pageFn 重复定义） */\nhost._setText=function(id,v,kind){var e=$('#'+id);if(!e)return;e.textContent=(v==null?'':String(v));e.className='de-msg'+(kind?' '+kind:'');};\nhost._cmxNotify=function(kind,msg){var fn=lib[kind==='ok'?'cmxInfo':(kind==='warn'?'cmxWarn':'cmxError')];if(typeof fn==='function'){try{fn(msg);}catch(e){}}};\nhost._libConfirm=function(message,title){\n  if(lib&&typeof lib.cmxConfirm==='function'){return lib.cmxConfirm(message,title||'请确认');}\n  return Promise.resolve(window.confirm(message));\n};\nhost._commitGridEdits=function(cb){\n  try{var da=function(r){var a=r&&r.activeElement;if(a&&a.shadowRoot&&a.shadowRoot.activeElement)return da(a.shadowRoot);return a;};\n    var ae=da(document);if(ae&&ae!==document.body){try{ae.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}if(typeof ae.blur==='function'){try{ae.blur();}catch(e){}}}}catch(e){}\n  requestAnimationFrame(function(){requestAnimationFrame(function(){try{cb();}catch(e){}});});\n};\nhost._updateSubtitle=function(){var st=host.__;var s=$('#deSubtitle');if(!s||!st||!st.dictCode)return;\n  s.textContent=st.dictCode+(st.selfHierarchy?' · 树形':' · 平级');\n  var c=host.dictMS&&host.dictMS._collector;var dirty=c?Object.keys(c.export()||{}).length:0;\n  if(dirty)s.textContent+=' · 未保存 '+dirty+' 项';\n};\nhost._bindGridView=function(){\n  var st=host.__; if(!st)return;\n  var grid=$('#deGrid');\n  /* 切字典时重建 grid：cmx-revo-grid 复用同一实例 setColumnModel+setDataSet 后，\n     内部 Stencil/revo-grid 状态机停留在「非编辑」态（editor.hasEditor=false），\n     与 data-editor.js 的 applyRowsToGrid 对齐：dictCode 变化就 remove + recreate。\n     重建也覆盖首次绑定（__lastGridDictCode=undefined），让新 grid 与原 HTML grid 走同一条路径。 */\n  if(!grid || st.dictCode !== st.__lastGridDictCode){\n    var wrap=grid?grid.parentNode:$('.de-grid-wrap');\n    if(!wrap)return;\n    if(grid){\n      try{grid.setColumnModel(null);}catch(__){ }\n      try{grid.setDataSet(null);}catch(__){ }\n      grid.parentNode.removeChild(grid);\n    }\n    grid=document.createElement('cmx-revo-grid');\n    grid.id='deGrid'; grid.className='de-grid';\n    wrap.appendChild(grid);\n    st.__lastGridDictCode=st.dictCode;\n  }\n  if(!grid)return;\n  /* 列模型：setColumnModel(null) 先解绑旧监听再传 colGrid（防止 setColumnModel 同引用走快路径漏 apply） */\n  if(grid.setColumnModel){try{grid.setColumnModel(null);}catch(e){}if(host.colGrid){grid.setColumnModel(host.colGrid);}}\n  /* 数据视图：setDataSet 同 view 引用时只 _syncSelection 不 _assignSource（见 cmx-revo-grid.js:573-578），\n     所以切字典后必须先 null 再传 view，强制走 prevDs!==dsOrRows 分支重灌 _displaySource */\n  var v=host.dictMS&&host.dictMS.dictGridView();\n  if(grid.setDataSet){try{grid.setDataSet(null);}catch(e){}if(v){grid.setDataSet(v);}}\n  /* readonlyWhen 已由 metaTableFieldsToColumns 统一输出，无需 __cmxNewRowBypass 旁路 */\n  if(grid.setOptions)grid.setOptions({selectionMode:'multi',fillHeight:true,showRowIndex:true,editable:true,editTrigger:'click',showTotals:false,showRequiredMark:true});\n  /* 兜底 force re-render：切字典后即使 setDataSet 走了快路径（prevDs===dsOrRows），\n     也要确保 _revo.source 被推为最新 _displaySource（[...this._rows, ...fillers]）。\n     _assignSource 会 ++_sourceRevision 让 _sourceSignature 变化，\n     后续 _syncToRevo 不会因签名相等跳过 source 赋值。 */\n  if(typeof grid._assignSource==='function' && Array.isArray(grid._rows)){\n    try{ grid._assignSource(grid._displaySource()); }catch(_){ /* ignore */ }\n  }\n};\n/* 显示/隐藏左树：通过 body 的 class 切布局（CSS 控制 tree/flat 两种 flex-direction） */\nhost._showTree=function(){\n  var body=$('#deBody'); if(!body)return;\n  body.classList.remove('flat'); body.classList.add('tree');\n  /* 树不在 DOM 里就 re-append（参考 data-editor.js 的 insertBefore 思路） */\n  var tw=host.__treeEl;\n  if(tw && tw.parentNode!==body){ body.insertBefore(tw, body.firstChild); }\n  if(tw)tw.hidden=false;\n};\nhost._hideTree=function(){\n  var body=$('#deBody'); if(!body)return;\n  body.classList.remove('tree'); body.classList.add('flat');\n  /* 关键：完全从 DOM remove（参考 data-editor.js 1358: tree.remove()）—— 不只是 hidden，\n     避免 deTreeWrap 占据空间；_showTree 会 re-append 回来 */\n  var tw=host.__treeEl;\n  if(tw && tw.parentNode){ tw.parentNode.removeChild(tw); }\n};\n/* 把 deTreeWrap 引用存到 host，供 _showTree 重新插入 DOM（hideTree 会 remove，showTree 会 re-append） */\nhost.__treeEl=$('#deTreeWrap');\n/* 绑定左树数据：colTree + DataSet，监听 node-clicked/tree-changed（懒加载 + 选中联动） */\nhost._bindTree=function(){\n  var tree=$('#tree'); if(!tree)return;\n  var ds=host.dictMS&&host.dictMS.getRootDataSet('dict');\n  if(!ds)return;\n  if(host.colTree&&tree.setColumnModel)tree.setColumnModel(host.colTree);\n  if(tree.setDataSet)tree.setDataSet(ds);\n  host.__ds=ds;\n  /* 事件只绑一次（切字典时不重复绑） */\n  if(host.__treeWired)return;\n  host.__treeWired=true;\n  tree.addEventListener('node-clicked',function(e){\n    var node=e&&e.detail&&e.detail.node;\n    var id=node&&(node.id!=null?node.id:(node.data&&node.data.id));\n    if(id==null)return;\n    host._selectNode(id,node);\n  });\n  /* 懒加载：监听 tree-changed，比对 expandedPaths 快照，对新展开节点调 loadDictChildren */\n  host.__expandedPaths=[];\n  tree.addEventListener('tree-changed',function(){\n    setTimeout(function(){\n      if(!tree.getExpandedPaths)return;\n      var paths=tree.getExpandedPaths()||[];\n      var prev=host.__expandedPaths||[];\n      var pm={};prev.forEach(function(p){pm[p]=1;});\n      var newly=paths.filter(function(p){return !pm[p];});\n      host.__expandedPaths=paths.slice();\n      newly.forEach(function(path){\n        var node=tree.getNodeByPath&&tree.getNodeByPath(path);\n        if(!node||!node.data)return;\n        var rd=node.data;\n        if(rd.hasChildren!==true)return;\n        /* 去重：DataSet 里已有 parent_id===id 的行就不重复拉 */\n        var ds2=host.dictMS&&host.dictMS.getRootDataSet('dict');\n        if(ds2&&ds2.rows){var exists=ds2.rows.some(function(r){return String(r.parent_id)===String(rd.id);});if(exists)return;}\n        host.dictMS.loadDictChildren({parentId:rd.id}).then(function(){\n          host._bindTree(); /* 重灌树，展开态由 web-treeview 自动恢复 */\n        }).catch(function(){});\n      });\n    },0);\n  });\n};\n/* \"全部\"按钮 active 态切换：viewMode==='all' 时激活（默认） */\nhost._setTreeAllActive=function(active){\n  var al=$('#deTreeAll'); if(al)al.classList.toggle('active', !!active);\n  /* 互斥：all 高亮时取消 root 高亮 */\n  if (active) { var tr = $('#deTreeRoot'); if (tr) tr.classList.remove('active'); }\n};\n/* 根节点按钮 active 态切换：viewMode==='root' 时激活 */\nhost._setTreeRootActive=function(active){\n  var tr=$('#deTreeRoot'); if(tr)tr.classList.toggle('active', !!active);\n  /* 互斥：root 高亮时取消 all 高亮 */\n  if (active) { var al = $('#deTreeAll'); if (al) al.classList.remove('active'); }\n};\n/* \"全部\"按钮：viewMode='all' → setDictGridFilter('__all__') 显全量（不过滤所有行）。\n   与\"全部根节点\"语义不同——'all' 跨所有层级显全量，'root' 只显根级。 */\nhost._selectAll=function(){\n  var st=host.__; if(!st)return;\n  st.selectedNodeId='__all__';\n  st.viewMode='all';\n  host._viewMode='all';\n  host.dictMS.setDictGridFilter('__all__');\n  host._setTreeAllActive(true);\n  host._setTreeRootActive(false);\n  host._bindGridView();\n  host._setText('deMsg','显示全部数据（跨所有层级）');\n  host._updateSubtitle();\n};\n/* \"全部根节点\"按钮：viewMode='root' → setDictGridFilter(null) 显根级（parent_id 空） */\nhost._selectRoot=function(){\n  var st=host.__; if(!st)return;\n  st.selectedNodeId=null;\n  st.viewMode='root';\n  host._viewMode='root';\n  host.dictMS.setDictGridFilter(null);\n  host._setTreeAllActive(false);\n  host._setTreeRootActive(true);\n  host._bindGridView();\n  host._setText('deMsg','显示全部根节点（parent_id 为空）');\n  host._updateSubtitle();\n};\n/* 选中具体节点：viewMode='node' → setDictGridFilter(id) 显该节点直接子级 */\nhost._selectNode=function(id,node){\n  var st=host.__; if(!st)return;\n  st.selectedNodeId=id;\n  st.viewMode='node';\n  host._viewMode='node';\n  host.dictMS.setDictGridFilter(id);\n  host._setTreeAllActive(false);\n  host._setTreeRootActive(false);\n  if(host.dictMS.setDictSelected)host.dictMS.setDictSelected(id);\n  host._bindGridView();\n  host._setText('deMsg','选中节点：'+(node&&node.data&&node.data.name||id)+'（右表显直接子级）');\n  host._updateSubtitle();\n};\nhost._setText('deMsg','初始化…');\n/* 读坐标：host.props(菜单注入) 优先，host.$coord(注册位置) 兜底 */\nvar p=host.props||{}; var c=host.$coord||{};\nvar coord={domain:p.domain||c.domain||'',application:p.application||c.application||'',module:p.module||c.module||'',dbId:p.dbId||p.db_id||''};\nif(!coord.domain||!coord.application||!coord.module){host._setText('deMsg','缺少坐标(domain/application/module)','err');return;}\nhost.__={coord:coord,dictCode:'',tableName:'',selfHierarchy:false,parentField:'',q:'',pageSize:50,page:1,selectedNodeId:'__all__',viewMode:'all',expandedPaths:[]};\n/* 回填坐标到 dctMeta 实例：loadById 用真实坐标（models 里的坐标只是占位） */\nhost.dctMeta.domain=coord.domain; host.dctMeta.application=coord.application; host.dctMeta.module=coord.module;\n/* 装字典下拉 */\nvar qs='domain='+encodeURIComponent(coord.domain)+'&application='+encodeURIComponent(coord.application)+'&module='+encodeURIComponent(coord.module);\nfetch('/api/definitions/list?kind=DCT&'+qs,{headers:coord.dbId?{db_id:coord.dbId}:{},credentials:'same-origin'})\n  .then(function(r){return r.json();})\n  .then(function(body){var d=(body&&typeof body.code==='number')?body.data:body;var items=(d&&d.items)||[];\n    if(!items.length){host._setText('deMsg','该坐标下未找到 DCT 字典定义','err');return;}\n    var def_=items.filter(function(it){return it.isDefault;})[0]||items[0];\n    var dicts=(def_.dictionaries||[]).map(function(x){return {dictCode:x.dictCode,dictName:x.dictName};});\n    var sel=$('#deDictSelect');\n    sel.innerHTML=dicts.map(function(x){return '<ui5-option value=\"'+x.dictCode+'\">'+(x.dictName||x.dictCode)+'（'+x.dictCode+'）</ui5-option>';}).join('');\n    sel.addEventListener('change',function(ev){var o=ev.detail&&ev.detail.selectedOption;var code=o?o.getAttribute('value'):'';if(code)host.switchDict(code);});\n    $('#btnReload').addEventListener('click',function(){host.doReload();});\n    $('#btnAdd').addEventListener('click',function(){host.doAdd();});\n    $('#btnDel').addEventListener('click',function(){host.doDel();});\n    $('#btnSave').addEventListener('click',function(){host.doSave();});\n    $('#btnSearch').addEventListener('click',function(){host.doSearch();});\n    $('#deQ').addEventListener('keydown',function(ev){if(ev.key==='Enter')host.doSearch();});\n    $('#btnClearCond').addEventListener('click',function(){var q=$('#deQ');if(q)q.value='';host.__.q='';host.doSearch();});\n    if(dicts.length){host.switchDict(dicts[0].dictCode);}\n  }).catch(function(e){host._setText('deMsg','字典清单加载失败：'+((e&&e.message)||e),'err');});\n/* \"全部\"按钮 click：viewMode='all' 显全量（与\"全部根节点\"互斥） */\nvar deTreeAllEl=$('#deTreeAll');\nif(deTreeAllEl&&!host.__treeAllWired){\n  host.__treeAllWired=true;\n  deTreeAllEl.addEventListener('click',function(){host._selectAll();});\n}\n/* \"全部根节点\"按钮 click：viewMode='root' 显根级（与\"全部\"互斥） */\nvar deTreeRootEl=$('#deTreeRoot');\nif(deTreeRootEl&&!host.__treeRootWired){\n  host.__treeRootWired=true;\n  deTreeRootEl.addEventListener('click',function(){host._selectRoot();});\n}"},{"name":"getPageApi","enabled":true,"body":"return {};"},{"name":"isDirty","enabled":true,"body":"var c=host.dictMS&&host.dictMS._collector;return c?Object.keys(c.export()||{}).length>0:false;"}],"dataSources":[],"dataFlow":{"schema":[{"id":"dict"}],"aggregations":[],"relations":[]},"models":[{"modelType":"CmxDCTMeta","instanceId":"dctMeta","props":{"autoLoad":false}},{"modelType":"CmxMasterSlave","instanceId":"dictMS","props":{"schema":[{"id":"dict"}],"relations":[],"aggregations":[],"metaModelId":"dctMeta","autoLoad
