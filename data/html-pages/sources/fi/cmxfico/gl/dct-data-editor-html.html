<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[{"name":"switchDict","params":"code","body":"/* 切换字典：dctMeta.loadById 换元数据 → colGrid.fromMeta 重建列 → dictMS.loadDict 换数据 */\nvar st=host.__; if(!st)return;\nvar code=String(code||\"\").trim(); if(!code)return;\nhost._setText(\"deMsg\",\"加载 \"+code+\" …\");\nvar def={domain:st.coord.domain,application:st.coord.application,module:st.coord.module,dict:code,\n  dbId:st.coord.dbId||\"\",binary:true,apiPath:\"/api/dct/data/tokio-zmc-msgpack\",saveApiPath:\"/api/dct/save\",pageSize:st.pageSize};\nhost.dctMeta.loadById(code).then(function(){\n  /* colGrid.fromMeta：从 dctMeta 取字段→转列→setMembers，grid 自动重刷列（与 initPageModels 自动填列同逻辑） */\n  return host.colGrid.fromMeta(host.dctMeta, code, {respectOrder:true});\n}).then(function(){\n  return host.dictMS.loadDict(def);\n}).then(function(r){\n  host.dictMS.setDictGridFilter(null);\n  st.dictCode=code; st.tableName=(host.dctMeta.getDictionary(code)||{}).tableName||code;\n  st.selfHierarchy=!!((host.dictMS._resolveDictMeta(def)||{}).selfHierarchy);\n  host._bindGridView();\n  var rows=(r&&r.rows)||(host.dictMS.dictGridView()&&host.dictMS.dictGridView().rows)||[];\n  host._setText(\"deMsg\",\"已装载 \"+rows.length+\" 条\",\"ok\");\n  host._updateSubtitle();\n}).catch(function(e){ host._setText(\"deMsg\",\"加载失败：\"+((e&&e.message)||e),\"err\"); });","readsVars":[],"writesVars":[]},{"name":"doReload","params":"","body":"var st=host.__; if(!st||!st.dictCode)return;\nhost._setText('deMsg','刷新中…');\nhost.dictMS.reloadDict().then(function(){ host.dictMS.setDictGridFilter(null); host._bindGridView();\n  var v=host.dictMS.dictGridView(); host._setText('deMsg','已装载 '+((v&&v.rows&&v.rows.length)||0)+' 条','ok');\n}).catch(function(e){ host._setText('deMsg','刷新失败：'+((e&&e.message)||e),'err'); });\n","readsVars":[],"writesVars":[]},{"name":"doAdd","params":"","body":"/* 新增行：newDictRow 造临时行 → ds.addRow 入集 → collector 自动跟踪 */\nvar st=host.__; if(!st||!st.dictCode)return;\nvar ds=host.dictMS.getRootDataSet('dict'); if(!ds)return;\nvar nr=host.dictMS.newDictRow({});\nds.addRow(nr); host._setText('deMsg','已新增空行，单击单元格编辑','ok'); host._updateSubtitle();\n","readsVars":[],"writesVars":[]},{"name":"doDel","params":"","body":"/* 删除选中行：grid 取选中 id → deleteDictEntry（临时行前端删，DB 行调 REST） */\nvar st=host.__; var grid=host.shadowRoot.querySelector('#deGrid'); if(!st||!st.dictCode||!grid)return;\nvar ids=(grid.getSelectedIds?grid.getSelectedIds():[])||[];\nif(!ids.length){ host._cmxNotify('info','请先在表格中选择要删除的行'); return; }\nhost._libConfirm('确认删除选中的 '+ids.length+' 项？','删除确认').then(function(ok){\n  if(!ok)return;\n  var chain=ids.reduce(function(p,id){ return p.then(function(){ return host.dictMS.deleteDictEntry(id); }); },Promise.resolve());\n  chain.then(function(){ host._bindGridView(); host._setText('deMsg','已删除 '+ids.length+' 项','ok'); host._updateSubtitle();\n  }).catch(function(e){ host._setText('deMsg','删除失败：'+((e&&e.message)||e),'err'); });\n});\n","readsVars":[],"writesVars":[]},{"name":"doSave","params":"","body":"/* 保存：commitGridEdits 收拢尾随编辑 → saveDict（内置 collector.export + presentDocError） */\nvar st=host.__; if(!st||!st.dictCode)return;\nhost._setText('deMsg','保存中…');\nhost._commitGridEdits(function(){\n  host.dictMS.saveDict().then(function(res){\n    host._setText('deMsg','已保存（'+((res&&res.affected)||0)+' 处改动）','ok');\n    return host.dictMS.reloadDict().then(function(){ host.dictMS.setDictGridFilter(null); host._bindGridView(); host._updateSubtitle(); });\n  }).catch(function(e){\n    host._setText('deMsg', e&&e.conflict?'保存冲突，已刷新':(e&&e.validation?'数据校验未通过':'保存失败：'+((e&&e.message)||e)),'err');\n    if(e&&e.conflict){ host.dictMS.reloadDict().then(function(){ host.dictMS.setDictGridFilter(null); host._bindGridView(); }); }\n  });\n});\n","readsVars":[],"writesVars":[]},{"name":"doSearch","params":"","body":"/* 关键字搜索：loadDict 传 q 参数（后端模糊匹配 code/label） */\nvar st=host.__; if(!st||!st.dictCode)return;\nvar q=String((host.shadowRoot.querySelec ){}});});\n};\nhost._updateSubtitle=function(){var st=host.__;var s=$('#deSubtitle');if(!s||!st||!st.dictCode)return;s.textContent=st.dictCode+(st.selfHierarchy?' · 树形':' · 平级');\n  var c=host.dictMS&&host.dictMS._collector;var dirty=c?Object.keys(c.export()||{}).length:0;\n  if(dirty)s.textContent+=' · 未保存 '+dirty+' 项';\n};\nhost._bindGridView=function(){var grid=$('#deGrid');if(!grid)return;if(host.colGrid&&grid.setColumnModel)grid.setColumnModel(host.colGrid);\n  var v=host.dictMS&&host.dictMS.dictGridView();if(v&&grid.setDataSet)grid.setDataSet(v);\n  if(grid.setOptions)grid.setOptions({selectionMode:'multi',fillHeight:true,showRowIndex:true,editable:true,editTrigger:'click',showTotals:false});\n};\nhost._setText('deMsg','初始化…');\n/* 读坐标：host.props(菜单注入) 优先，host.$coord(注册位置) 兜底 */\nvar p=host.props||{}; var c=host.$coord||{};\nvar coord={domain:p.domain||c.domain||'',application:p.application||c.application||'',module:p.module||c.module||'',dbId:p.dbId||p.db_id||''};\nif(!coord.domain||!coord.application||!coord.module){host._setText('deMsg','缺少坐标(domain/application/module)','err');return;}\nhost.__={coord:coord,dictCode:'',tableName:'',selfHierarchy:false,q:'',pageSize:50,page:1};\n/* 回填坐标到 dctMeta 实例：loadById 用真实坐标（models 里的坐标只是占位） */\nhost.dctMeta.domain=coord.domain; host.dctMeta.application=coord.application; host.dctMeta.module=coord.module;\n/* 装字典下拉 */\nvar qs='domain='+encodeURIComponent(coord.domain)+'&application='+encodeURIComponent(coord.application)+'&module='+encodeURIComponent(coord.module);\nfetch('/api/definitions/list?kind=DCT&'+qs,{headers:coord.dbId?{db_id:coord.dbId}:{},credentials:'same-origin'})\n  .then(function(r){return r.json();})\n  .then(function(body){var d=(body&&typeof body.code==='number')?body.data:body;var items=(d&&d.items)||[];\n    if(!items.length){host._setText('deMsg','该坐标下未找到 DCT 字典定义','err');return;}\n    var def_=items.filter(function(it){return it.isDefault;})[0]||items[0];\n    var dicts=(def_.dictionaries||[]).map(
