.de-tree-meta{font-size:11px;color:var(--sapContent_LabelColor,#6a6d70)}

<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[{"name":"__bootstrap","params":"","body":"\n/* ===== 字典数据维护（HTML 版）元数据驱动通用页 =====\n * 从原生页 portal.dct.data-editor 移植。坐标来源：host.props（菜单注入）优先，host.$coord（页面注册位置）兜底。\n * 所有运行期状态挂到 host.__（实例级，避免跨实例污染）。辅助函数挂到 host._fn.* 供 pageFn 包装器复用。 */\nif (host.__booted) return;\nhost.__booted = true;\n\nvar cmx = function () { return (typeof globalThis !== 'undefined' && globalThis.__cmxDataComp) || {}; };\n\n/* 读取坐标四元组：菜单 props 优先，$coord 兜底 */\nfunction readDef () {\n  var p = host.props || {};\n  var c = host.$coord || {};\n  var def = {\n    domain: p.domain || c.domain || '',\n    application: p.application || c.application || '',\n    module: p.module || c.module || '',\n    dbId: p.dbId || p.db_id || '',\n    initialDictCode: p.dictCode || p.dict || ''\n  };\n  return (def.domain && def.application && def.module) ? def : null;\n}\n\n/* 字段角色识别（与原生页一致） */\nvar AUDIT_FIELDS = { create_by:1, create_time:1, update_by:1, update_time:1 };\nvar SYSTEM_FLAG_FIELDS = { is_system:1 };\nvar DERIVED_HIERARCHY = { full_path:1, level_no:1, is_leaf:1 };\nvar META_MODE_TO_SPEC = { input:'cmx-text-input', text:'cmx-text-input', textarea:'cmx-textarea-input', number:'cmx-number-input', date:'cmx-date-input', datetime:'cmx-datetime-input' };\nvar SPEC_MODES = { 'cmx-text-input':1,'cmx-textarea-input':1,'cmx-richtext-input':1,'cmx-number-input':1,'cmx-date-input':1,'cmx-datetime-input':1,'checkbox':1,'select':1,'ref':1,'combo':1,'ignite-combo':1,'cmx-dict-selct':1,'image':1,'video':1,'readonly':1,'none':1 };\nvar SPEC_DISPLAY_MODES = { '':1,'text':1,'number':1,'badge':1,'link':1,'icon':1 };\n\nfunction isPkGenerated (meta) {\n  var pkCol = (meta.columns || []).filter(function(c){return c.name===meta.pk;})[0];\n  if (!pkCol) return false;\n  return String(pkCol.dataType || '').toUpperCase().indexOf('INT') >= 0;\n}\nfunction showInTable (col) { return !DERIVED_HIERARCHY[col.name]; }\nfunction isEditable (col, meta) {\ g.openModal().then(function(){},function(){});\n}\nfunction cmxConfirm (message, title) {\n  var C = cmx();\n  if (C && typeof C.cmxConfirm === 'function') { try { return C.cmxConfirm(message, title||'请确认'); } catch(_){} }\n  return new Promise(function(resolve){\n    var dlg = document.createElement('cmx-floating-dialog');\n    if (typeof dlg.configure !== 'function') { resolve(false); return; }\n    dlg.configure({ title:title||'请确认', icon:'message-information', confirmText:'确定', cancelText:'取消', dialogWidth:'420px', dialogHeight:'auto' });\n    var body = document.createElement('div');\n    body.style.cssText = 'padding:16px;font-size:13px;color:var(--sapTextColor,#1d2d3e);line-height:1.6;white-space:pre-wrap';\n    body.textContent = String(message==null?'':message);\n    dlg.setContent(body);\n    document.body.appendChild(dlg);\n    dlg.openModal().then(function(r){ resolve(r && r.action==='confirm'); }).catch(function(){ resolve(false); });\n  });\n}\n\n/* 暴露给 pageFn 包装器与事件处理 */\nhost._fn = {\n  cmx: cmx, readDef: readDef, qs: qs, apiGet: apiGet, apiPost: apiPost,\n  escHtml: escHtml, escAttr: escAttr, cmxNotify: cmxNotify, cmxConfirm: cmxConfirm,\n  isPkGenerated: isPkGenerated, showInTable: showInTable, isEditable: isEditable,\n  colCaption: colCaption, defaultWidthFor: defaultWidthFor, editModeFor: editModeFor, displayFor: displayFor\n};\n\n/* ===== 实例状态（每次激活重置） ===== */\nfunction freshState () {\n  return { def:null, dicts:[], meta:null, dictCode:'', page:1, pageSize:50, q:'',\n    treeNodes:{}, currentParentId:null, selectedTreeNodeId:null, rows:[], total:0, grid:null,\n    _lastDictCode:null, dirtyMap:{}, newIds:{}, deletedIds:[], baselineMap:{} };\n}\nhost.__ = freshState();\n\nvar $ = function (s) { return host.shadowRoot.querySelector(s); };\nfunction setText (id, v) { var e = $('#' + id); if (e) e.textContent = (v==null?'':String(v)); }\nfunction setMsg (text, kind) {\n  var el = $('#deMsg'); if (!el) return;\n  el.textContent = text || '';\n  el.cl
