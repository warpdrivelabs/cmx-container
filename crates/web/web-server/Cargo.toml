[package]
name = "web-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# 内部依赖 - 工具库
cmx-utils = { workspace = true }
# 内部依赖 - 数据库
cmx-database = { workspace = true }
# 内部依赖 - 数据库(tokio-postgres 零拷贝新链路,并行注册数据源用)
cmx-database-pg = { workspace = true }
# 内部依赖 - API
cmx-api = { workspace = true }
# 内部依赖 - 报表模块 HTTP 层（ReportModule 路由，在此合并进主路由，避免 cmx-api⇄cmx-rpt 环）
cmx-rpt-api = { workspace = true }
# 内部依赖 - 流程引擎 HTTP 层（FlowModule 路由 + 引擎单例 + 定时器 poller，同破环设计）
cmx-flow-api = { workspace = true }
# 内部依赖 - 业务单据（DOC）HTTP 层（DocModule 路由，在此合并进主路由，避免 cmx-api⇄cmx-doc 环）
cmx-doc-api = { workspace = true }
# 内部依赖 - 数据字典（DCT）HTTP 层（DctModule 路由，同破环设计）
cmx-dct-api = { workspace = true }
# 内部依赖 - 编码引擎 HTTP 层（CodeModule 路由，同破环设计）
cmx-code-api = { workspace = true }
# 内部依赖 - 异步任务中心内核（init_job_subsystem 启动 + JobManager 单例）
cmx-job-core = { workspace = true }
# 内部依赖 - 异步任务中心 PG 持久化（PgJobStore：cmx_job_* 落库 + 崩溃恢复）
cmx-job-store-pg = { workspace = true }
# 内部依赖 - 异步任务中心 HTTP 层（JobModule 路由 + SSE，在此合并进主路由，避免 cmx-api⇄cmx-job 环）
cmx-job-api = { workspace = true }
# 内部依赖 - 模型中心 HTTP 层（ModelModule 路由，在此合并进主路由，避免 cmx-api⇄cmx-model 环）
cmx-model-api = { workspace = true }
# 内部依赖 - 审计日志
cmx-audit = { workspace = true }
# 内部依赖 - 认证模块
cmx-auth = { workspace = true }
# 内部依赖 - IAM 权限角色管理
cmx-iam = { workspace = true }
# 内部依赖 - 业务模型
cmx-biz = { workspace = true }
# 内部依赖 - 缓存
cmx-buffer = { workspace = true }
# 内部依赖 - 插件
cmx-plugin = { workspace = true }
# 内部依赖 - AI 生成中继层（启动期初始化 AI 子系统）
cmx-ai = { workspace = true }
# 内部依赖 - 运行时
cmx-runtime = { workspace = true }
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 内部依赖 - 核心库
cmx-core = { workspace = true }
# 内部依赖 - 服务
cmx-service = { workspace = true }
# 内部依赖 - 调试
cmx-debug = { workspace = true }
# 内部依赖 - Nacos
# cmx-nacos = { workspace = true }
# 内部依赖 - 注册中心与配置中心
cmx-registry-config = { workspace = true }
# 内部依赖 - RPC 框架
cmx-rpc = { workspace = true }
# 内部依赖 - 存储
cmx-storage = { workspace = true }
# 获取本机IP地址
local-ip-address = { workspace = true }
# Web 框架 - HTTP 服务器
axum = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# Web 框架 - HTTP 中间件
tower-http = { workspace = true }
# Web 框架 - Cookie 支持
tower-cookies = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# 日志订阅器 自动处理日志桥接
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt","tracing-log"] }
# 日志追加器
tracing-appender = { workspace = true }
# 派生宏
derive_more = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# modql 支持
modql = { workspace = true }
# [dependencies]
# 唯一标识符 - 未使用
# uuid = { workspace = true }
# .env 文件加载
dotenvy = { workspace = true }
# 日期时间处理
chrono = { workspace = true }
# 异步 trait 支持
async-trait = { workspace = true }
