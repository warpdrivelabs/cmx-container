[package]
name = "web-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# 内部依赖 - 工具库
cmx-utils = { workspace = true }
# 内部依赖 - 数据库
cmx-database = { workspace = true }
# 内部依赖 - API
cmx-api = { workspace = true }
# 内部依赖 - 缓存
cmx-buffer = { workspace = true }
# 内部依赖 - 插件
cmx-plugin = { workspace = true }
# 内部依赖 - 运行时
cmx-runtime = { workspace = true }
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 内部依赖 - 核心库
cmx-core = { workspace = true }
# 内部依赖 - 服务
cmx-service = { workspace = true }
# 内部依赖 - 调试
cmx-debug = { workspace = true }
# 内部依赖 - Nacos
cmx-nacos = { workspace = true }
# 内部依赖 - 存储
cmx-storage = { workspace = true }
# 获取本机IP地址
local-ip-address = { workspace = true }
# Web 框架 - HTTP 服务器
axum = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# Web 框架 - HTTP 中间件
tower-http = { workspace = true }
# Web 框架 - Cookie 支持
tower-cookies = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# 日志订阅器 自动处理日志桥接
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt","tracing-log"] }
# 日志追加器
tracing-appender = { workspace = true }
# 派生宏
derive_more = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# modql 支持
modql = { workspace = true }
# [dependencies]
# 唯一标识符 - 未使用
# uuid = { workspace = true }
# .env 文件加载
dotenvy = { workspace = true }
# 日期时间处理
chrono = { workspace = true }
