[package]
name = "cmx-plugin"
version.workspace = true
edition.workspace = true

[dependencies]
cmx-core = { workspace = true }
cmx-metadata = { workspace = true }
cmx-buffer = { workspace = true }
cmx-database = { workspace = true }
cmx-utils = { workspace = true }
cmx-traits = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
thiserror = "2"
zip = "8.2.0"
ed25519-dalek = { version = "2.2", features = ["std"] }
base64 = "0.22"

# 异步运行时
tokio = { workspace = true, features = ["fs", "io-util"] }

# HTTP 客户端
reqwest = { workspace = true }

# URL 解析
url = "2"

# 异步 trait
async-trait = "0.1"

# 错误处理
anyhow = "1.0"

# 工具宏
derive_more = { workspace = true }

# 日期时间处理
chrono = { workspace = true, features = ["serde"] }

# UUID 生成
uuid = { workspace = true, features = ["v4"] }

# 正则表达式
regex = { workspace = true }

# URL 编码
urlencoding = "2"

# 日志
log = "0.4"
tracing = { workspace = true }

# SHA256 哈希
sha2 = "0.10"

# SHA1 哈希
sha1 = "0.10"

# TOML 解析
toml = "0.8"

# YAML 解析
serde_yaml = "0.9"

# MD5 哈希
md5 = "0.7"

# 随机数生成
rand = "0.8"

# sea-query: SQL 构建工具
sea-query = { workspace = true }
# sea-query-binder: SQL 参数绑定工具
sea-query-binder = { workspace = true }
modql = { workspace = true, features = ["with-sea-query"] }

# Extism 支持
extism = "1.4"
