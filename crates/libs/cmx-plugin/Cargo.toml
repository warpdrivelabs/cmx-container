[package]
name = "cmx-plugin"
version.workspace = true
edition.workspace = true

[dependencies]
# 内部依赖 - 核心库
cmx-core = { workspace = true }
# 内部依赖 - 元数据
cmx-metadata = { workspace = true }
# 内部依赖 - 缓存
cmx-buffer = { workspace = true }
# 内部依赖 - 数据库
cmx-database = { workspace = true }
# 内部依赖 - 工具库
cmx-utils = { workspace = true }
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 内部依赖 - 服务
cmx-service = { workspace = true }
# 内部依赖 - 存储服务
cmx-storage = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# MessagePack 序列化/反序列化
rmp-serde = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# ZIP 压缩
zip = { workspace = true }
# 目录递归遍历
walkdir = { workspace = true }
# 签名验证
ed25519-dalek = { workspace = true }
# Base64 编码/解码
base64 = { workspace = true }
# URL 解析
url = { workspace = true }
# 异步运行时
tokio = { workspace = true, features = ["fs", "io-util"] }
# 字节处理
bytes = { workspace = true }
# HTTP 客户端
reqwest = { workspace = true }
# 异步 trait
async-trait = { workspace = true }
# 异步并发工具
futures = { workspace = true }
# 错误处理
anyhow = { workspace = true }
# 派生宏
derive_more = { workspace = true }
# 时间处理
chrono = { workspace = true, features = ["serde"] }
# 唯一标识符
uuid = { workspace = true, features = ["v4"] }
# 正则表达式
regex = { workspace = true }
# URL 编码
urlencoding = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# SHA256 哈希
sha2 = { workspace = true }
# SHA1 哈希
sha1 = { workspace = true }
# TOML 解析
toml = { workspace = true }
# YAML 解析
serde_yaml = { workspace = true }
# MD5 哈希
md5 = { workspace = true }
# 随机数生成
rand = { workspace = true }
# sea-query SQL 构建工具
sea-query = { workspace = true }
# sea-query-binder SQL 参数绑定工具
sea-query-binder = { workspace = true }
# modql 支持
modql = { workspace = true, features = ["with-sea-query"] }
