[package]
name = "cmx-dataauth-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 数据权限引擎的**平台反代薄壳**（对标 cmx-meta-proxy / cmx-model-proxy 的纯反代形态）。
#
# 数据权限是独立微服务：中立核 cmx-dataauth-app 在独立 workspace ../cmx-data-auth，由那边的
# cmx-dataauth-server 承载。门户经 `[service_rpc.services].dataauth` 决定：配了 = 反代到独立微服务
# （本壳）；没配 = 门户不挂数据权限路由（本服务无进程内嵌兜底，与 flow/report/rules/meta 同构）。
# 本 crate 只含反代：DataAuthProxyModule 把 `/api/dataauth/*` 透明转发到远程 cmx-dataauth-server；
# console_routes 把顶层 `/console` 管理工作台页反代过去。前端零改。

[dependencies]
# API 共享骨架层（CmxAppState / routes::traits::ModuleRoutes）。单向依赖：本 crate → cmx-api-core。
cmx-api-core = { workspace = true }
# Web 框架（Router 类型）
axum = { workspace = true }
# 反代转发核（头卫生/超时/流式转发/三层出站鉴权，各反代壳共用）
cmx-proxy-core = { workspace = true }
