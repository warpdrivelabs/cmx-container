[package]
name = "cmx-rpt-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 报表模块的**平台适配薄壳**（keep-wired，对标 cmx-flow-api）。抽核后 handler + 路由 + 大盘全在独立
# workspace ../cmx-report 的中立核 cmx-rpt-app（report_routes::<S>()）。本 crate 只剩 ReportModule
# （impl cmx_api_core::ModuleRoutes），在 CmxAppState 上实例化 report_routes，由 web-server 合并
# （cmx-api-core 不反向依赖本 crate，避免环）。端点路径与迁移前完全一致。

[dependencies]
# 内部依赖 - 报表平台中立应用层（全部 handler + report_routes::<S>() + 大盘）。跨 workspace path 进 ../cmx-report。
cmx-rpt-app = { workspace = true }
# 内部依赖 - API 共享骨架层（CmxAppState / routes::traits::ModuleRoutes）。单向依赖：cmx-rpt-api → cmx-api-core。
cmx-api-core = { workspace = true }

# Web 框架（Router 类型）
axum = { workspace = true }
