[package]
name = "cmx-rpt-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 报表模块的**平台反代薄壳**（对标 cmx-rule-api / cmx-flow-api 的纯反代形态）。
#
# 报表引擎是**独立微服务**：中立核 cmx-rpt-app 在独立 workspace ../cmx-report，由那边的
# cmx-rpt-server 承载。门户不再进程内嵌报表，故本 crate **不依赖 cmx-rpt-app**（这条跨 workspace
# path 依赖曾把整个报表引擎源码拖进门户编译图，改前 `cargo run -p cmx-portal-server` 会连带编译
# cmx-report 的 .rs）。本 crate 只含反代：ReportProxyModule 把平台报表 API + 报表拥有的 native/html
# 页取页请求透明转发到远程 cmx-rpt-server（`[center_client.urls].report`）。前端零改。

[dependencies]
# 内部依赖 - API 共享骨架层（CmxAppState / routes::traits::ModuleRoutes）。单向依赖：cmx-rpt-api → cmx-api-core。
cmx-api-core = { workspace = true }

# Web 框架（Router 类型）
axum = { workspace = true }

# ── 反代壳 ReportProxyModule 依赖（对齐 cmx-flow-api）：出站 HTTP + 三层鉴权上下文 + 日志/JSON。 ──
# 出站 HTTP 客户端（反代转发到独立 cmx-rpt-server）。
reqwest = { workspace = true }
# 三层出站鉴权上下文（current_original_token / current_request_id）。
cmx-traits = { workspace = true }
# 502 兜底的 JSON 信封。
serde_json = { workspace = true }
# 转发失败日志。
tracing = { workspace = true }
