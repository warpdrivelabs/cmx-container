syntax = "proto3";

package cmx;

// 插件数据导入 gRPC 服务
// 用于将插件数据（权限/菜单/表单/流程）导入到基础服务中心
// 注意：gRPC 默认消息上限 4MB，大包建议使用 HTTP 模式
service CmxPluginDataService {
  // 导入插件数据（ZIP 包）
  rpc ImportPluginData(ImportPluginDataRequest) returns (ImportPluginDataResponse);
  // 清理插件数据
  rpc CleanupPluginData(CleanupPluginDataRequest) returns (ImportPluginDataResponse);
}

// 插件数据导入请求
message ImportPluginDataRequest {
  string category = 1;           // 数据类别: "perm", "menu", "form", "flow"
  string domain_code = 2;
  string application_code = 3;
  string module_code = 4;
  string plugin_id = 5;
  string app_id = 6;
  string version = 7;
  bytes zip_data = 8;            // ZIP 压缩数据（默认上限 4MB）
}

// 插件数据导入响应
message ImportPluginDataResponse {
  bool success = 1;
  string message = 2;
  uint32 created_count = 3;
  uint32 updated_count = 4;
  uint32 deleted_count = 5;
}

// 插件数据清理请求
message CleanupPluginDataRequest {
  string category = 1;
  string domain_code = 2;
  string application_code = 3;
  string module_code = 4;
  string plugin_id = 5;
  string app_id = 6;
}
