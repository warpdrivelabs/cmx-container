    filename: cmx_service_orchestrator.rs
    protocol: protobuf
    services:
      - idl:
          source: local
          path: idl/cmx_service.proto
          includes:
            - idl
  plugin_data:
    filename: cmx_plugin_data_service.rs
    protocol: protobuf
    services:
      - idl:
          source: local
          path: idl/cmx_plugin_data.proto
          includes:
            - idl
