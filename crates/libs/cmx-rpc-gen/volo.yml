entries:
  orchestrator:
    filename: cmx_service_orchestrator.rs
    protocol: protobuf
    services:
      - idl:
          source: local
          path: idl/orchestrator/cmx_service.proto
          includes:
            - idl
  resource_data:
    filename: cmx_resource_data_service.rs
    protocol: protobuf
    services:
      - idl:
          source: local
          path: idl/resource/cmx_resource_data.proto
          includes:
            - idl
