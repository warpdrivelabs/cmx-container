[package]
name = "cmx-iam"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = []
# OpenAPI 文档生成支持
openapi = ["utoipa"]

[dependencies]
# 内部依赖 - 核心库
cmx-core = { workspace = true }
# 内部依赖 - API 通用类型
cmx-api-types = { workspace = true }
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 内部依赖 - 数据库
cmx-database = { workspace = true }
# 内部依赖 - 审计日志
cmx-audit = { workspace = true }
# 内部依赖 - 认证服务（用于密码哈希）
cmx-auth = { workspace = true }
# 内部依赖 - 工具库
cmx-utils = { workspace = true }
# 内部依赖 - Redis 缓存
cmx-buffer = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 异步 trait
async-trait = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# modql 支持
modql = { workspace = true, features = ["with-sea-query"] }
# SQL 查询构建器
sea-query = { workspace = true }
# SQL 异步查询
sqlx = { workspace = true }
# 唯一标识符
uuid = { workspace = true, features = ["v4"] }
# 时间库
chrono = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# OpenAPI 文档生成（可选）
utoipa = { workspace = true, optional = true }
# ZIP 解压缩（权限导入）
zip = { workspace = true }
# MsgPack 序列化（cmx:iam 宿主函数跨 WASM 边界）
rmp-serde = { workspace = true }
# 异步并发原语（批量权限校验 join_all）
futures = { workspace = true }
