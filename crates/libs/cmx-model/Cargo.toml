[package]
name = "cmx-model"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 模型中心：meta 相关元数据建模服务，从 cmx-portal 拆出。
# 五项元数据（BASE-DCT/BASE-DOC/DCT/DOC/CP）= definitions（定义中心）
# + context_profile（上下文档案规则引擎）+ dict（字典检索引擎，被 context_profile 依赖）。
# 数据为 JSON 文件存储（data/meta/{definitions,context-profile,subdivision}、data/dict/**），不落库。

[dependencies]
# 内部依赖 - 共享基础设施（config / error / fsutil / util，再导出）
cmx-portal-base = { workspace = true }

# 异步运行时（tokio::fs::read_dir / remove_file 等）
tokio = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# 时间处理（版本时间戳 / 有效期）
chrono = { workspace = true, features = ["serde"] }
# 正则（字典/定义 ID 与编码校验）
regex = { workspace = true }
