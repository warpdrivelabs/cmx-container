[package]
name = "cmx-model-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 模型中心 HTTP 层：定义中心 + 弹性组合 + 数据库部署的薄 axum handler + ModuleRoutes 路由聚合。
# 对标 cmx-doc-api / cmx-dct-api 的分层模式，由 web-server .merge(ModelModule.routes()) 合并。

[dependencies]
# 内部依赖 - API 框架（ModuleRoutes trait + ApiResp + CmxAppState + CmxSvrContext）
cmx-api-core = { workspace = true }
# 内部依赖 - 模型中心元数据层（definitions / flexible_combination）
cmx-model-meta = { workspace = true }
# 内部依赖 - 模型中心部署层（db_state / init / deploy）
cmx-model-deploy = { workspace = true }
# 内部依赖 - 核心类型（SVRContext，model_operator 用）
cmx-core = { workspace = true }
# 内部依赖 - API 通用类型（Error 构造）
cmx-api-types = { workspace = true }
# Web 框架
axum = { workspace = true }
# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# 流处理
futures = { workspace = true }
