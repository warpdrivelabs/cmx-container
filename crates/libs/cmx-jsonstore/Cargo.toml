[package]
name = "cmx-jsonstore"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 门户系列 crate（cmx-portal / cmx-form / cmx-model）共享的基础设施层：
# 数据根解析、统一错误（含 → cmx_api_types::Error 映射）、JSON 文件原子读写、通用工具。
# 从 cmx-portal 下沉而来以打破「cmx-portal → cmx-form/cmx-model → 基础设施」的循环依赖。

[features]
# 向下游 crate 的单元测试暴露 util::test_data_root_lock()（串行化改 ASSETS__ROOT 的测试）。
# 仅由下游 crate 的 [dev-dependencies] 启用，正常构建不进入产物。
testing = []

[dependencies]
# 内部依赖 - API 通用类型（PortalError → cmx_api_types::Error 映射；
# 继承根的 default-features=false——不用 ServiceError 桥，避免把 sqlx 链传回引擎树）
cmx-api-types = { workspace = true }
# 内部依赖 - 工具库（ConfigManager 读取 assets.root）
cmx-utils = { workspace = true }

# 异步运行时（tokio::fs 文件读写 + 并发锁）
tokio = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 高性能本地缓存（页面源码 / 索引文件 L1 缓存）
moka = { workspace = true }
# 非加密内容哈希（page `rev` = xxhash64 截断 16 hex，作 ETag 与缓存校验锚点）
xxhash-rust = { workspace = true }
