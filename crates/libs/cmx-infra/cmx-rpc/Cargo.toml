[package]
name = "cmx-rpc"
version.workspace = true
edition.workspace = true

[dependencies]
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 内部依赖 - 核心库（auth_layer 的 AuthContext）
cmx-core = { workspace = true }
# 内部依赖 - 注册中心与配置中心
cmx-registry-config = { workspace = true }
# 内部依赖 - 通用工具库（sync_utils 等）
cmx-utils = { workspace = true }
# gRPC 框架
volo-grpc = { workspace = true }
# RPC 框架
volo = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化（safe_parse_json）
serde_json = { workspace = true }
# 错误处理
anyhow = { workspace = true }
# 错误处理 - 派生宏定义错误类型
thiserror = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# 异步广播通道
async-broadcast = { workspace = true }
# 说明：proto 契约依赖（cmx-rpc-gen）与皮肤专属依赖（pilota/uuid/chrono/async-trait）
# 已随领域皮肤迁至 cmx-rpcs/*（cmx-orchestrator-rpc / cmx-resource-rpc）。
