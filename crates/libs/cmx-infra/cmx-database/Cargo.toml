[package]
name = "cmx-database"
version.workspace = true
edition.workspace = true

[dependencies]
cmx-core = { workspace = true }
cmx-utils = { workspace = true }
cmx-traits = { workspace = true }

# ============================================
# Workspace 依赖
# ============================================
# serde: 序列化框架
serde = { workspace = true }
# serde_json: JSON 序列化/反序列化
serde_json = { workspace = true }
# sqlx: SQL 异步查询框架
sqlx = { workspace = true, features = ["postgres", "mysql", "sqlite", "runtime-tokio", "chrono", "uuid", "rust_decimal", "json"] }
# sea-query: SQL 查询构建器
sea-query = { workspace = true }
# sea-query-binder: SQL 参数绑定工具
sea-query-binder = { workspace = true }
modql = { workspace = true, features = ["with-sea-query"] }


derive_more = { workspace = true }
serde_with = { workspace = true }
tracing = { workspace = true }
log = "0.4.29"
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1.8.0", features = ["v4"] }
rand = "0.8.5"
futures = "0.3.30"
rust_decimal = "1.40.0"
chrono = "0.4.44"
base64 = "0.22"

# SQL 解析器
sqlparser = "0.49"
# 正则表达式
regex = "1.10"
# URL 解析库
url = { workspace = true }


