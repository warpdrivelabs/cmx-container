[package]
name = "cmx-database"
version.workspace = true
edition.workspace = true

[dependencies]
# 内部依赖 - 缓存
cmx-buffer = { workspace = true }
# 内部依赖 - 核心库
cmx-core = { workspace = true }
# 内部依赖 - 驱动无关行来源抽象 + 零拷贝列式编码器(sqlx 侧 ZmcDataSet)
cmx-rowsource = { workspace = true }
# 内部依赖 - 工具库
cmx-utils = { workspace = true }
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# MessagePack 序列化/反序列化
rmp-serde = { workspace = true }
# SQL 异步查询框架
sqlx = { workspace = true }
# sea-query SQL 查询构建器
sea-query = { workspace = true }
# sea-query-sqlx SQL 参数绑定工具
sea-query-sqlx = { workspace = true }
# modql 支持
modql = { workspace = true, features = ["with-sea-query"] }
# 派生宏
derive_more = { workspace = true }
# serde 辅助宏
serde_with = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# 唯一标识符
uuid = { workspace = true, features = ["v4"] }
# 随机数生成
rand = { workspace = true }
# Futures
futures = { workspace = true }
# 十进制数处理
rust_decimal = { workspace = true }
# 时间处理
chrono = { workspace = true }
# Base64 编码/解码
base64 = { workspace = true }
# SQL 解析器
sqlparser = { workspace = true }
# 正则表达式
regex = { workspace = true }
# URL 解析
url = { workspace = true }
# SHA256 校验和计算
sha2 = { workspace = true }
