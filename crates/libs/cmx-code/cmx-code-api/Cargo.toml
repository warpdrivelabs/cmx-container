[package]
name = "cmx-code-api"
version.workspace = true
edition.workspace = true

[dependencies]
# 内部依赖 - 编码引擎纯逻辑层（段定义/规则算法/Advance trait）
cmx-code-model = { workspace = true }
# 内部依赖 - 核心库（DataValue：SQL 参数强类型绑定）
cmx-core = { workspace = true }
# 内部依赖 - API 类型（ApiResp 统一响应）
cmx-api-types = { workspace = true }
# 内部依赖 - API 框架（ModuleRoutes trait + CmxAppState + CmxSvrContext）
cmx-api = { workspace = true }
# 内部依赖 - 业务错误助手（pg_detail / api_err，与 dct/doc/rpt/mdm 共用）
cmx-biz = { workspace = true }
# 内部依赖 - PG 数据库管理器（反查 max / 规则表 CRUD）
cmx-database-pg = { workspace = true }
# 内部依赖 - 跨模块 trait（CodeMinter trait 定义 + GlobalCodeMinter 注入点）
cmx-traits = { workspace = true }
# 内部依赖 - 主键铸号（规则表 id 生成）
cmx-utils = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# Web 框架（路由 + handler extractor）
axum = { workspace = true }
# 异步 trait
async-trait = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# 正则表达式（validate handler 的 pattern 校验）
regex = { workspace = true }
