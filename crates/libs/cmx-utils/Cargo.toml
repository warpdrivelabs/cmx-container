[package]
name = "cmx-utils"
version.workspace = true
edition.workspace = true

[dependencies]
# serde: 序列化框架
serde = { workspace = true }
# serde_json: JSON 序列化/反序列化
serde_json = { workspace = true }
# base64: Base64 编码/解码
base64 = "0.22"
# thiserror: 错误处理
thiserror = { workspace = true }
# zip: ZIP 压缩/解压
zip = "2.2"
# walkdir: 目录遍历
walkdir = "2.5"
# fs-err: 改进的文件系统操作
fs-err = "2.2"
# rand: 随机数生成
rand = "0.8"

time = { workspace = true }
uuid = { workspace = true ,features = ["v4","fast-rng"]}
#配置管理
config = { workspace = true }
# dotenvy: .env 文件加载
dotenvy = { workspace = true }
tracing = { workspace = true }
cmx-traits = { workspace = true }
# Extism 支持
extism = "1.4"

[dev-dependencies]
# tempfile: 临时文件测试
tempfile = "3"
