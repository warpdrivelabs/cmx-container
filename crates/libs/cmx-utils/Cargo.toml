[package]
name = "cmx-utils"
version.workspace = true
edition.workspace = true

[dependencies]
# serde: 序列化框架
serde = { workspace = true }
# serde_json: JSON 序列化/反序列化
serde_json = { workspace = true }
# base64: Base64 编码/解码
base64 = "0.22"
# thiserror: 错误处理
thiserror = { workspace = true }
# toml: TOML 解析
toml = "0.8"

[dev-dependencies]
# tempfile: 临时文件测试
tempfile = "3"

