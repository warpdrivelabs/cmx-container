[package]
name = "cmx-core"
version.workspace = true
edition.workspace = true

[dependencies]
# ============================================
# Workspace 依赖
# ============================================
# serde: 序列化框架
serde = { workspace = true }
# serde_json: JSON 序列化/反序列化
serde_json = { workspace = true }
# chrono: 日期时间处理
chrono = { workspace = true }
# smol_str: 小字符串优化库
smol_str = { version = "0.3", features = ["serde"] }

# ============================================
# 数值处理
# ============================================
# bigdecimal: 高精度十进制数计算
bigdecimal = "0.4"
# rust_decimal: 轻量级十进制数处理
rust_decimal = "1"

# ============================================
# 错误处理
# ============================================
# thiserror: 派生宏定义错误类型
thiserror = "2"

# ============================================
# HTTP 与网络请求
# ============================================
# reqwest: HTTP 客户端库
reqwest = "0.13.2"

# ============================================
# 异步编程
# ============================================
# futures: 异步组合子和工具
futures = "0.3"
# tokio-stream: Tokio 流处理工具
tokio-stream = "0.1"
# tokio-util: Tokio 实用工具
tokio-util = "0.7"

# ============================================
# 宏与元编程
# ============================================
# proc-macro2: 过程宏支持
proc-macro2 = "1.0"
# quote: Rust AST 引用工具
quote = "1.0"
# syn: Rust 语法树解析
syn = "2.0"

# ============================================
# 工具库
# ============================================
# lazy_static: 延迟静态初始化
lazy_static = "1.5"
# once_cell: 单次初始化单元\ponce_cell = "1.21"

# ============================================
# 枚举增强
# ============================================
# strum: 枚举字符串转换工具
strum = "0.27"
# strum_macros: 枚举派生宏
strum_macros = "0.27"

# ============================================
# 唯一标识符
# ============================================
# uuid: 通用唯一标识符生成
uuid = { version = "1.21", features = ["v4", "serde"] }

# ============================================
# 压缩与归档
# ============================================
# zip: ZIP 文件处理
zip = "8.2.0"

# ============================================
# 加密与安全
# ============================================
# ed25519-dalek: Ed25519 数字签名
ed25519-dalek = { version = "2.2", features = ["std"] }
# base64: Base64 编码/解码
base64 = "0.22"
