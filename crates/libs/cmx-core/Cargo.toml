[package]
name = "cmx-core"
version.workspace = true
edition.workspace = true

[dependencies]
# ============================================
# Workspace 依赖
# ============================================

# serde: 序列化框架
serde = { workspace = true }
# serde_json: JSON 序列化/反序列化
serde_json = { workspace = true }
# chrono: 日期时间处理
chrono = { workspace = true }
# smol_str: 小字符串优化库
smol_str = { version = "0.3", features = ["serde"] }
# ============================================
# 数值处理
# ============================================
# rust_decimal: 轻量级十进制数处理
rust_decimal = "1"

# ============================================
# 错误处理
# ============================================
# thiserror: 派生宏定义错误类型
thiserror = "2"

# ============================================
# 枚举增强
# ============================================
# strum: 枚举字符串转换工具
strum = "0.27"
# strum_macros: 枚举派生宏
strum_macros = "0.27"

# ============================================
# 唯一标识符
# ============================================
# uuid: 通用唯一标识符生成
# 注意：wasm 目标需要启用 js feature
uuid = { version = "1.21", features = ["v4", "serde", "js"] }

# ============================================
# 编码
# ============================================
# base64: Base64 编码/解码（DataValue 序列化需要）
base64 = "0.22"

# ============================================
# 序列化框架
# ============================================
# rkyv: 零拷贝序列化（高性能）
#rkyv = { workspace = true }

modql = { workspace = true }

# Extism PDK 支持（可选）
extism-pdk = { version = "1.4.1", optional = true }

[features]
extism = ["extism-pdk"]

[dev-dependencies]
cmx-plugin-sdk = { path = "../cmx-plugin-sdk" }
