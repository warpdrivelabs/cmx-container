[package]
name = "cmx-portal"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 承接 CMXPortalManager / CMXHTMLDesigner 两个 Node.js 后端迁移而来的门户/设计器业务：
# 菜单、活动、域、页面(html/form/native)、字典检索引擎、上下文档案规则引擎、定义中心、
# 事实数据、工作区节点、DAM 注册表、AI 代理等。全部为 JSON 文件存储（tokio::fs），不落库。

[dependencies]
# 内部依赖 - 核心类型
cmx-core = { workspace = true }
# 内部依赖 - API 通用类型（ApiResp / Error / Result）
cmx-api-types = { workspace = true }
# 内部依赖 - 工具库（雪花 ID、文件、hash、config）
cmx-utils = { workspace = true }

# 异步运行时（tokio::fs 文件读写 + 并发锁）
tokio = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# 时间处理（版本时间戳 yyyyMMdd_HHmmssSSS）
chrono = { workspace = true, features = ["serde"] }
# 错误处理
thiserror = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# 异步 trait
async-trait = { workspace = true }
# 目录遍历（扫描 data 子目录）
walkdir = { workspace = true }
# 正则（ID 校验等）
regex = { workspace = true }
# HTTP 客户端（ai/chat 中继 DeepSeek）
reqwest = { workspace = true }
# 改进的文件系统错误
fs-err = { workspace = true }

[dev-dependencies]
# 单元测试异步运行时
tokio = { workspace = true }
