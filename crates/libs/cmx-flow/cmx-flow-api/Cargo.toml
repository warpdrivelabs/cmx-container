[package]
name = "cmx-flow-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# cmx-flow 流程引擎的**平台适配薄壳**（抽核后仅剩装配）。
#
# 业务已全部下沉到平台中立核 cmx-flow-app（引擎单例 + handler + 路由 + 信封）。本 crate 只做
# 两件平台专属的事：①把 core 的 flow_routes::<CmxAppState>() 包成 FlowModule(impl
# cmx_api::ModuleRoutes)，供 web-server 合并；②re-export spawn_timer_poller 供 main 启动。
# 故 cmx-flow-api → cmx-flow-app + cmx-api（装配）；不再直依赖引擎各层/cmx-biz/cmx-core/DB。
# 独立部署形态见 ../../cmx-flowengine 的 cmx-flow-server（同核，另一壳）。

[dependencies]
# 平台中立核（引擎单例 + 全部 handler + flow_routes + 信封）——跨 workspace path 进 cmx-flowengine
cmx-flow-app = { workspace = true }
# API 框架（CmxAppState / routes::traits::ModuleRoutes）。单向依赖 cmx-flow-api → cmx-api。
cmx-api-core = { workspace = true }

# Web 框架（Router 类型；路由体由 core 提供）
axum = { workspace = true }

# —— S6 反代壳（FlowProxyModule：平台→远程 flow-server 转发 + 三层出站鉴权）——
# 平台服务凭证/委托用户令牌/请求 ID（context_scope 出站透传）
cmx-traits = { workspace = true }
# 出站 HTTP（转发到远程 flow-server；流式请求/响应体，SSE 透传）
reqwest = { workspace = true }
# 错误信封 JSON（502 等）
serde_json = { workspace = true }
# 日志
tracing = { workspace = true }
