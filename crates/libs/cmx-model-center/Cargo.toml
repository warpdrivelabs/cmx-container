[package]
name = "cmx-model-center"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 模型中心 · 数据库初始化与模块部署（真实落库）。原 cmx-api::handlers::portal::model_center，
# 按 v6 评估建议抽出为独立 crate（对标 cmx-rpt/cmx-flow/cmx-dct/cmx-doc 的能力下沉），
# 让 cmx-api 回归纯适配层「无手写 SQL 例外」。
#
# 职责：db_state（读台账组 scenario）/ init_db（建 5 张台账系统表）/ deploy（编译 DCT/DOC
# 定义→PgTableDefineExecutor 建表 + 台账/源留档/历史）+ 三个 SSE 流式变体（init/deploy plan/stream）。
#
# 分层归属：本 crate 是「服务/落库」层，不含 HTTP 提取器。7 个 public fn + InitEvent 由
# cmx-api 的 portal handler 直接调用转发（cmx-api 依赖本 crate，本 crate 不反向依赖 cmx-api，
# 故无环）。错误类型直接用 cmx-api-types::{Result, Error}（cmx-api::Result 本就是它的 re-export）。

[dependencies]
# 内部依赖 - TableDefine/DataValue/ColumnDefine 等建表模型 + FieldType/IndexKind
cmx-core = { workspace = true }
# 内部依赖 - 数据库管理器（get_default_db_manager：query_sql/execute_sql/query_sql_with_datavalues）
cmx-database = { workspace = true }
# 内部依赖 - DDL 执行与差异（PgTableDefineExecutor/DdlDiff/TableChange/information_schema 内省）
cmx-metadata = { workspace = true }
# 内部依赖 - 雪花号（台账行 id 生成）
cmx-utils = { workspace = true }
# 内部依赖 - 错误码与 Result（Error/Result，与 cmx-api 同源，避免反向依赖成环）
cmx-api-types = { workspace = true }
# 内部依赖 - 定义装载/store（definitions::store::list_definitions 列 DCT/DOC/RPT 定义；
# 原代码走 cmx_portal::definitions 再导出，实体在 cmx-model，直接依赖更精简、不成环）
cmx-model = { workspace = true }

# 时间戳（台账 deployed_at/历史 RFC3339）
chrono = { workspace = true }

# JSON 台账/scenario 组装（preserve_order 保列序）
serde = { workspace = true }
serde_json = { workspace = true }
# SSE 流式事件通道（InitEvent 经 tokio mpsc 回传）
tokio = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# SHA256 哈希（种子菜单内容指纹）
sha2 = { workspace = true }
# 内部依赖 - 业务库（种子菜单装载/写入复用 cmx-biz 能力）
cmx-biz = { workspace = true }
# 错误处理（init/deploy 流程中的可选上下文封装）
anyhow = { workspace = true }

[dev-dependencies]
# 临时目录（测试用）
tempfile = { workspace = true }
