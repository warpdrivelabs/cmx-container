[package]
name = "cmx-dct-store-pg"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 数据字典（DCT）模块的 PostgreSQL 持久化/服务层：从定义 JSON 解析 DictView（resolve_dict，
# 含 base 字段集合并 + TableSpec 校验规范缓存）、cf_* 字典物理表的直读（search / 零拷贝
# ZmcDataSet）、回存（upsert merge 语义 + 铸号）、删除、以及基于 changeset 的事务回存
# （dct_save_apply：inserted 铸号/updated 乐观锁/deleted）。接 cmx-database-pg 全局 manager；
# 表由 model_center 建，本层不建表（无 DDL）。SQL 由 cmx-dct-model 构造，本层执行 + 编排。

[dependencies]
# 内部依赖 - DCT 中立模型（DictView/DctQuery + SQL 构造 + 铸号纯逻辑）
cmx-dct-model = { workspace = true }
# 内部依赖 - tokio-postgres 并行 DB 层（DatabaseManager：query/execute/事务 + ZmcDataSet 零拷贝）
cmx-database-pg = { workspace = true }
# 内部依赖 - 核心库（DataValue：zmc 强类型参数绑定）
cmx-core = { workspace = true }
# 内部依赖 - 跨模块 trait 注入（GlobalCodeMinter：编码引擎钩子注入点）
cmx-traits = { workspace = true }
# 内部依赖 - 业务错误 + 落库前列级校验 + 错误码（BizError/validation/errcode，DOC/DCT 共享）
cmx-biz = { workspace = true }
# 内部依赖 - API 通用类型（Error/Result 信封，与 cmx-api 保持同一错误类型；api_err/? 用）
cmx-api-types = { workspace = true }
# 内部依赖 - 模型中心（definitions::store 读定义 JSON + resolve::resolve_dict_file 定位文件）
cmx-model-meta = { workspace = true }
# 内部依赖 - 后端主从协调器（本 crate impl 其 HierService，把 DCT 接为可换后端服务）
cmx-master-slave = { workspace = true }
# 内部依赖 - 零拷贝行源（ZmcDataSet<TokioPgRowSource> 返回类型对齐 HierService::Row）
cmx-rowsource = { workspace = true }
async-trait = { workspace = true }

# JSON（定义解析 + 请求/结果集交换）
serde_json = { workspace = true }
# 序列化框架（ImportSummary / ImportError 派生 Serialize）
serde = { workspace = true }
# 异步运行时（DCT 文件解析缓存 RwLock + 导出 mpsc + 导入批事务）
tokio = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# CSV 解析（同步 Reader，导入场景一次性读入内存 + Cursor 包裹）
csv = { workspace = true }
# Future 工具（StreamExt 用于 export_stream body 转换）
futures = { workspace = true }
# 字节缓冲（mpsc<Bytes> 传输导出分片）
bytes = { workspace = true }

[dev-dependencies]
# 真机集成测试（hier_service_pg：注册数据源 + 经 CmxMasterSlave 装载）
tokio = { workspace = true }
