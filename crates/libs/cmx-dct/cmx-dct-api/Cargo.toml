[package]
name = "cmx-dct-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 数据字典（DCT）模块的 HTTP 层：薄 axum handler（提取参数 → resolve_dict → 调
# cmx-dct-store-pg 服务 → ApiResp/msgpack 信封）+ DctModule(impl cmx_api_core::ModuleRoutes)
# 路由表。依赖 cmx-api-core 拿 CmxAppState/CmxSvrContext/ApiResp/Result；由 web-server 合并
# DctModule.routes()（cmx-api-core 不反向依赖本 crate，避免环）。端点路径与迁移前完全一致
# （/dct/meta、/dct/data/*、/dct/entries、/dct/save）。

[dependencies]
# 内部依赖 - DCT 持久化/服务层（场景入口 dict_meta/dict_search/dict_upsert/... + DctQuery/BatchConflictMode re-export）
cmx-dct-store-pg = { workspace = true }
# 内部依赖 - DCT 中立模型（DctQuery 坐标 DTO；openapi feature 开 IntoParams 供 Swagger 查询参数描述）
cmx-dct-model = { workspace = true, features = ["openapi"] }
# 内部依赖 - API 通用类型（ApiResp<T>：响应信封，OpenApi schema 引用）
cmx-api-types = { workspace = true }
# OpenAPI 文档生成（handler #[utoipa::path] + DctApiDoc）
utoipa = { workspace = true }
# 内部依赖 - API 框架（CmxAppState / middleware::CmxSvrContext / ModuleRoutes / ApiResp/Result/Error）
cmx-api-core = { workspace = true }
# 内部依赖 - 业务错误码（Violation：校验失败结构化响应）
cmx-biz = { workspace = true }

# Web 框架（handler 提取器 + Router + msgpack 裸响应 + multipart 导入）
axum = { workspace = true }
# 请求 DTO 反序列化
serde = { workspace = true }
# JSON 载荷
serde_json = { workspace = true }
# MessagePack 底层编码（zmc 成功信封手写编码 rmp::encode）
rmp = { workspace = true }
# 日志追踪
tracing = { workspace = true }
# Future 工具（StreamExt::map 把 mpsc::Receiver<Bytes> 转 TryStream 给 Body::from_stream）
futures = { workspace = true }
# 字节缓冲（handler 中接收 multipart field 字节 + 构造 tokio::io::Cursor）
bytes = { workspace = true }
# 异步运行时（tokio::io::Cursor 包装 multipart field bytes 传给 import_stream）
tokio = { workspace = true }
