[package]
name = "cmx-wasmdemo"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ============================================
# Extism PDK
# ============================================
extism-pdk = { version = "1.4.1", optional = true }

# ============================================
# CMX 插件 SDK
# ============================================
#cmx-plugin-sdk = { path = "../cmx-plugin-sdk" }
cmx-plugin-sdk = {path = "../cmx-plugin-sdk", version = "0.1.4", registry = "nora" }

# ============================================
# 序列化
# ============================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Mock 测试框架
mockall = "0.11"

[features]
# Extism 特性 — 编译 Wasm 时开启
extism = ["extism-pdk", "cmx-plugin-sdk/extism"]

[profile.release]
lto = true
opt-level = "s"

[profile.dev]
debug = 2
opt-level = 0
lto = false
strip = false




