[package]
name = "cmx-common-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = []
# 开发脚手架工具（项目模板生成：本地 fs 写入/解压 zip/写 settings.json）。
# 违反集群无状态约束（AGENTS.md §五），仅单节点 dev 环境启用；默认关闭，启用时启动告警。
dev-tools = []

[dependencies]
# Web 框架 - HTTP 服务器
axum = { workspace = true }
# Web 框架 - HTTP 中间件
tower-http = { workspace = true }
# Web 框架 - Cookie 支持
tower-cookies = { workspace = true }
# 内部依赖 - API 通用类型
cmx-api-types = { workspace = true }
# 内部依赖 - API 共享骨架层（CmxAppState/ModuleRoutes/rest/middleware/CRUD 宏）
cmx-api-core = { workspace = true }
# 内部依赖 - 业务逻辑层
cmx-biz = { workspace = true, features = ["openapi"] }
# 内部依赖 - 工具库
cmx-utils = { workspace = true }
# 内部依赖 - 核心库
cmx-core = { workspace = true, features = ["openapi"] }
# 内部依赖 - 数据库
cmx-database = { workspace = true }
# 内部依赖 - 数据库(tokio-postgres 零拷贝新链路,二进制单据出口用)
cmx-database-pg = { workspace = true }
# 内部依赖 - 元数据
cmx-metadata = { workspace = true }
# 内部依赖 - 插件
cmx-plugin = { workspace = true }
# 内部依赖 - AI 生成中继层（薄代理转发 OpenCode + SSE 翻译）
cmx-ai = { workspace = true }
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 内部依赖 - 缓存层
cmx-buffer = { workspace = true }
# 内部依赖 - 认证模块
cmx-auth = { workspace = true }
# 内部依赖 - 门户/设计器业务（迁移自 Node 后端）
cmx-portal = { workspace = true }
# 内部依赖 - RPC 通信
cmx-rpc = { workspace = true }
# RPC 皮肤（orchestrator/resource_data 访问器；GlobalRpcClient 守卫仍在 cmx-rpc）
cmx-orchestrator-rpc = { workspace = true }
# 内部依赖 - 服务
cmx-service = { workspace = true }
# 内部依赖 - 调试
cmx-debug = { workspace = true }
# 内部依赖 - 存储
cmx-storage = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# SQL 查询构建器
sea-query = { workspace = true }
# SQL 参数绑定
sea-query-sqlx = { workspace = true }
# modql 支持
modql = { workspace = true, features = ["with-sea-query"] }
# SQL 异步查询
sqlx = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# serde 辅助宏
serde_with = { workspace = true }
# 时间处理
chrono = { workspace = true, features = ["serde"] }
# 时间处理
time = { workspace = true }
# 唯一标识符
uuid = { workspace = true, features = ["v4", "fast-rng"] }
# 日志追踪
tracing = { workspace = true }
# 派生宏
derive_more = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 验证
validator = { workspace = true }
# API 文档生成
utoipa = { workspace = true }
# Swagger UI 支持
utoipa-swagger-ui = { workspace = true }
# MsgPack 编码
rmp-serde = { workspace = true }
# MessagePack 裸写(二进制单据出口的信封封装)
rmp = { workspace = true }
# ZIP 压缩
zip = { workspace = true }
# URL 编码
percent-encoding = { workspace = true }
# 字节处理
bytes = { workspace = true }
# 正则表达式（白名单通配符匹配）
regex = { workspace = true }
# 异步流（agent SSE 流式响应）
futures = { workspace = true }

[dev-dependencies]
# HTTP 客户端
reqwest = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# JSON 序列化
serde_json = { workspace = true }
# 唯一标识生成
uuid = { workspace = true, features = ["v4"] }
