[package]
name = "cmx-api-types"
version.workspace = true
edition.workspace = true
authors.workspace = true


[dependencies]
# 序列化框架
serde = { workspace = true }
# JSON 处理
serde_json = { workspace = true }
# OpenAPI 文档生成
utoipa = { workspace = true, features = ["uuid", "chrono"] }
# HTTP 框架
axum = { workspace = true }
# 参数校验
validator = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 日志
tracing = { workspace = true }
# modql 依赖
modql = { workspace = true }
# 内部依赖 - 核心类型
cmx-core = { workspace = true }
# 内部依赖 - 数据库错误转换（optional：db-error feature 门控；引擎树 default-features=false 不拉 sqlx 链）
cmx-database = { workspace = true, optional = true }

[features]
# From<cmx_database::crud::ServiceError> 错误转换桥（默认开，平台侧零感知；
# 引擎（cmx-form / cmx-jsonstore / cmx-engine-kit）以 default-features = false 消费时不拉 sqlx 链）
default = ["db-error"]
db-error = ["dep:cmx-database"]

[lib]
path = "src/lib.rs"
