[package]
name = "cmx-form"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 表单中心：html_pages 相关页面资源服务（form / html / native），从 cmx-portal 拆出。
# 数据为 JSON 文件存储（data/{form,html,native}-pages/**），不落库。

[dependencies]
# 内部依赖 - 共享基础设施（config / error / fsutil / cache / util，再导出）
cmx-jsonstore = { workspace = true }

# 异步运行时（tokio::fs 文件读写 + tokio::spawn 异步回填 rev）
tokio = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# 时间处理（form 版本时间戳 chrono::Local::now）
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
# 测试时启用 cmx-jsonstore 的 testing feature（暴露 test_data_root_lock 串行化数据根测试）
cmx-jsonstore = { workspace = true, features = ["testing"] }
# 临时目录（集成测试 mock 数据根）
tempfile = { workspace = true }
