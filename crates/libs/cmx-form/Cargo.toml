[package]
name = "cmx-form"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 表单中心：html_pages 相关页面资源服务（form / html / native），从 cmx-portal 拆出。
# 数据为 JSON 文件存储（data/{form,html,native}-pages/**），不落库。

[dependencies]
# 内部依赖 - 共享基础设施（config / error / fsutil / util，再导出）
cmx-portal-base = { workspace = true }

# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# 时间处理（form 版本时间戳 chrono::Local::now）
chrono = { workspace = true, features = ["serde"] }
