[package]
name = "cmx-debug"
version = "0.1.2"
edition = "2021"
description = "Debug session management and WASM plugin invocation for cmx"

[dependencies]
lazy_static = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tracing = "0.1"
extism = "1.4.0"
anyhow = "1"
walkdir = "2"
reqwest = { version = "0.11", features = ["json", "blocking"], default-features = false }
utoipa = "5"
