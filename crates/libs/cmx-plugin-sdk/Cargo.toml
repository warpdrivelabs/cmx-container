[package]
name = "cmx-plugin-sdk"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ============================================
# Extism PDK
# ============================================
extism-pdk = "1.4.1"

# ============================================
# CMX 内部依赖
# ============================================
cmx-core = { path = "../cmx-core" }

# ============================================
# 序列化
# ============================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ============================================
# 错误处理
# ============================================
thiserror = "2"
