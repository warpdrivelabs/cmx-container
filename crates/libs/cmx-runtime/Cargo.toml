[package]
name = "cmx-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
# ============================================
# Extism 运行时
# ============================================
extism = "1.21.0"

# ============================================
# CMX 内部依赖
# ============================================
cmx-core = { path = "../cmx-core" }
cmx-traits = { path = "../cmx-traits" }

# ============================================
# 异步运行时
# ============================================
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# ============================================
# 日志和错误处理
# ============================================
tracing = "0.1"
thiserror = "2"

# ============================================
# 序列化
# ============================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio-test = "0.4"
