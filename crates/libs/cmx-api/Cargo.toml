[package]
name = "cmx-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Web 框架 - HTTP 服务器
axum = { workspace = true }
# Web 框架 - HTTP 中间件
tower-http = { workspace = true }
# Web 框架 - Cookie 支持
tower-cookies = { workspace = true }
# 内部依赖 - API 通用类型
cmx-api-types = { workspace = true }
# 内部依赖 - 业务逻辑层
cmx-biz = { workspace = true, features = ["openapi"] }
# 内部依赖 - 工具库
cmx-utils = { workspace = true }
# 内部依赖 - 核心库
cmx-core = { workspace = true }
# 内部依赖 - 数据库
cmx-database = { workspace = true }
# 内部依赖 - 元数据
cmx-metadata = { workspace = true }
# 内部依赖 - 插件
cmx-plugin = { workspace = true }
# 内部依赖 - 特征定义
cmx-traits = { workspace = true }
# 内部依赖 - 缓存层
cmx-buffer = { workspace = true }
# 内部依赖 - 认证模块
cmx-auth = { workspace = true }
# 内部依赖 - RPC 通信
cmx-rpc = { workspace = true }
# 内部依赖 - 服务
cmx-service = { workspace = true }
# 内部依赖 - 调试
cmx-debug = { workspace = true }
# 内部依赖 - 存储
cmx-storage = { workspace = true }
# 异步运行时
tokio = { workspace = true }
# SQL 查询构建器
sea-query = { workspace = true }
# SQL 参数绑定
sea-query-sqlx = { workspace = true }
# modql 支持
modql = { workspace = true, features = ["with-sea-query"] }
# SQL 异步查询
sqlx = { workspace = true }
# 序列化框架
serde = { workspace = true }
# JSON 序列化/反序列化
serde_json = { workspace = true }
# serde 辅助宏
serde_with = { workspace = true }
# 时间处理
chrono = { workspace = true, features = ["serde"] }
# 时间处理
time = { workspace = true }
# 唯一标识符
uuid = { workspace = true, features = ["v4", "fast-rng"] }
# 日志追踪
tracing = { workspace = true }
# 派生宏
derive_more = { workspace = true }
# 错误处理
thiserror = { workspace = true }
# 验证
validator = { workspace = true }
# API 文档生成
utoipa = { workspace = true }
# Swagger UI 支持
utoipa-swagger-ui = { workspace = true }
# MsgPack 编码
rmp-serde = { workspace = true }
# ZIP 压缩
zip = { workspace = true }
# URL 编码
percent-encoding = { workspace = true }
# 字节处理
bytes = { workspace = true }
# 正则表达式（白名单通配符匹配）
regex = { workspace = true }
