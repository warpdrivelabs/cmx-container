[package]
name = "cmx-doc-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 业务单据（DOC）模块的 HTTP 层：薄 axum handler（提取 → 解析 DocMetaView(带缓存) → 调
# cmx-doc-store-pg 装载/回存 → ApiResp/msgpack 信封）+ DocModule(impl cmx_api::ModuleRoutes)
# 路由表。依赖 cmx-api 拿 CmxAppState/CmxSvrContext/ApiResp/Result；由 web-server 合并
# DocModule.routes()（cmx-api 不反向依赖本 crate，避免环）。端点路径与迁移前完全一致
# （/doc/meta、/doc/data/*、/doc/save、/doc/revisions 等）。

[dependencies]
# 内部依赖 - DOC 中立模型（Filter/ColumnView/Scope 等 handler 直接引用的类型）
cmx-doc-model = { workspace = true }
# 内部依赖 - DOC 持久化/服务层（DocLoader/DocSaver/Zmc*/DocRevision/cache）
cmx-doc-store-pg = { workspace = true }
# 内部依赖 - API 框架（CmxAppState / middleware::CmxSvrContext / ModuleRoutes / ApiResp/Result/Error）
cmx-api = { workspace = true }
# 内部依赖 - 模型中心（definitions::store：读单据定义 JSON + base 字段集）
cmx-model-meta = { workspace = true }
# 内部依赖 - 业务错误（BizError → cmx_api_types::Error 桥接，供 ? 传播）
cmx-biz = { workspace = true }
# 内部依赖 - 核心库（ColumnarCodec：列式编码）
cmx-core = { workspace = true }
# 内部依赖 - 数据库门面（get_default_db_manager / get_default_pg_db_manager）
cmx-database = { workspace = true }
cmx-database-pg = { workspace = true }

# Web 框架（handler 提取器 + Router + msgpack 裸响应）
axum = { workspace = true }
# 请求 DTO 反序列化
serde = { workspace = true }
# JSON 载荷
serde_json = { workspace = true }
# 异步运行时（/doc/data/tokio-zmc-stream 流式端点：mpsc channel + spawn）
tokio = { workspace = true }
# 字节缓冲（流式 chunk 传输 bytes::Bytes）
bytes = { workspace = true }
# 异步流（ReceiverStream → axum Body）
futures = { workspace = true }
# MessagePack 底层编码（doc/meta msgpack 信封手写编码 rmp::encode）
rmp = { workspace = true }
# 日志追踪
tracing = { workspace = true }
