[package]
name = "cmx-mdm-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 主数据（MDM）模块的 HTTP 层：薄 axum handler + MdmModule(impl cmx_api::ModuleRoutes) 路由表。
# 依赖 cmx-api 拿 CmxAppState/CmxSvrContext/ApiResp/Result；由 web-server 合并 MdmModule.routes()
# （cmx-api 不反向依赖本 crate，避免环）。
# **API 约定**（承接 AGENTS.md §四 第 5 条）：新增接口禁用 Path Variable，id/参数走 query 或 body。
# M0 仅一个健康检查端点；M1+ 追加 /activations /change-requests/* 等治理端点（均不带 {id} 路径段）。

[dependencies]
# 内部依赖 - MDM 中立模型（DTO + ActivationConfig + CodeGenerator）
cmx-mdm-model = { workspace = true }
# 内部依赖 - MDM 持久化/服务层（激活器主流程 + 映射配置 CRUD + 错误助手）
cmx-mdm-store-pg = { workspace = true }
# 内部依赖 - API 框架（CmxAppState / middleware::CmxSvrContext / ModuleRoutes / ApiResp/Result/Error）
cmx-api-core = { workspace = true }
# 内部依赖 - 业务错误码（Violation：校验失败结构化响应）
cmx-biz = { workspace = true }
# 内部依赖 - tokio-postgres 并行 DB 层（get_default_pg_db_manager 全局单例）
cmx-database-pg = { workspace = true }
# 内部依赖 - DCT 字典解析（dict_meta 取表名/列清单，替代 merge handler 硬编码）
cmx-dct-store-pg = { workspace = true }
# 内部依赖 - API 通用类型（ApiResp<T>：响应信封，OpenApi schema 引用）
cmx-api-types = { workspace = true }
# OpenAPI 文档生成（handler #[utoipa::path] + Query 结构 IntoParams + MdmApiDoc）
utoipa = { workspace = true }
# M7 流程对接：HTTP 客户端（回环调本进程 /api/flow/*，双部署模式透明）
reqwest = { workspace = true }
# M7 流程对接：读 [mdm.flow] 配置段 + [service_auth].outgoing_api_key
cmx-utils = { workspace = true }
# M7 流程对接：current_original_token（回环转发用户 JWT 作委托令牌）
cmx-traits = { workspace = true }
# M7 流程对接：webhook 回调 HMAC-SHA256 验签
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Web 框架（handler 提取器 + Router）
axum = { workspace = true }
# 请求 DTO 反序列化
serde = { workspace = true }
# JSON 载荷
serde_json = { workspace = true }
# 日志追踪
tracing = { workspace = true }
