[package]
name = "cmx-mdm-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 主数据（MDM）模块的**平台反代薄壳**（对标 cmx-rpt-api / cmx-flow-api / cmx-rule-api 的纯反代形态）。
#
# 主数据治理是**独立微服务**：中立核 cmx-mdm-app 在独立 workspace ../cmx-mdm，由那边的
# cmx-mdm-server 承载。门户不再进程内嵌主数据治理，故本 crate **不依赖 cmx-mdm-app**（这条跨
# workspace path 依赖会把整个主数据引擎源码拖进门户编译图）。本 crate 只含反代：MdmProxyModule
# 把平台 `/api/mdm/*` + 主数据拥有的 native 页取页请求透明转发到远程 cmx-mdm-server
#（`[center_client.services].mdm` per-key 定位：url 静态基址或 discovery Nacos 选例，经
# UpstreamResolver 按请求动态解析）。前端零改。

[dependencies]
# 内部依赖 - API 框架（CmxAppState / routes::traits::ModuleRoutes）。单向依赖：cmx-mdm-api → cmx-api-core。
cmx-api-core = { workspace = true }

# Web 框架（Router 类型）
axum = { workspace = true }

# 反代转发核（头卫生/超时拆分/流式转发/三层出站鉴权，反代壳共用）
cmx-proxy-core = { workspace = true }
