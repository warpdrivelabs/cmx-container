# Cargo Workspace 配置文件
[workspace]
# Workspace 成员列表,包含本项目的所有 crate
members = [
    "crates/libs/cmx-core",
    "crates/libs/cmx-utils",
    "crates/libs/cmx-metadata",
    "crates/libs/cmx-plugin",
    "crates/libs/cmx-traits",
    "crates/libs/cmx-runtime",
    "crates/libs/cmx-service",
    "crates/libs/cmx-infra/cmx-database",
    "crates/libs/cmx-infra/cmx-database-pg",
    "crates/libs/cmx-infra/cmx-rowsource",
    "crates/libs/cmx-infra/cmx-buffer",
    "crates/libs/cmx-infra/cmx-http",
#    "crates/libs/cmx-infra/cmx-nacos",
    "crates/libs/cmx-infra/cmx-registry-config",
    "crates/libs/cmx-infra/cmx-service-rpc",
    "crates/libs/cmx-infra/cmx-storage",
    "crates/libs/cmx-infra/cmx-audit",
    "crates/libs/cmx-infra/cmx-auth",
    # 反向代理转发核（三反代壳 flow/rpt/rule 共用：头卫生/超时/流式转发/三层出站鉴权）。
    "crates/libs/cmx-proxy-core",
    "crates/libs/cmx-web-chassis",
    "crates/libs/cmx-web-monitor",
    "crates/libs/cmx-service-base",
    "crates/libs/cmx-platform-app",
    "crates/libs/cmx-apis/cmx-common-api",
    "crates/libs/cmx-apis/cmx-api-core",
    "crates/libs/cmx-apis/cmx-api-types",
    # —— 域 HTTP 层薄 crate（cmx-biz-api/cmx-iam-api/... 逐步补齐）——
    "crates/libs/cmx-apis/cmx-storage-api",
    "crates/libs/cmx-apis/cmx-ai-api",
    "crates/libs/cmx-apis/cmx-biz-api",
    "crates/libs/cmx-apis/cmx-plugin-api",
    "crates/libs/cmx-apis/cmx-iam-api",
    "crates/libs/cmx-biz",
    "crates/libs/cmx-iam",
    "crates/libs/cmx-macros",
    "crates/libs/cmx-plugin-sdk",
    "crates/libs/cmx-plugin-trigger",
    "crates/libs/cmx-plugin-trigger-store-pg",
    "crates/libs/cmx-build",
    "crates/libs/cmx-build-store-pg",
    "crates/libs/cmx-dev-workspace",
    "crates/libs/cmx-dap",
#    "crates/libs/cmx-wasmdemo",
    "crates/libs/cmx-plugin-demo",
    "crates/libs/cmx-debug",
    "crates/libs/cmx-jsonstore",
    "crates/libs/cmx-form",
    "crates/libs/cmx-engine-kit",
    "crates/libs/cmx-model/cmx-model-proxy",
    # —— 数据运行态下沉 crate（第二批阶段三，自 ../cmx-model 迁回，真源随之移至本仓）——
    # cmx-model-meta：定义 JSON 读取层（definitions store + resolve_dict_file），mdm 激活落库
    # 与门户 cmx-portal 的公共依赖；cmx-master-slave：主从协调协议层（DCT/DOC 的 HierService
    # 契约，近叶子，被 dct/doc 两存储层 impl 适配）。
    "crates/libs/cmx-model/cmx-model-meta",
    "crates/libs/cmx-model/cmx-master-slave",
    # —— DCT 域组（字典数据运行态：模型 + PG 存储层）——
    "crates/libs/cmx-dct/cmx-dct-model",
    "crates/libs/cmx-dct/cmx-dct-store-pg",
    # —— 编码域组（铸号引擎：规则模型 + 无状态 API，按 db_id 查 cmx_code_* 三表）——
    "crates/libs/cmx-code/cmx-code-model",
    "crates/libs/cmx-code/cmx-code-api",
    # —— DOC 域组（单据数据运行态：定义模型 + PG 存储层，sqlx/tokio-pg 双驱动 + 主从上卷）——
    "crates/libs/cmx-doc/cmx-doc-model",
    "crates/libs/cmx-doc/cmx-doc-store-pg",
    "crates/libs/cmx-meta/cmx-meta-proxy",
    "crates/libs/cmx-dataauth/cmx-dataauth-proxy",
    "crates/libs/cmx-rpc-gen",
    # —— RPC 皮肤薄 crate（gRPC 服务归域，集中 cmx-rpcs/，对称 cmx-apis/）——
    "crates/libs/cmx-rpcs/cmx-orchestrator-rpc",
    "crates/libs/cmx-rpcs/cmx-resource-rpc",
    "crates/libs/cmx-ai",
    # 流程引擎核心 crate（model/bpmn/engine/store-pg/def/demo）+ cmx-flow-tests 已迁至
    # 独立 workspace ../cmx-flowengine/（S0：独立流程微服务）。此处仅保留平台适配层
    # cmx-flow-api，它经 [workspace.dependencies] 跨 workspace 路径引用迁走的引擎 crate。
    "crates/libs/cmx-flow/cmx-flow-api",
    "crates/libs/cmx-flow/cmx-flow-sdk",
    # 报表模块中立 crate（model/formula/store-pg）+ 中立核 cmx-rpt-app 已迁至独立 workspace
    # ../cmx-report/（对标 flow S0：独立报表平台微服务）。此处仅保留平台**反代**层 cmx-rpt-api
    # （proxy-only，不再依赖 cmx-rpt-app；门户编译期不碰报表引擎源码）。
    "crates/libs/cmx-rpt/cmx-rpt-api",
    # 决策规则引擎（独立 workspace ../cmx-rulesengine/）的平台反代薄壳（proxy-only，无内嵌）。
    "crates/libs/cmx-rule/cmx-rule-api",
    # 本体平台（独立 workspace ../cmx-ontology/）的平台反代薄壳（proxy-only，无内嵌；与 rules 同构）。
    "crates/libs/cmx-onto/cmx-onto-api",
    "crates/libs/cmx-job/cmx-job-core",
    "crates/libs/cmx-job/cmx-job-store-pg",
    "crates/libs/cmx-job/cmx-job-api",
    "crates/libs/cmx-mdm/cmx-mdm-proxy",
    "crates/libs/cmx-mdm/cmx-mdm-sdk",
    "crates/libs/modql/modql-macros",
    "crates/libs/modql",
    "sdk/cmx-cli",
    "crates/tests/cmx-database-test",
    # cmx-flow-tests 已随引擎迁至 ../cmx-flowengine/crates/cmx-flow-tests。
#    "crates/tests/cmx-serde-test",
]
# 依赖版本解析器,"2" 表示使用新版解析器(支持 Edition 2021+)
resolver = "2"

# Workspace 包级别的元数据配置
[workspace.package]
# 项目版本号
version = "0.1.12"
# Rust Edition 版本，决定可用的语法特性
edition = "2024"
# 项目作者列表
authors = ["skylake@pansoft.com"]

# Workspace 依赖统一管理，所有成员 crate 可共享这些依赖
[workspace.dependencies]
# 内部依赖 - 核心库
cmx-core = { path = "crates/libs/cmx-core", version = "0.1.12", registry = "nora" }
# 内部依赖 - 工具库
cmx-utils = { path = "crates/libs/cmx-utils", version = "0.1.12", registry = "nora" }
# 内部依赖 - 通用 API（剩余 handler：debug/portal/service + 主 ApiDoc + 装配，原 cmx-api）
cmx-common-api = { path = "crates/libs/cmx-apis/cmx-common-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - API 共享骨架层（CmxAppState/ModuleRoutes/rest/middleware/CRUD 宏，从 cmx-api 抽出）
cmx-api-core = { path = "crates/libs/cmx-apis/cmx-api-core", version = "0.1.12", registry = "nora" }
# 内部依赖 - 反向代理转发核（三反代壳共用：头卫生/超时/流式转发/三层出站鉴权）
cmx-proxy-core = { path = "crates/libs/cmx-proxy-core", version = "0.1.12", registry = "nora" }
# 内部依赖 - 文件存储 HTTP 层（薄 ModuleRoutes，handler 函数在 cmx-storage）
cmx-storage-api = { path = "crates/libs/cmx-apis/cmx-storage-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - AI 中继 HTTP 层（薄 handler 转发 OpenCode + SSE）
cmx-ai-api = { path = "crates/libs/cmx-apis/cmx-ai-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - 业务模型 HTTP 层（domain/application/menu/sys_datasource/form）
cmx-biz-api = { path = "crates/libs/cmx-apis/cmx-biz-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - 插件/市场/表元数据 HTTP 层
cmx-plugin-api = { path = "crates/libs/cmx-apis/cmx-plugin-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - IAM/认证 HTTP 层
cmx-iam-api = { path = "crates/libs/cmx-apis/cmx-iam-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - API 通用类型（default-features=false：db-error 桥（From<sqlx ServiceError>）不默认
# 编译，引擎树经 form/jsonstore/engine-kit 消费时不拉 sqlx 链；需要该桥的 crate 显式开 feature）
cmx-api-types = { path = "crates/libs/cmx-apis/cmx-api-types", version = "0.1.12", registry = "nora", default-features = false }
# 内部依赖 - 业务模型
cmx-biz = { path = "crates/libs/cmx-biz", version = "0.1.12", registry = "nora" }
# 内部依赖 - 数据库
cmx-database = { path = "crates/libs/cmx-infra/cmx-database", version = "0.1.12", registry = "nora" }
# 内部依赖 - 数据库（tokio-postgres 并行实现，PG-only，独立门面）
cmx-database-pg = { path = "crates/libs/cmx-infra/cmx-database-pg", version = "0.1.12", registry = "nora" }
# 内部依赖 - 驱动无关行来源抽象 + 零拷贝列式二进制编码器
cmx-rowsource = { path = "crates/libs/cmx-infra/cmx-rowsource", version = "0.1.12", registry = "nora" }
# 内部依赖 - 缓存
cmx-buffer = { path = "crates/libs/cmx-infra/cmx-buffer", version = "0.1.12", registry = "nora" }
# 内部依赖 - HTTP 出站 host 能力（cmx:http，W4）
cmx-http = { path = "crates/libs/cmx-infra/cmx-http", version = "0.1.12", registry = "nora" }
# 内部依赖 - 元数据
cmx-metadata = { path = "crates/libs/cmx-metadata", version = "0.1.12", registry = "nora" }
# 内部依赖 - 插件
cmx-plugin = { path = "crates/libs/cmx-plugin", version = "0.1.12", registry = "nora" }
# 内部依赖 - 特征定义
cmx-traits = { path = "crates/libs/cmx-traits", version = "0.1.12", registry = "nora" }
# 内部依赖 - 运行时
cmx-runtime = { path = "crates/libs/cmx-runtime", version = "0.1.12", registry = "nora" }
# 内部依赖 - 服务
cmx-service = { path = "crates/libs/cmx-service", version = "0.1.12", registry = "nora" }
# 内部依赖 - 插件SDK
cmx-plugin-sdk = { path = "crates/libs/cmx-plugin-sdk", version = "0.1.12", registry = "nora" }
# 内部依赖 - 触发面泛化（事件/定时/业务钩子 → 插件，W3；零 extism 依赖）
cmx-plugin-trigger = { path = "crates/libs/cmx-plugin-trigger", version = "0.1.12", registry = "nora" }
# 内部依赖 - 触发绑定 PG 存储（W3）
cmx-plugin-trigger-store-pg = { path = "crates/libs/cmx-plugin-trigger-store-pg", version = "0.1.12", registry = "nora" }
# 内部依赖 - 服务端编译流水线核心（W1；隔离目录编 wasm）
cmx-build = { path = "crates/libs/cmx-build", version = "0.1.12", registry = "nora" }
# 内部依赖 - 构建作业 PG 存储（W1）
cmx-build-store-pg = { path = "crates/libs/cmx-build-store-pg", version = "0.1.12", registry = "nora" }
# 内部依赖 - 开发者工作区注册（W5·M0；孤儿端点归属）
cmx-dev-workspace = { path = "crates/libs/cmx-dev-workspace", version = "0.1.12", registry = "nora" }
# 内部依赖 - 自建 DAP 桥（W2-b 骨架：DAP 线协议 + cmx-debug 桥接）
cmx-dap = { path = "crates/libs/cmx-dap", version = "0.1.12", registry = "nora" }
# 内部依赖 - 调试
cmx-debug = { path = "crates/libs/cmx-debug", version = "0.1.12", registry = "nora" }
# 内部依赖 - AI 生成能力中继层（一期薄代理：转发 OpenCode + SSE 翻译）
cmx-ai = { path = "crates/libs/cmx-ai", version = "0.1.12", registry = "nora" }
# 内部依赖 - Nacos
#cmx-nacos = { path = "crates/libs/cmx-infra/cmx-nacos", version = "0.1.12", registry = "nora" }
# 内部依赖 - 注册中心与配置中心
cmx-registry-config = { path = "crates/libs/cmx-infra/cmx-registry-config", version = "0.1.12", registry = "nora" }
cmx-service-rpc = { path = "crates/libs/cmx-infra/cmx-service-rpc", version = "0.1.12", registry = "nora" }
cmx-flow-sdk = { path = "crates/libs/cmx-flow/cmx-flow-sdk", version = "0.1.12", registry = "nora" }
cmx-mdm-sdk = { path = "crates/libs/cmx-mdm/cmx-mdm-sdk", version = "0.1.12", registry = "nora" }
# 内部依赖 - RPC 代码生成
cmx-rpc-gen = { path = "crates/libs/cmx-rpc-gen", version = "0.1.12", registry = "nora" }
# 内部依赖 - RPC 皮肤（服务编排域 / 资源数据管理域 gRPC 皮肤）
cmx-orchestrator-rpc = { path = "crates/libs/cmx-rpcs/cmx-orchestrator-rpc", version = "0.1.12", registry = "nora" }
cmx-resource-rpc = { path = "crates/libs/cmx-rpcs/cmx-resource-rpc", version = "0.1.12", registry = "nora" }
# 内部依赖 - 存储
cmx-storage = { path = "crates/libs/cmx-infra/cmx-storage", version = "0.1.12", registry = "nora" }
# 内部依赖 - 审计日志
cmx-audit = { path = "crates/libs/cmx-infra/cmx-audit", version = "0.1.12", registry = "nora" }
cmx-auth = { path = "crates/libs/cmx-infra/cmx-auth", version = "0.1.12", registry = "nora" }
# 内部依赖 - 通用 HTTP 服务骨架（chassis）：flow/report/mdm-server 共用的启动/日志/中间件/优雅关闭骨架，零 cmx-api
cmx-web-chassis = { path = "crates/libs/cmx-web-chassis", version = "0.1.12", registry = "nora" }
cmx-web-monitor = { path = "crates/libs/cmx-web-monitor", version = "0.1.12", registry = "nora" }
cmx-service-base = { path = "crates/libs/cmx-service-base", version = "0.1.12", registry = "nora" }
cmx-platform-app = { path = "crates/libs/cmx-platform-app", version = "0.1.12", registry = "nora" }
# 内部依赖 - IAM 用户权限角色管理
cmx-iam = { path = "crates/libs/cmx-iam", version = "0.1.12", registry = "nora" }
# 内部依赖 - 门户/设计器业务（迁移自 CMXPortalManager / CMXHTMLDesigner 的 Node 后端）
cmx-portal = { path = "../cmx-portalservice/crates/cmx-portal", version = "0.1.12", registry = "nora" }
# 内部依赖 - 门户系列共享基础设施（config / error / fsutil / util）
cmx-jsonstore = { path = "crates/libs/cmx-jsonstore", version = "0.1.12", registry = "nora" }
# 内部依赖 - 表单中心（html_pages 相关：form / html / native 页面）
cmx-form = { path = "crates/libs/cmx-form", version = "0.1.12", registry = "nora" }
# 内部依赖 - 引擎应用层横切件单源（tenant 上下文 / dbid 路由 / 两族 auth 中间件 / resp 别名，五引擎 app 层共用）
cmx-engine-kit = { path = "crates/libs/cmx-engine-kit", version = "0.1.12", registry = "nora" }
# 内部依赖 - 模型中心元数据层（定义/FC/dict 读写，JSON 存储）
# 内部依赖 - 过程宏
cmx-macros = { path = "crates/libs/cmx-macros", version = "0.1.12", registry = "nora" }
# 内部依赖 - 流程引擎**平台反代薄壳**（FlowProxyModule 转发 /api/flow/* 到独立 flow-server）。
# 注：引擎各层 crate（cmx-flow-model/-bpmn/-engine/-store-pg/-def/-app）在独立 workspace
# ../cmx-flowengine/（S0），由那边的 cmx-flow-server 承载；门户只反代，**编译期不再依赖引擎源码**
# （曾经 cmx-flow-api → cmx-flow-app 的跨 ws path 依赖会把整个引擎拖进门户编译图，已切断）。
cmx-flow-api = { path = "crates/libs/cmx-flow/cmx-flow-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - 报表模块**平台反代薄壳**（ReportProxyModule 转发报表 API 到独立 cmx-rpt-server）。
# 注：报表引擎各层 crate（cmx-rpt-model/-formula/-store-pg/-app）在独立 workspace ../cmx-report/
# （对标 flow S0），由那边的 cmx-rpt-server 承载；门户只反代，**编译期不再依赖引擎源码**
# （曾经 cmx-rpt-api → cmx-rpt-app 的跨 ws path 依赖会把整个报表引擎拖进门户编译图，已切断）。
cmx-rpt-api = { path = "crates/libs/cmx-rpt/cmx-rpt-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - 决策规则引擎平台反代薄壳（proxy-only：RulesProxyModule + 页面反代；无内嵌，规则始终独立微服务）
cmx-rule-api = { path = "crates/libs/cmx-rule/cmx-rule-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - 本体平台平台反代薄壳（proxy-only：OntoProxyModule + 页面反代；无内嵌，与 rules 同构）
cmx-onto-api = { path = "crates/libs/cmx-onto/cmx-onto-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - 异步任务中心内核（作业状态机 + JobHandler/JobContext + JobManager + SSE 扇出，语义中立无 DB）
cmx-job-core = { path = "crates/libs/cmx-job/cmx-job-core", version = "0.1.12", registry = "nora" }
# 内部依赖 - 异步任务中心 PG 持久化（cmx_job_* 三表读写 + 崩溃恢复 + 历史查询）
cmx-job-store-pg = { path = "crates/libs/cmx-job/cmx-job-store-pg", version = "0.1.12", registry = "nora" }
# 内部依赖 - 异步任务中心 HTTP 层（薄 handler + SSE + JobModule 路由，web-server 合并，避免 cmx-api⇄cmx-job 环）
cmx-job-api = { path = "crates/libs/cmx-job/cmx-job-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - 业务单据（DOC）中立模型（DocMetaView/DocQuery/formula/rule/sql_builder，DB-free）
# 内部依赖 - 业务单据（DOC）PG 持久化/服务层（cv_* 表装载/回存 + ZmcDataSet 零拷贝 + 版本化）
# 内部依赖 - 业务单据（DOC）HTTP 层（薄 handler + DocModule 路由，web-server 合并，避免 cmx-api⇄cmx-doc 环）
# 内部依赖 - 数据字典（DCT）中立模型（DictView/SQL 构造/DTO，DB-free）
# 内部依赖 - 数据字典（DCT）PG 持久化/服务层（cf_* 表直读/写 + 校验/铸号 + ZmcDataSet 零拷贝）
# 内部依赖 - 数据字典（DCT）HTTP 层（薄 handler + DctModule 路由，web-server 合并，避免 cmx-api⇄cmx-dct 环）
# 内部依赖 - 主数据（MDM）平台反代薄壳（MdmProxyModule，proxy-only；反代到独立 cmx-mdm-server）
cmx-mdm-proxy = { path = "crates/libs/cmx-mdm/cmx-mdm-proxy", version = "0.1.12", registry = "nora" }
# 内部依赖 - 后端主从协调器（前端 CmxMasterSlave 的 Rust 对等物；近叶子，doc/dct 服务 impl 其 HierService）
cmx-master-slave = { path = "crates/libs/cmx-model/cmx-master-slave", version = "0.1.12", registry = "nora" }
# 内部依赖 - 定义 JSON 读取层（definitions store + resolve_dict_file；mdm 激活落库与门户 cmx-portal 公共依赖）
cmx-model-meta = { path = "crates/libs/cmx-model/cmx-model-meta", version = "0.1.12", registry = "nora" }
# 内部依赖 - DCT 字典模型层（DictMeta/查询过滤，openapi feature 可选）
cmx-dct-model = { path = "crates/libs/cmx-dct/cmx-dct-model", version = "0.1.12", registry = "nora" }
# 内部依赖 - DCT 字典 PG 存储层（dict_upsert/dict_meta 数据服务；mdm 激活/查重经此落库读典）
cmx-dct-store-pg = { path = "crates/libs/cmx-dct/cmx-dct-store-pg", version = "0.1.12", registry = "nora" }
# 内部依赖 - 编码引擎纯逻辑层（段定义/规则算法/Advance trait，无 DB/HTTP，DCT/DOC 钩子轻量依赖）
cmx-code-model = { path = "crates/libs/cmx-code/cmx-code-model", version = "0.1.12", registry = "nora" }
# 内部依赖 - 编码引擎 HTTP 层（CodeEngine 无状态实现，按 db_id 查 cmx_code_* 三表；mdm/model 各自注入）
cmx-code-api = { path = "crates/libs/cmx-code/cmx-code-api", version = "0.1.12", registry = "nora" }
# 内部依赖 - DOC 单据定义模型（表结构/校验/SQL 生成，sqlx 与 tokio-pg 通用 $N 占位 + DataValue 绑定）
cmx-doc-model = { path = "crates/libs/cmx-doc/cmx-doc-model", version = "0.1.12", registry = "nora" }
# 内部依赖 - DOC 单据 PG 存储层（装载/回存/版本化 + impl 主从 HierService 层级上卷）
cmx-doc-store-pg = { path = "crates/libs/cmx-doc/cmx-doc-store-pg", version = "0.1.12", registry = "nora" }
# 内部依赖 - 模型中心平台反代薄壳（ModelProxyModule，proxy-only；反代到独立 cmx-model-server）
cmx-model-proxy = { path = "crates/libs/cmx-model/cmx-model-proxy", version = "0.1.12", registry = "nora" }
# 内部依赖 - 元数据管理平台反代薄壳（MetaProxyModule，proxy-only；反代到独立 cmx-meta-server :8096）
cmx-meta-proxy = { path = "crates/libs/cmx-meta/cmx-meta-proxy", version = "0.1.12", registry = "nora" }
cmx-dataauth-proxy = { path = "crates/libs/cmx-dataauth/cmx-dataauth-proxy", version = "0.1.12", registry = "nora" }
# 编译期全局注册
inventory = "0.3"
# 对象存储访问层
opendal = { version = "0.55", features = ["services-s3", "services-fs"] }
# 文件 MIME Type 魔数检测
infer = "0.19"
# 基于扩展名的 MIME Type 推断
mime_guess = "2"
# MIME 类型
mime = "0.3"
# BPMN 2.0 XML 只读解析（DOM 式，零拷贝 borrow，流程引擎编译器用）
roxmltree = "0.20"

# 异步运行时 - tokio 提供完整的异步编程支持
tokio = { version = "1.41", features = ["full"] }

# 序列化框架
serde = { version = "1.0", features = ["derive"] }
# JSON 序列化/反序列化
# JSON 序列化/反序列化（preserve_order：保持对象键插入顺序，与 Node JSON.stringify 一致，
# 使 JSON 文件读写/补丁/对拍不因键重排产生噪声 diff）
serde_json = { version = "1.0", features = ["preserve_order"] }
# YAML 序列化/反序列化
serde_yaml = "0.9.33"
# serde 辅助宏
serde_with = { version = "3", features = ["time_0_3", "json"] }
# MessagePack 序列化
rmp = "0.8"
# MessagePack 序列化/反序列化
rmp-serde = "1.3"
# 字节切片序列化
serde_bytes = "0.11"

# 时间处理 - 日期时间库，支持日期时间的解析、计算和格式化
chrono = { version = "0.4", features = ["serde"] }
# 时间处理
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

# 错误处理 - 动态错误上下文，提供灵活的错误处理和传播
anyhow = "1.0"
# 错误处理 - 派生宏定义错误类型，用于自定义错误类型
thiserror = "2.0"

# 日志追踪 - 日志追踪框架，提供结构化的日志记录
tracing = "0.1"
# 日志订阅器 - 收集和导出日志事件，支持环境过滤
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 内存分配 - Arena 内存分配器，快速 bump 指针分配，适合短期 allocations
bumpalo = { version = "3.16", features = ["collections", "allocator-api2"] }
# 字节缓冲区 - 高效处理字节数据，常用于网络和 I/O
bytes = { version = "1.8", features = ["serde"] }

# WebAssembly 运行时 - 支持加载和执行 WASM 模块
wasmtime = "39.0.1"

# 命令行参数解析 - 支持派生宏定义 CLI 接口
clap = { version = "4", features = ["derive"] }

# 数据库 - SQL 异步查询框架
sqlx = { version = "0.9.0", features = ["macros", "runtime-tokio", "postgres", "mysql", "sqlite", "uuid", "chrono", "rust_decimal", "json"] }
# 数据库 - tokio-postgres 原生驱动（cmx-database-pg 专用，PG-only）
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
# 数据库 - tokio-postgres 连接池
deadpool-postgres = "0.14"
# 系统技术指标采集（CPU/内存/网络/磁盘）——通用监控 cmx-web-monitor 用；支持 darwin/linux/windows
