# Cargo Workspace 配置文件
[workspace]
# Workspace 成员列表,包含本项目的所有 crate
members = [
    "crates/libs/cmx-core",
    "crates/libs/cmx-utils",
    "crates/libs/cmx-metadata",
    "crates/libs/cmx-plugin",
    "crates/libs/cmx-traits",
    "crates/libs/cmx-runtime",
    "crates/libs/cmx-service",
    "crates/libs/cmx-infra/cmx-database",
    "crates/libs/cmx-infra/cmx-buffer",
    "crates/web/web-server",
    "crates/libs/cmx-api",
    "crates/libs/cmx-plugin-sdk",
    "crates/libs/cmx-wasmdemo",
    "crates/libs/cmx-debug",
    "sdk/cmx-cli",
#    "crates/tests/cmx-serde-test",
]
# 依赖版本解析器,"2" 表示使用新版解析器(支持 Edition 2021+)
resolver = "2"

# Workspace 包级别的元数据配置
[workspace.package]
# 项目版本号
version = "0.1.1"
# Rust Edition 版本，决定可用的语法特性
edition = "2024"
# 项目作者列表
authors = ["skylake@pansoft.com"]

# Workspace 依赖统一管理，所有成员 crate 可共享这些依赖
[workspace.dependencies]
# ============================================
# 内部依赖
# ============================================
# cmx-core: 项目内部核心库
cmx-core = { path = "crates/libs/cmx-core",version = "0.1.1" ,registry = "nora"}
# cmx-utils: 项目内部工具库
cmx-utils = { path = "crates/libs/cmx-utils" ,version = "0.1.1",registry = "nora"}
cmx-api = { path = "crates/libs/cmx-api" ,version = "0.1.1",registry = "nora"}
cmx-database = { path = "crates/libs/cmx-infra/cmx-database" ,version = "0.1.1",registry = "nora"}
cmx-buffer = { path = "crates/libs/cmx-infra/cmx-buffer" ,version = "0.1.1",registry = "nora"}
cmx-metadata = { path = "crates/libs/cmx-metadata" ,version = "0.1.1",registry = "nora"}
cmx-plugin = { path = "crates/libs/cmx-plugin" ,version = "0.1.1",registry = "nora"}
cmx-traits = { path = "crates/libs/cmx-traits" ,version = "0.1.1",registry = "nora"}
cmx-runtime = { path = "crates/libs/cmx-runtime" ,version = "0.1.1",registry = "nora"}
cmx-service = { path = "crates/libs/cmx-service" ,version = "0.1.1",registry = "nora"}
cmx-plugin-sdk = { path = "crates/libs/cmx-plugin-sdk" ,version = "0.1.1",registry = "nora"}
cmx-debug = { path = "crates/libs/cmx-debug" ,version = "0.1.0",registry = "nora"}


# ============================================
# 异步运行时
# ============================================
# tokio: 提供完整的异步编程支持
tokio = { version = "1.41", features = ["full"] }

# ============================================
# 序列化与数据格式
# ============================================
# serde: 序列化框架，支持结构体与数据格式的相互转换
serde = { version = "1.0", features = ["derive"] }
# serde_json: JSON 序列化/反序列化
serde_json = "1.0"
# serde_yaml: YAML 序列化/反序列化
serde_yaml = "0.9.33"
serde_with = {version = "3", features = ["time_0_3", "json"] }
# rmp_serde: MessagePack 序列化/反序列化
rmp = "0.8"
rmp-serde = "1.0"
# serde_bytes: 用于更高效地处理字节切片
serde_bytes = "0.11"
# ============================================
# 日期时间处理
# ============================================
# chrono: 日期时间库，支持日期时间的解析、计算和格式化
chrono = { version = "0.4", features = ["serde"] }
time = {version = "0.3", features = ["formatting", "parsing", "serde"]}
# ============================================
# 错误处理
# ============================================
# anyhow: 动态错误上下文，提供灵活的错误处理和传播
anyhow = "1.0"
# thiserror: 派生宏定义错误类型，用于自定义错误类型
thiserror = "2.0"

# ============================================
# 日志与追踪
# ============================================
# tracing: 日志追踪框架，提供结构化的日志记录
tracing = "0.1"
# tracing-subscriber: 日志订阅器，收集和导出日志事件，支持环境过滤
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ============================================
# 内存与字节处理
# ============================================
# bumpalo: Arena 内存分配器，快速 bump 指针分配，适合短期 allocations
bumpalo = { version = "3.16", features = ["collections", "allocator-api2"] }
# bytes: 字节缓冲区，高效处理字节数据，常用于网络和 I/O
bytes = "1.8"

# ============================================
# WebAssembly 支持
# ============================================
# wasmtime: WebAssembly 运行时，支持加载和执行 WASM 模块
wasmtime = "39.0.1"

# ============================================
# 高性能序列化框架
# ============================================
# rkyv: 零拷贝序列化框架,适用于高性能场景
rkyv = { version = "0.8", features = ["alloc", "bytecheck","uuid-1"] }

# ============================================
# 命令行参数解析
# ============================================
# clap: 命令行参数解析库，支持派生宏定义 CLI 接口
clap = { version = "4", features = ["derive"] }

# ============================================
# 数据库相关
# ============================================
sqlx = { version = "0.8", features = [ "macros", "runtime-tokio", "postgres", "uuid" ] }
sea-query = {version = "0.32",features = ["with-chrono", "with-time","with-json","with-uuid"]}
sea-query-binder = { version = "0.7", features = ["sqlx-postgres", "with-uuid", "with-time","with-chrono" ,"with-json"] }
modql = "0.4.1"

# ============================================
# web相关
# =================
axum = {version = "0.8", features = ["macros", "multipart"]}
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-full", "timeout","limit"] }
tower-cookies = "0.11"


#第三方派生宏（derive macro）库
derive_more = {version = "1.0.0-beta", features = ["from", "display"] }
# 配置
config={version = "0.15", features = ["toml","yaml","json"]}
# 环境变量
dotenvy = "0.15"

uuid={version = "1.21"}
regex = "1"

# HTTP 客户端
reqwest = { version = "0.12",default-features = false, features = ["json","rustls-tls"] }

# ============================================
# 异步与并发
# ============================================
futures = "0.3"

# ============================================
# 验证
validator = { version = "0.18", features = ["derive"] }
validator_macros = "0.18"
# HTTP 日期处理
http-date = "0.3"
#生成openapi规范文档
utoipa = { version = "5", features = ["axum_extras", "chrono","decimal","uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
#使trait中的异步函数能够与动态特征配合使用
async-trait = "0.1"


[profile.dev]
# 优化级别：0=关闭，1=基本，2=中等，3=激进
# 调试时必须设为0，否则变量可能被优化掉无法调试
opt-level = 0

# 调试信息级别：0=无，1=行号，2=完整调试信息
# 设为2确保生成完整的DWARF/PDB调试信息
debug = 2  # 注意：true 会被转换为2，但显式写2更明确

# 是否剥离符号：调试时必须设为false
# 如果为true，调试器将无法找到变量和函数名
strip = false

# 启用调试断言：在开发时检查各种不变式
# 包括数组越界、空指针等，发布时应关闭以提高性能
debug-assertions = true

# 启用整数溢出检查：开发时检测算术溢出
# 发布时通常关闭，溢出会回绕（wrapping arithmetic）
overflow-checks = true

# 链接时优化：关闭以加速编译和便于调试
# 如果开启，编译器会进行跨crate的激进优化，破坏调试信息
lto = false

# 代码生成单元数：影响并行编译粒度
# 值越大编译越快但优化越少，值越小优化越好但编译越慢
# 256 是较大的值，适合开发时的快速迭代
codegen-units = 256

# 恐慌处理策略：'unwind'=展开调用栈，'abort'=立即终止
# 'unwind' 可以捕获 panic 信息，便于调试
panic = 'unwind'

# 增量编译：开启以加速重复构建
# 只重新编译改变的部分，显著提升开发效率
# 但在某些复杂情况下可能导致奇怪的编译错误
incremental = true

# 运行时路径：是否在可执行文件中嵌入库搜索路径
# 开发时通常关闭，发布到特定环境时可能需要开启
rpath = false
