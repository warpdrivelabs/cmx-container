[redis]
url = "redis://192.168.137.95:32496/13"
#url = "redis://192.168.1.14:6379/13"
# Redis 运行模式：Standalone（单机）或 Cluster（集群）
#mode = "Standalone"
# 集群节点地址（集群模式时必填，逗号分隔）
# cluster_urls = "redis://node1:6379,redis://node2:6379,redis://node3:6379"
# Pub/Sub 心跳间隔（秒），0 表示禁用
# heartbeat_interval = 30
# 启动时自动订阅的频道（逗号分隔，需填写完整频道名，不会自动加前缀）
# subscribe_channels = "cmx:plugin:changed"
# 启动时自动订阅的模式（逗号分隔，支持通配符 * ? []，需填写完整模式，不会自动加前缀）
# subscribe_patterns = "cmx:*"



[templates]
# 模板目录路径
path = "crates/libs/cmx-dev/templates"

[code_server]
# code-server URL
url = "https://dev.cloudmatrix.one:18080/"

[code_server_extension_server]
# code-server 扩展服务器 URL，用于自调试
url = "http://127.0.0.1:9000"


#WASM运行时相关配置
[runtime]
# 内存限制（页数），每页 64KB，默认 4096 页（256MB）
memory_max = 4096
# 单次调用超时时间（秒），默认 30
timeout = 30
# 实例池最大实例数，默认使用 CPU 核心数
pool_max_instances = 8
# Fuel 限制（0 表示不限制，单位：Wasm 指令数）
fuel_limit = 0

#插件相关配置
[plugin]
# 插件安装根目录
install_root = "plugins/root"
# 插件备份目录
backup_root = "plugins/backup"
# 插件解压临时目录
temp_root = "plugins/temp"
# 插件上传临时目录
upload_root = "plugins/uploads"

# 定时一致性校验间隔（秒），对比数据库与本地 Registry，自动补偿差异
# 设为 0 禁用定时校验，默认 60
# reconciliation_interval_secs = 60

# 自动安装配置
[plugin.auto_install]
enabled = false

# 本地文件来源示例
# [[plugin.auto_install.plugins]]
# plugin_id = "cmx-debug"
# version = "1.0.0"
# source_type = "local"
# source_path = "plugins/source/cmx-debug.zip"
# is_critical = true


#数据库迁移相关配置
[migration]
# 是否启用迁移（可选，默认 false）
# 启用后会执行待执行的数据库迁移
enabled = false
# 迁移文件目录
dir = "docs/sql/migrations"
# 校验文件内容是否被修改，默认值true
validate_checksum = false
# 分布式锁超时时间（秒）
lock_timeout = 60

# ============================================
# 文件存储配置
# ============================================
[storage]
default_platform = "minio"

# 本地文件系统存储
[[storage.instances]]
platform = "local"
storage_type = "local"
enable_storage = true
domain = "http://localhost:8080/files/"
base_path = "uploads"
storage_path = "./storage"
enable_access = true
path_patterns = "/files/**"

# MinIO (S3 兼容) 存储
[[storage.instances]]
platform = "minio"
storage_type = "s3"
enable_storage = true
access_key = "Wa8GQ78My7d0b4AedpLS"
secret_key = "3T0IYmsQP0OeBqKZ1jB5tk3pLmMD3ZT97AnNFIXV"
region = "us-east-1"
endpoint = "http://192.168.1.14:9000/"
bucket_name = "cmx-bucket"
domain = "http://192.168.1.14:9000/"
base_path = "cmx-server/"

# ============================================
# 基础服务中心配置
# ============================================
[center_client]
# 模式：mock（默认）| http_url（URL 直连）| http_discovery（服务发现）| grpc（gRPC 调用）
mode = "mock"
# 请求超时（毫秒，仅 http_url / http_discovery 模式生效）
timeout_ms = 30000

# URL 直连模式（mode = "http_url" 时生效）
# 环境变量覆盖：CENTER_CLIENT__URLS__MENU, CENTER_CLIENT__URLS__PERM 等
[center_client.urls]
# menu = "http://portal-center:8080/api/plugin/menu/import"
# perm = "http://perm-center:8080/api/iam/permissions/import"
# form = "http://form-center:8080/api/plugin/form/import"
# flow = "http://flow-center:8080/api/plugin/flow/import"

# 服务发现模式（mode = "http_discovery" 或 "grpc" 时生效）
# [center_client.discovery]
# nacos_group = "DEFAULT_GROUP"
# menu_service = "cmx-portal-center"
# perm_service = "cmx-perm-center"
# form_service = "cmx-form-center"
# flow_service = "cmx-flow-center"


# ============================================
# RPC 配置
# ============================================
[rpc]
# 是否启用 RPC（可选，默认 false）
enabled = true
# 通信协议（目前仅支持 "grpc"）
protocol = "grpc"
# 预热服务列表（启动时预先发现的服务名）
warmup_services = []

[rpc.grpc]
# gRPC 监听端口
port = 9090
# RPC 调用超时时间（毫秒，可选，默认 5000），通过 volo rpc_timeout 设置
timeout_ms = 5000
# 连接超时时间（毫秒，可选，默认 3000），通过 volo connect_timeout 设置
connect_timeout_ms = 3000
# 重试次数（可选，默认 0，仅对可重试错误重试：UNAVAILABLE/DEADLINE_EXCEEDED/RESOURCE_EXHAUSTED/ABORTED）
retry_count = 0
# 默认服务分组（可选，None 表示不按分组过滤，用于多机房/多 region 部署）
# default_group = "DEFAULT_GROUP"
# 默认集群列表（可选，空表示不过滤，用于多机房/多 region 部署）
# default_clusters = []
# 服务发现变更通知通道容量（可选，默认 1024，用于缓冲高频服务变更如 k8s 滚动更新）
# discover_channel_capacity = 1024

# ============================================
# 认证配置
# ============================================

# 默认 API Key（开发环境使用，生产环境请删除并改为环境变量注入）
# 使用方法：将 key 值作为 X-API-Key 请求头
[[auth.static_api_keys]]
key = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6"
service_name = "dev-internal"
description = "开发环境默认 API Key"
#[auth]
#whitelist = ["/api/**"]


# ==================== OAuth2 配置（可选） ====================
[auth.oauth2]
# === Authorization Server 配置 ===
# 授权码有效期（秒），默认 600（10 分钟）
# auth_code_ttl_secs = 600
# 是否强制 PKCE（默认 true，生产环境建议开启）
# pkce_required = true

# === 第三方 OAuth2 Provider 对接 ===
# Provider state 有效期（秒），默认 600
# state_ttl_secs = 600
# 回调授权码有效期（秒），默认 30
# callback_code_ttl_secs = 30
# 第三方 OAuth2 登录成功后重定向到前端的 URL
# 回调时拼接为：{frontend_callback_url}?code={one_time_code}&state={original_state}
 frontend_callback_url = "http://127.0.0.1:8080"

# 第三方账号关联策略
[auth.oauth2.account_link]
# 是否根据邮箱自动关联已有本地用户（默认 false，要求 Provider 邮箱已验证）
 auto_link_by_email = false
# 是否根据用户名自动关联已有本地用户（默认 false，企业场景常用）
# 仅对可信 Provider 启用：username 无"已验证"概念，恶意 Provider 可关联任意本地账号
auto_link_by_username = true
# 是否自动注册新用户（默认 true，需手动绑定或管理员创建）
auto_register = true
# 自动注册时的默认角色（role_code，如 "user"）
default_role = "user"
# 用户名生成策略：provider_prefix | provider_user_id | username | email_prefix | display_name
# - provider_prefix: {provider}_{provider_user_id}，如 google_1234567890
# - provider_user_id: 直接使用 Provider 用户 ID，如 1234567890
# - username: 直接使用 Provider 返回的 username 字段，缺失时回退到 username
# - email_prefix: 邮箱 @ 前部分，如 user from user@gmail.com
# - display_name: 使用昵称，冲突时追加随机后缀
username_strategy = "username"


# === 通用 OAuth2 Provider 示例（适用于任何标准 OAuth2 服务） ===
[[auth.oauth2.providers]]
name = "ospiam"
display_name = "ospiam"
provider_type = "generic"
client_id = "1d392d8850994349905d829dfd4fad18"
client_secret = "0bf5a1928f4b4026bd1dc01dea98615c"
redirect_uri = "http://127.0.0.1:8080/api/auth/oauth2/ospiam/callback"
authorize_url = "http://192.168.137.95:31363/OSPIam/oauth/v20/authorize"
token_url = "http://192.168.137.95:31363/OSPIam/oauth/v20/token"
userinfo_url = "http://192.168.137.95:31363/OSPIam/api/oauth/v20/me"
scopes = ["read"]
token_endpoint_auth_method = "client_secret_post"
enabled = true
# 字段映射使用内联表（标准字段名 = JSON 字段名，支持 number 类型自动转 string）
field_mapping = { provider_user_id = "sub", email = "email", username = "username", display_name = "username", avatar_url = "avatar_url" }

# === 通用 Provider 高级配置（企业 CAS / 自定义 OAuth2 服务） ===
# Token 响应嵌套路径（点分路径，如 "data"，空字符串表示无包装）
token_response_path = ""
# Token 响应字段映射（标准字段名 = 厂商字段名）
token_field_mapping = { access_token = "access_token", expires_in = "expires_in" }
# 用户信息端点请求方法：GET（默认）或 POST
userinfo_method = "GET"
# 用户信息端点 token 传递方式：bearer（默认）/ query / form
userinfo_token_param = "bearer"
# 用户信息响应嵌套路径（点分路径，如 "data"）
userinfo_response_path = ""
# 是否跳过 SSL 证书验证（仅内网自签名证书场景，默认 false）
 skip_ssl_verification = false